appId: com.lilac.anime.nativempvprobe
productName: Lilac Native mpv Layer Probe
directories:
  output: dist-native-layer-probe
files:
  - electron/native-layer-local-probe.cjs
  - package.json
extraMetadata:
  main: electron/native-layer-local-probe.cjs
extraResources:
  - from: electron/win32-mpv-host.exe
    to: probe-native/win32-mpv-host.exe
  - from: electron/win32-screen-pixel.exe
    to: probe-native/win32-screen-pixel.exe
win:
  icon: build/icon.ico
  executableName: LilacNativeMpvLayerProbe
  target:
    - target: portable
      arch:
        - x64
  artifactName: LilacNativeMpvLayerProbe.${ext}
