name: Libmpv R2P subtitle UI release

on:
  push:
    branches: [libmpv-r2p-subtitle-ui]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2p-subtitle-ui-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_TAG: v0.5.49
  UPSTREAM_SHA: e67c86d40aa0d7fa84db06d9151f6a097b5099ad
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_SOURCE_COMMIT: 78e643838b168ac961dd9631d1225b5ac8fc8ec6
  QUALIFICATION_RELEASE_TAG: libmpv-hwq-r2i-pipeline-78e643838b16
  QUALIFICATION_EXE_SHA256: 6d06dcf1543c7ec69488ce0718d846a2e525e04ee56ad17dbc686fef54ebb395
  QUALIFICATION_MANIFEST_SHA256: c18543c10de436dd66544aed5fca6879fca258f1bd875a91b4d7bf17ea738b8e
  CUSTOM_RELEASE_TAG: libmpv-r2k-v0.5.49-r6
  INSTALLER_NAME: LilacAnime-Libmpv-R2P-Setup.exe

jobs:
  build-r2p:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Overlay exact upstream Lilac 0.5.49 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.49'
          Remove-Item $up -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 --branch $env:UPSTREAM_TAG https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          $sha=(git -C $up rev-parse HEAD).Trim()
          if($sha -ne $env:UPSTREAM_SHA){throw "upstream tag moved: $sha"}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          if((node -p "require('./package.json').version") -ne '0.5.49'){throw 'upstream version mismatch'}
          Write-Host "R2P_UPSTREAM_OVERLAY_OK sha=$sha"

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18

      - name: Syntax-check transforms and qualification tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($s in @(
            'scripts/normalize-libmpv-r2p-subtitle-anchor.cjs',
            'scripts/apply-libmpv-r2p-subtitle-ui.cjs',
            'scripts/rebundle-libmpv-r2p.cjs',
            'scripts/smoke-libmpv-r2p-subtitle-ui.cjs',
            'scripts/smoke-libmpv-r2p-pip-policy.cjs',
            'scripts/smoke-libmpv-r2p-pipeline-untouched.cjs',
            'scripts/smoke-libmpv-r2p-package-policy.cjs',
            'scripts/smoke-libmpv-r2p-updater.cjs',
            'scripts/smoke-libmpv-r2m-open-race.cjs',
            'scripts/smoke-libmpv-r2m-key-ui.cjs',
            'scripts/smoke-libmpv-r2n-webgpu-pip.cjs')){
            node --check $s
            if($LASTEXITCODE -ne 0){throw "syntax failed: $s"}
          }
          Write-Host 'R2P_PATCH_SYNTAX_OK'

      - name: Apply qualified R2I through R2P transforms
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs',
            'scripts/apply-libmpv-r2-runtime-fixes.cjs',
            'scripts/apply-libmpv-r2b-command-import-diagnostics.cjs',
            'scripts/apply-libmpv-r2c-texture-pool.cjs',
            'scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs',
            'scripts/apply-libmpv-r2g-electron44-releasefix.cjs',
            'scripts/apply-libmpv-r2h-webgpu-copy.cjs',
            'scripts/apply-libmpv-r2i-pipeline-headroom.cjs',
            'scripts/apply-libmpv-r2h-bundle-marker-fix.cjs',
            'scripts/apply-libmpv-r2j-subtitle-overlay.cjs',
            'scripts/apply-libmpv-r2k-upstream-polish.cjs',
            'scripts/apply-libmpv-r2l-player-polish.cjs',
            'scripts/apply-libmpv-r2m-open-race-key-ui.cjs',
            'scripts/apply-libmpv-shared-texture.cjs',
            'scripts/apply-libmpv-r2e-native-command-gates.cjs',
            'scripts/apply-libmpv-r2m-finalize.cjs',
            'scripts/apply-libmpv-r2n-webgpu-pip.cjs',
            'scripts/normalize-libmpv-r2p-subtitle-anchor.cjs',
            'scripts/apply-libmpv-r2p-subtitle-ui.cjs')
          foreach($s in $scripts){
            node --check $s
            if($LASTEXITCODE -ne 0){throw "syntax failed: $s"}
            node $s
            if($LASTEXITCODE -ne 0){throw "transform failed: $s"}
          }
          node scripts/rebundle-libmpv-r2p.cjs
          if($LASTEXITCODE -ne 0){throw 'R2P renderer rebundle failed'}
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          $electron=node -p "require('electron/package.json').version"
          $version=node -p "require('./package.json').version"
          $tag=node -p "require('./package.json').lilacCustomTag"
          if($electron -ne $env:ELECTRON_VERSION){throw "Electron mismatch: $electron"}
          if($version -ne '0.5.49-libmpv-r2p.rc1' -or $tag -ne $env:CUSTOM_RELEASE_TAG){throw "R2P metadata mismatch: $version / $tag"}
          foreach($s in @('electron/updater.cjs','src/libmpv-shared-entry.js','src/libmpv-shared.generated.js','src/player.js','src/app.js')){
            node --check $s
            if($LASTEXITCODE -ne 0){throw "post-transform syntax failed: $s"}
          }
          Write-Host 'R2P_TRANSFORMS_APPLIED_OK'

      - name: Verify R2P source policy before native binding
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/smoke-libmpv-r2p-pipeline-untouched.cjs
          if($LASTEXITCODE -ne 0){throw 'R2P pipeline invariant failed'}
          node scripts/smoke-libmpv-r2p-package-policy.cjs .
          if($LASTEXITCODE -ne 0){throw 'R2P source policy failed'}

      - name: Bind exact real-hardware-qualified native payload
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $q=Join-Path $env:RUNNER_TEMP 'qualified-r2i'
          New-Item -ItemType Directory -Force -Path $q|Out-Null
          gh release download $env:QUALIFICATION_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $q --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe' --pattern 'qualification-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'qualification download failed'}
          $exe=Join-Path $q 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe'
          $manifest=Join-Path $q 'qualification-manifest.json'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_EXE_SHA256){throw 'qualification EXE SHA mismatch'}
          if((Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_MANIFEST_SHA256){throw 'qualification manifest SHA mismatch'}
          $m=Get-Content $manifest -Raw|ConvertFrom-Json
          if($m.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT -or $m.electronVersion -ne $env:ELECTRON_VERSION){throw 'qualification provenance mismatch'}
          $raw=Join-Path $env:RUNNER_TEMP 'q-extract'
          $nested=Join-Path $env:RUNNER_TEMP 'q-nested'
          New-Item -ItemType Directory -Force -Path $raw,$nested|Out-Null
          7z.exe x $exe "-o$raw" -y|Out-Null
          function FindPayload([string]$name){ Get-ChildItem $raw,$nested -Recurse -File -Filter $name -ErrorAction SilentlyContinue|Select-Object -First 1 }
          $addon=FindPayload 'lilac-libmpv-player-bridge.node'
          $dll=FindPayload 'libmpv-2.dll'
          if(-not $addon -or -not $dll){
            $i=0
            foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){
              $i++
              $out=Join-Path $nested "a$i"
              New-Item -ItemType Directory -Force -Path $out|Out-Null
              7z.exe x $a.FullName "-o$out" -y|Out-Null
              $addon=FindPayload 'lilac-libmpv-player-bridge.node'
              $dll=FindPayload 'libmpv-2.dll'
              if($addon -and $dll){break}
            }
          }
          if(-not $addon -or -not $dll){throw 'qualified native payload missing'}
          $expectedAddon=[string]$m.payloadSha256.PSObject.Properties['electron/lilac-libmpv-player-bridge.node'].Value
          $expectedDll=[string]$m.payloadSha256.PSObject.Properties['electron/libmpv-2.dll'].Value
          $addonHash=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $dllHash=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($addonHash -ne $expectedAddon -or $dllHash -ne $expectedDll){throw 'qualified native hash mismatch'}
          Copy-Item $addon.FullName electron/lilac-libmpv-player-bridge.node -Force
          Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          "QUALIFIED_ADDON_SHA256=$addonHash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "QUALIFIED_DLL_SHA256=$dllHash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2P_EXACT_NATIVE_REUSED addon=$addonHash dll=$dllHash"

      - name: Prove subtitle keyboard reopen PiP and updater behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($s in @('scripts/smoke-libmpv-vtt-overlay.cjs','scripts/smoke-libmpv-r2p-subtitle-ui.cjs','scripts/smoke-libmpv-r2m-open-race.cjs','scripts/smoke-libmpv-r2l-vtt-position.cjs')){
            npx.cmd electron $s
            if($LASTEXITCODE -ne 0){throw "Electron UI smoke failed: $s"}
          }
          node scripts/smoke-libmpv-r2m-key-ui.cjs
          if($LASTEXITCODE -ne 0){throw 'R2M key UI smoke failed'}
          node scripts/smoke-libmpv-r2p-pip-policy.cjs
          if($LASTEXITCODE -ne 0){throw 'R2P PiP policy smoke failed'}
          node scripts/smoke-libmpv-r2p-updater.cjs
          if($LASTEXITCODE -ne 0){throw 'R2P updater smoke failed'}
          npx.cmd electron scripts/smoke-libmpv-r2n-webgpu-pip.cjs
          if($LASTEXITCODE -ne 0){throw 'WebGPU PiP E2E smoke failed'}
          Write-Host 'R2P_BEHAVIOR_SMOKES_OK'

      - name: Run retained libmpv and upstream 0.5.49 regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LILAC_LIBMPV_PLAYER_ADDON=(Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path
          $env:LILAC_LIBMPV_DLL=(Resolve-Path 'electron/libmpv-2.dll').Path
          $env:ELECTRON_RUN_AS_NODE='1'
          foreach($s in @('scripts/smoke-libmpv-native-retention-fhd.cjs','scripts/smoke-libmpv-native-command-roundtrip.cjs','scripts/smoke-libmpv-r2-pump-sim.cjs','scripts/smoke-libmpv-relay-av.cjs')){
            npx.cmd electron $s
            if($LASTEXITCODE -ne 0){throw "runtime regression failed: $s"}
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer input regression failed'}
          node --test tests/player-interactions.test.cjs tests/community-matching.test.cjs tests/community-search.test.cjs tests/reanime-audio.test.cjs tests/stream-ad-filter.test.cjs tests/subtitle-sync.test.cjs tests/subtitle-translator.test.cjs tests/whisper.test.cjs tests/watermark-learner.test.cjs tests/window-buttons.test.cjs
          if($LASTEXITCODE -ne 0){throw '0.5.49 regression suite failed'}
          node scripts/smoke-flix-proxy-fixture.cjs
          if($LASTEXITCODE -ne 0){throw 'Flix fixture regression failed'}
          Write-Host 'R2P_REGRESSIONS_OK'

      - name: Verify exact native identity after regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $addon=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant()
          $dll=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($addon -ne $env:QUALIFIED_ADDON_SHA256){throw 'addon identity changed'}
          if($dll -ne $env:QUALIFIED_DLL_SHA256){throw 'DLL identity changed'}
          node scripts/smoke-libmpv-r2p-package-policy.cjs .
          if($LASTEXITCODE -ne 0){throw 'R2P source policy regressed'}
          Write-Host 'R2P_ARCHITECTURE_IDENTITY_OK subtitles=adjustable keyReveal=none pip=direct-webgpu-capture cpuReadback=0 native=exact'

      - name: Build Windows R2P installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npx.cmd electron-builder --win nsis --publish never
          if($LASTEXITCODE -ne 0){throw 'electron-builder failed'}

      - name: Verify packaged installer payload and R2P features
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem dist -File -Filter $env:INSTALLER_NAME|Select-Object -First 1
          if(-not $installer){throw 'R2P installer missing'}
          $raw=Join-Path $env:RUNNER_TEMP 'r2p-installer'
          $nested=Join-Path $env:RUNNER_TEMP 'r2p-nested'
          $asarOut=Join-Path $env:RUNNER_TEMP 'r2p-asar'
          New-Item -ItemType Directory -Force -Path $raw,$nested,$asarOut|Out-Null
          7z.exe x $installer.FullName "-o$raw" -y|Out-Null
          $i=0
          foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){
            $i++
            $out=Join-Path $nested "a$i"
            New-Item -ItemType Directory -Force -Path $out|Out-Null
            7z.exe x $a.FullName "-o$out" -y|Out-Null
          }
          $addon=Get-ChildItem $raw,$nested -Recurse -File -Filter 'lilac-libmpv-player-bridge.node'|Select-Object -First 1
          $dll=Get-ChildItem $raw,$nested -Recurse -File -Filter 'libmpv-2.dll'|Select-Object -First 1
          if(-not $addon -or -not $dll){throw 'packaged native payload missing'}
          if((Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_ADDON_SHA256){throw 'packaged addon mismatch'}
          if((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_DLL_SHA256){throw 'packaged DLL mismatch'}
          $asar=Get-ChildItem $raw,$nested -Recurse -File -Filter 'app.asar'|Select-Object -First 1
          if(-not $asar){throw 'app.asar missing'}
          npx.cmd asar extract $asar.FullName $asarOut
          if($LASTEXITCODE -ne 0){throw 'asar extract failed'}
          node scripts/smoke-libmpv-r2p-package-policy.cjs $asarOut
          if($LASTEXITCODE -ne 0){throw 'packaged R2P policy failed'}
          $hash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "R2P_INSTALLER_PATH=$($installer.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "R2P_INSTALLER_SHA256=$hash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "R2P_INSTALLER_BYTES=$($installer.Length)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2P_PACKAGED_VERIFY_OK bytes=$($installer.Length) sha=$hash subtitleControls=4 preset=95/10/650/2.25/82/120/55 native=exact"

      - name: Create checksum and attestation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-Item $env:R2P_INSTALLER_PATH
          $checksum=Join-Path $installer.DirectoryName 'LilacAnime-Libmpv-R2P-Setup.sha256.txt'
          [IO.File]::WriteAllText($checksum,"$env:R2P_INSTALLER_SHA256  $($installer.Name)`n",(New-Object Text.UTF8Encoding($false)))
          $attestation=[ordered]@{
            tag=$env:CUSTOM_RELEASE_TAG
            commit=$env:GITHUB_SHA
            upstreamTag=$env:UPSTREAM_TAG
            upstreamSha=$env:UPSTREAM_SHA
            electron=$env:ELECTRON_VERSION
            installer=$installer.Name
            installerBytes=[int64]$env:R2P_INSTALLER_BYTES
            installerSha256=$env:R2P_INSTALLER_SHA256
            nativeAddonSha256=$env:QUALIFIED_ADDON_SHA256
            nativeDllSha256=$env:QUALIFIED_DLL_SHA256
            subtitlePreset=[ordered]@{size=95;position=10;weight=650;outline=2.25;maxWidth=82;lineHeight=120;shadow=55;fileColors=$false}
            subtitleControls=@('weight','outline','maxWidth','lineHeight','shadow')
            keyboardControlsReveal=$false
            pip='direct-webgpu-canvas-capture'
            cpuReadback=$false
          }
          $attestationPath=Join-Path $installer.DirectoryName 'LilacAnime-Libmpv-R2P-attestation.json'
          $attestation|ConvertTo-Json -Depth 6|Set-Content $attestationPath -Encoding utf8
          $parsed=Get-Content $attestationPath -Raw|ConvertFrom-Json
          if($parsed.installerSha256 -ne $env:R2P_INSTALLER_SHA256 -or $parsed.tag -ne $env:CUSTOM_RELEASE_TAG){throw 'attestation verification failed'}
          Write-Host 'R2P_ATTESTATION_OK'

      - name: Upload qualified R2P installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-Libmpv-R2P-r6
          path: |
            dist/LilacAnime-Libmpv-R2P-Setup.exe
            dist/LilacAnime-Libmpv-R2P-Setup.sha256.txt
            dist/LilacAnime-Libmpv-R2P-attestation.json
          if-no-files-found: error

      - name: Publish R2P r6 prerelease on custom channel
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release view $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY >nul 2>nul"
          $releaseExists=($LASTEXITCODE -eq 0)
          if($releaseExists){
            gh release delete $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes
            if($LASTEXITCODE -ne 0){throw 'existing R2P release delete failed'}
            git push origin ":refs/tags/$env:CUSTOM_RELEASE_TAG" 2>$null
          }
          $notes=@"
LilacAnime libmpv/WebGPU R2P r6 prerelease.

Subtitle UI:
- numeric font weight control (400-800), default 650 for new setting
- outline control with 0.25px precision
- max subtitle width control (60-95%), default 82%
- line-height control (100-150%), default 120%
- shadow strength control (0-100%), default 55%
- one-click recommended preset: size 95%, position 10%, weight 650, outline 2.25px, max width 82%, line height 120%, shadow 55%, file colors off
- existing user size/position/outline values are not silently overwritten; the full recommended preset is applied only when requested

Retained:
- exact hardware-qualified Electron 44.9.3 libmpv payload
- stale EOF reopen-race fix
- keyboard shortcuts never reveal the full player controls/gradients
- direct WebGPU canvas PiP capture path without explicit CPU readback
"@
          gh release create $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "LilacAnime Libmpv R2P r6" --notes $notes dist/LilacAnime-Libmpv-R2P-Setup.exe dist/LilacAnime-Libmpv-R2P-Setup.sha256.txt dist/LilacAnime-Libmpv-R2P-attestation.json
          if($LASTEXITCODE -ne 0){throw 'R2P release creation failed'}
          Write-Host "R2P_RELEASE_PUBLISHED tag=$env:CUSTOM_RELEASE_TAG sha=$env:R2P_INSTALLER_SHA256"
