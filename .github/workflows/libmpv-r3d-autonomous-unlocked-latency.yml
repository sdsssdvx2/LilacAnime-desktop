name: LilacAnime libmpv R3D autonomous unlocked latency

on:
  push:
    branches: [libmpv-r3d-stall-isolation-r13]
    paths: [.github/workflows/libmpv-r3d-autonomous-unlocked-latency.yml]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3d-autonomous-unlocked-latency
  cancel-in-progress: true
permissions:
  contents: read

env:
  R3D_PRODUCT_SHA: 79eb1e6bee586e3b3168ab592ca08cc45b8a3470
  R3D_TEST_SHA: b7b0a041fd3c5fe3fee8dbdc99b1e223bc6cfbf5
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a

jobs:
  unlocked-latency:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Pin unlocked probe and prove product isolation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:R3D_TEST_SHA
          if((git rev-parse HEAD).Trim() -ne $env:R3D_TEST_SHA){throw 'test pin mismatch'}
          git diff --quiet $env:R3D_PRODUCT_SHA $env:R3D_TEST_SHA -- electron src native package.json package-lock.json scripts/apply-libmpv-r3d-stall-isolation.cjs
          if($LASTEXITCODE -ne 0){throw 'production source changed after product pin'}
          foreach($p in @('scripts/apply-libmpv-r3d-autonomous-producer-probe.cjs','scripts/apply-libmpv-r3d-autonomous-producer-probe-compat.cjs','scripts/apply-libmpv-r3d-autonomous-producer-probe-stopfix.cjs','scripts/apply-libmpv-r3d-autonomous-producer-probe-stopfix-v2.cjs','scripts/apply-libmpv-r3d-autonomous-producer-unlocked-render.cjs','scripts/smoke-libmpv-r3d-autonomous-unlocked-latency.cjs','scripts/smoke-libmpv-r3d-autonomous-js-block-v2.cjs')){
            node --check $p
            if($LASTEXITCODE -ne 0){throw "syntax failed $p"}
          }
      - name: Reproduce exact upstream through R3D
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'upstream-05050'
          git clone --depth 1 --branch v0.5.50 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0 -or (git -C $up rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA){throw 'upstream pin mismatch'}
          Copy-Item (Join-Path $up 'electron/*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src/*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests/*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts/anime4k-entry.mjs') scripts/anime4k-entry.mjs -Force
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 node-gyp@12.2.0
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          $scripts=@('scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs','scripts/apply-libmpv-r2w-aspect-cadence.cjs','scripts/apply-libmpv-r2x-vsync-fullscreen.cjs','scripts/apply-libmpv-r2x-pipeline-diagnostics.cjs','scripts/rebundle-libmpv-r2x-preload.cjs','scripts/apply-libmpv-r2y-cadence-fix.cjs','scripts/apply-libmpv-r2y-timestamp-phase.cjs','scripts/apply-libmpv-r2z-direct-present-ui-fixed.cjs','scripts/apply-libmpv-r3a-decoupled-delivery.cjs','scripts/apply-libmpv-r3a-poll-cadence-fix.cjs','scripts/apply-libmpv-r3a-phase-deadline.cjs','scripts/apply-libmpv-r3b-update-callback.cjs','scripts/apply-libmpv-r3b-pending-wake.cjs','scripts/apply-libmpv-r3c-hotpath-state.cjs','scripts/apply-libmpv-r3d-stall-isolation.cjs')
          foreach($s in $scripts){node $s;if($LASTEXITCODE -ne 0){throw "transform failed $s"}}
          node scripts/rebundle-libmpv-r2v.cjs
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 node-gyp@12.2.0
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r3d.rc1'){throw 'R3D identity mismatch'}
      - name: Apply autonomous unlocked-render probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('scripts/apply-libmpv-r3d-autonomous-producer-probe.cjs','scripts/apply-libmpv-r3d-autonomous-producer-probe-compat.cjs','scripts/apply-libmpv-r3d-autonomous-producer-probe-stopfix.cjs','scripts/apply-libmpv-r3d-autonomous-producer-probe-stopfix-v2.cjs','scripts/apply-libmpv-r3d-autonomous-producer-unlocked-render.cjs')){
            node $p
            if($LASTEXITCODE -ne 0){throw "probe transform failed $p"}
          }
          $n=Get-Content native/libmpv-d3d11-bridge/player_addon.cc -Raw
          foreach($m in @('before the potentially slow libmpv/D3D11 render call','reservedFrameId','slot->frameId == reservedFrameId')){if(-not $n.Contains($m)){throw "unlocked marker missing $m"}}
      - name: Build unlocked probe addon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'libmpv.7z'; $extract=Join-Path $env:RUNNER_TEMP 'libmpv-sdk'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $env:LIBMPV_SDK_URL
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:LIBMPV_SDK_SHA256){throw 'SDK hash mismatch'}
          New-Item -ItemType Directory -Force -Path $extract|Out-Null; 7z.exe x $archive "-o$extract" -y|Out-Null
          $client=Get-ChildItem $extract -Recurse -File -Filter client.h|Where-Object{(Split-Path (Split-Path $_.FullName -Parent) -Leaf) -eq 'mpv'}|Select-Object -First 1
          $vendor=Join-Path $PWD 'native/libmpv-d3d11-bridge/vendor/include/mpv'; New-Item -ItemType Directory -Force -Path $vendor|Out-Null
          Copy-Item (Join-Path (Split-Path $client.FullName -Parent) '*') $vendor -Recurse -Force
          $dll=Get-ChildItem $extract -Recurse -File|Where-Object{$_.Name -in @('libmpv-2.dll','mpv-2.dll')}|Select-Object -First 1
          Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          if((Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_DLL_SHA256){throw 'DLL hash mismatch'}
          & node_modules/.bin/node-gyp.cmd rebuild --directory native/libmpv-d3d11-bridge --target=$env:ELECTRON_VERSION --dist-url=https://electronjs.org/headers
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Copy-Item native/libmpv-d3d11-bridge/build/Release/lilac_libmpv_player_bridge.node electron/lilac-libmpv-player-bridge.node -Force
          "LILAC_LIBMPV_PLAYER_ADDON=$((Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LILAC_LIBMPV_DLL=$((Resolve-Path 'electron/libmpv-2.dll').Path)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prove JS APIs remain responsive and producer survives JS block
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $env:ELECTRON_RUN_AS_NODE='1'
          & npx.cmd electron scripts/smoke-libmpv-r3d-autonomous-unlocked-latency.cjs
          if($LASTEXITCODE -ne 0){throw 'unlocked latency smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r3d-autonomous-js-block-v2.cjs
          $e=$LASTEXITCODE; Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          if($e -ne 0){throw 'JS-block smoke failed'}
          Write-Host 'R3D_AUTONOMOUS_UNLOCKED_GATE_OK'
