name: LilacAnime Libmpv R39 authoritative final6

on:
  push:
    branches: [libmpv-r3f-054-r39-refocus-pip-subtitle]
    paths:
      - .github/workflows/libmpv-r3f-054-r39-refocus-pip-subtitle-final6.yml
      - scripts/r39-final-wrapper-v4.ps1
      - scripts/r39-postqualify-final.ps1
      - scripts/r39-long-blur-refocus-runtime-smoke.cjs
      - scripts/r39-miniplayer-native-topmost-runtime-smoke.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r39-refocus-pip-subtitle-final6
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r39
  INSTALLER_NAME: LilacAnime-Libmpv-R39-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r39-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc19
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Preflight authoritative R39 final6 scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $checks=@(
            'scripts/r39-base-anchor-compat-v2.cjs',
            'scripts/r39-refocus-pip-subtitle-fix.cjs',
            'scripts/r39-refocus-pip-subtitle-smoke.cjs',
            'scripts/r39-subtitle-r2v-calibration-correction.cjs',
            'scripts/r39-refocus-force-wake.cjs',
            'scripts/r39-topmost-bidirectional-fix.cjs',
            'scripts/r39-rebundle-final-renderer.cjs',
            'scripts/r39-final-subtitle-smoke.cjs',
            'scripts/r39-final-smoke.cjs',
            'scripts/r39-long-blur-refocus-runtime-smoke.cjs',
            'scripts/r39-miniplayer-native-topmost-runtime-smoke.cjs'
          )
          foreach($script in $checks){
            if(-not(Test-Path $script)){throw "R39 final6 preflight missing $script"}
            node --check $script
            if($LASTEXITCODE-ne 0){throw "R39 final6 syntax failed $script"}
          }
          foreach($script in @(
            'scripts/r39-qualified-build.ps1',
            'scripts/r39-qualified-build-v2.ps1',
            'scripts/r39-final-wrapper-v4.ps1',
            'scripts/r39-postqualify-final.ps1'
          )){
            if(-not(Test-Path $script)){throw "R39 final6 preflight missing $script"}
          }
          $wrapper=Get-Content scripts/r39-final-wrapper-v4.ps1 -Raw
          foreach($marker in @('r39-long-blur-refocus-runtime-smoke.cjs','r39-miniplayer-native-topmost-runtime-smoke.cjs')){
            if(-not $wrapper.Contains($marker)){throw "R39 final6 wrapper does not preserve $marker"}
          }
          $post=Get-Content scripts/r39-postqualify-final.ps1 -Raw
          foreach($marker in @('R39 final long-blur refocus runtime smoke','R39 final real native topmost runtime smoke','r39LongBlurRefocusRuntimeQualified','r39RealNativeTopmostRuntimeQualified')){
            if(-not $post.Contains($marker)){throw "R39 final6 postqualification marker missing $marker"}
          }
          Write-Host 'R39_FINAL6_PREFLIGHT_OK exactR38=1 subtitleR2V=1 forceWake=1 bidirectionalTopmost=1 longBlurRefocusRuntime=required realNativeTopmostRuntime=required'

      - name: Reconstruct, correct, and fully qualify authoritative R39 final6
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/r32-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r33-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r36-transform-r35-anchor-compat.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          ./scripts/r39-final-wrapper-v4.ps1

      - name: Upload authoritative R39 final6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r39-authoritative-final6
          path: |
            dist/LilacAnime-Libmpv-R39-Setup.exe
            dist/lilacanime-libmpv-r39-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish and reverify authoritative public R39 final6 bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r39 refocus PiP subtitle' --notes 'R39 is the real-user-diagnostic correction over fully qualified R38. It preserves the R33 unfocused native-only owned popup, R37 explicit renderer handoff/no-region-churn path, R38 updater lifecycle, and focused direct WebGPU presenter. Refocus now invalidates stale native frame phase on blur and replaces any pending pump timer with an immediate Chromium wake on focus. Final6 additionally validates the exact real-user failure shape on the actual product bridge: three 4-second native-only blur periods, first focused Chromium frame within 300 ms, 12 sustained frames within 900 ms, and no post-focus dispatch gap of 300 ms or more. PiP/miniplayer remains reachable through direct preload and R2V fallback, uses screen-saver-level always-on-top, and the R33 owned native popup follows HWND_TOPMOST/HWND_NOTOPMOST bidirectionally. Final6 validates that with real Electron BrowserWindows, the real native popup, a competing rival window, and desktop capture proving the red video remains visibly above the rival while mini-player mode is active, then demotes correctly after exit. Subtitle correction preserves the authoritative R2V 105/10/130/400/3 calibration, R36 strip mode, focused/native position-minus-1.25 parity, and known font presets. Exact-R38 reconstruction, R33/R37 runtime tests, Electron 44 native rebuild, packaged ASAR inspection, updater/direct-WebGPU byte invariants, and public-byte redownload verification all remain mandatory.'
          if($LASTEXITCODE-ne 0){throw 'R39 final6 release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'R39 final6 release upload failed'}

          $verify=Join-Path $env:RUNNER_TEMP 'r39-authoritative-final6-public'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R39 final6 public redownload failed'}

          $exe=Join-Path $verify $env:INSTALLER_NAME
          $manifest=Get-Content (Join-Path $verify $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if($manifest.version-ne $env:APP_VERSION -or
             $manifest.tag-ne $env:RELEASE_TAG -or
             $manifest.qualifiedSourceSha-ne $env:QUALIFIED_SOURCE_SHA -or
             $manifest.installerSha256-ne $hash -or
             [long]$manifest.installerSize-ne $size -or
             $manifest.electron-ne $env:ELECTRON_VERSION -or
             $manifest.nativeDll-ne $env:QUALIFIED_DLL_SHA256){throw 'R39 final6 public identity mismatch'}
          if($manifest.r33FocusPresenter-ne 'same-libmpv-d3d11-texture+owned-ws-popup-unfocused' -or
             $manifest.r33OwnedPopupBlackErase-ne $false -or
             $manifest.r33ChromiumDuplicateDelivery-ne $false){throw 'R39 final6 lost R33 native-only proof'}
          if($manifest.focusedPresenter-ne 'direct-receive-webgpu-copy'){throw 'R39 final6 focused direct WebGPU mismatch'}
          if($manifest.r37HandoffAck-ne 'explicit-renderer-epoch-after-direct-copy+imported-release'){throw 'R39 final6 lost R37 handoff proof'}
          if($manifest.r38UpdaterActivity-ne 'startup5s+periodic3h+second-instance+tray-show+window-focus-cooldown2m'){throw 'R39 final6 lost R38 updater proof'}
          if($manifest.r39RefocusPhase-ne 'reset-native-deadline-on-blur+replace-pending-timer+reset-and-immediate-pump-on-focus'){throw 'R39 final6 refocus proof mismatch'}
          if($manifest.r39MiniPlayerTopmost-ne 'direct+R2V-fallback+browser-screen-saver-self-heal+owned-popup-owner-topmost-sync'){throw 'R39 final6 mini-player proof mismatch'}
          if($manifest.r39TopmostBidirectional-ne 'owner-topmost=>HWND_TOPMOST+owner-normal=>HWND_NOTOPMOST'){throw 'R39 final6 bidirectional topmost proof mismatch'}
          if($manifest.r39SubtitleParity-ne 'R2V-105-10-130-400-3-preserved+native-bottom-position-minus1.25+known-font-preset+R36-strip'){throw 'R39 final6 subtitle parity proof mismatch'}
          if($manifest.r39RendererBundle-ne 'rebuilt-after-final-subtitle-correction+packaged-marker-verified'){throw 'R39 final6 renderer bundle proof mismatch'}
          if($manifest.r39BlackFlashInvariant-ne 'R37-full-owned-popup-no-ui-holes-preserved'){throw 'R39 final6 black-flash invariant mismatch'}
          if($manifest.r39UpdaterInvariant-ne 'R38-updater-byte-identical'){throw 'R39 final6 updater invariant mismatch'}
          if($manifest.r39FocusedPresenterInvariant-ne 'R38-shared-preload-byte-identical-direct-webgpu'){throw 'R39 final6 focused presenter invariant mismatch'}
          if($manifest.r39LongBlurRefocusRuntimeQualified-ne $true -or
             $manifest.r39LongBlurRefocusRuntime-ne 'real-product-bridge+3cycles+blur4000ms+first-focused-frame<=300ms+12frames<=900ms+focused-dispatch-gap<300ms'){throw 'R39 final6 long-blur refocus runtime proof mismatch'}
          if($manifest.r39RealNativeTopmostRuntimeQualified-ne $true -or
             $manifest.r39RealNativeTopmostRuntime-ne 'real-browserwindow+real-r33-owned-popup+desktop-capture-visible-above-rival+HWND_TOPMOST/HWND_NOTOPMOST-bidirectional'){throw 'R39 final6 real topmost runtime proof mismatch'}
          Write-Host "R39_FINAL6_PUBLISHED_OK sha256=$hash size=$size electron=$($manifest.electron) longBlurRefocus=3cyclesx4000ms realNativeTopmost=desktopCapture+bidirectional refocus=phase-reanchor+forced-wake subtitle=R2V-calibrated updater=R38-preserved focused=direct-webgpu"
