name: Libmpv R2W r6 full release

on:
  push:
    branches: [libmpv-r2w-aspect-cadence]
    paths: [.github/workflows/libmpv-r2w-release.yml]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2w-r6-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  R2W_TESTED_SHA: d416a3ed3cefe0726803b933e73338393556fcdd
  UPSTREAM_TAG: v0.5.50
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_SOURCE_COMMIT: 78e643838b168ac961dd9631d1225b5ac8fc8ec6
  QUALIFICATION_RELEASE_TAG: libmpv-hwq-r2i-pipeline-78e643838b16
  QUALIFICATION_EXE_SHA256: 6d06dcf1543c7ec69488ce0718d846a2e525e04ee56ad17dbc686fef54ebb395
  QUALIFICATION_MANIFEST_SHA256: c18543c10de436dd66544aed5fca6879fca258f1bd875a91b4d7bf17ea738b8e
  QUALIFIED_ADDON_SHA256: ee1790a87dd75a9d058ff5fc10a9e96ed2ab6863f03c3973a2c88d8eef72fe2b
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  CUSTOM_RELEASE_TAG: libmpv-r2k-v0.5.50-r6
  INSTALLER_NAME: LilacAnime-Libmpv-R2W-Setup.exe

jobs:
  qualify-build-release:
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin exact probe-qualified R2W source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git cat-file -e "$env:R2W_TESTED_SHA^{commit}"
          if($LASTEXITCODE -ne 0){throw 'R2W tested commit unavailable'}
          git checkout --detach $env:R2W_TESTED_SHA
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:R2W_TESTED_SHA){throw "R2W source pin mismatch: $head"}
          git diff --quiet e4eb825fd6698e9797040136ad57dd460ca992d8 $head -- native
          if($LASTEXITCODE -ne 0){throw 'R2W tested source changed native sources relative to R2V'}
          Write-Host "R2W_SOURCE_PINNED sha=$head nativeDiff=0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Overlay exact upstream Lilac 0.5.50
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.50'
          git clone --depth 1 --branch $env:UPSTREAM_TAG https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          $sha=(git -C $up rev-parse HEAD).Trim()
          if($sha -ne $env:UPSTREAM_SHA){throw "upstream tag moved: $sha"}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          if((node -p "require('./package.json').version") -ne '0.5.50'){throw 'upstream version mismatch'}
          Write-Host "R2W_UPSTREAM_OK sha=$sha"

      - name: Install and apply exact transform chain through R2W
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs','scripts/apply-libmpv-r2w-aspect-cadence.cjs')
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2v.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer rebundle failed'}
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          $electron=node -p "require('electron/package.json').version"
          $version=node -p "require('./package.json').version"
          $tag=node -p "require('./package.json').lilacCustomTag"
          if($electron -ne $env:ELECTRON_VERSION -or $version -ne '0.5.50-libmpv-r2w.rc1' -or $tag -ne $env:CUSTOM_RELEASE_TAG){throw "R2W transformed metadata mismatch: electron=$electron version=$version tag=$tag"}
          Write-Host 'R2W_TRANSFORMS_OK'

      - name: Bind exact real-hardware-qualified native payload
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $q=Join-Path $env:RUNNER_TEMP 'qualified-r2i'
          New-Item -ItemType Directory -Force -Path $q|Out-Null
          gh release download $env:QUALIFICATION_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $q --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe' --pattern 'qualification-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'qualification download failed'}
          $exe=Join-Path $q 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe'
          $manifest=Join-Path $q 'qualification-manifest.json'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_EXE_SHA256){throw 'qualification EXE SHA mismatch'}
          if((Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_MANIFEST_SHA256){throw 'qualification manifest SHA mismatch'}
          $m=Get-Content $manifest -Raw|ConvertFrom-Json
          if($m.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT -or $m.electronVersion -ne $env:ELECTRON_VERSION){throw 'qualification provenance mismatch'}
          $raw=Join-Path $env:RUNNER_TEMP 'q-extract';$nested=Join-Path $env:RUNNER_TEMP 'q-nested'
          New-Item -ItemType Directory -Force -Path $raw,$nested|Out-Null
          7z.exe x $exe "-o$raw" -y|Out-Null
          function FindPayload([string]$name){Get-ChildItem $raw,$nested -Recurse -File -Filter $name -ErrorAction SilentlyContinue|Select-Object -First 1}
          $addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll'
          if(-not $addon -or -not $dll){
            $i=0
            foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){
              $i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null
              7z.exe x $a.FullName "-o$out" -y|Out-Null
              $addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll'
              if($addon -and $dll){break}
            }
          }
          if(-not $addon -or -not $dll){throw 'qualified native payload missing'}
          $addonHash=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $dllHash=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($addonHash -ne $env:QUALIFIED_ADDON_SHA256 -or $dllHash -ne $env:QUALIFIED_DLL_SHA256){throw "qualified native hash mismatch addon=$addonHash dll=$dllHash"}
          Copy-Item $addon.FullName electron/lilac-libmpv-player-bridge.node -Force
          Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          Write-Host "R2W_NATIVE_BOUND addon=$addonHash dll=$dllHash"

      - name: Verify R2W behavior and retained R2V runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/smoke-libmpv-r2w-cadence.cjs
          if($LASTEXITCODE -ne 0){throw 'R2W cadence math failed'}
          node scripts/smoke-libmpv-r2w-pipeline-invariant.cjs
          if($LASTEXITCODE -ne 0){throw 'R2W pipeline invariant failed'}
          node scripts/smoke-libmpv-r2w-aspect.cjs
          if($LASTEXITCODE -ne 0){throw 'R2W aspect policy failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2w-window-aspect-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'R2W BrowserWindow aspect runtime failed'}
          $tenraiSource='scripts/smoke-libmpv-r2q-metadata-api.cjs'
          $tenraiR2w='scripts/smoke-libmpv-r2q-metadata-api-r2w.generated.cjs'
          node -e "const fs=require('fs');const src=fs.readFileSync(process.argv[1],'utf8');const line=src.split(/\r?\n/).find(v=>v.includes('0.5.50-libmpv-r2v.rc1'));if(!line)throw new Error('R2Q metadata version anchor missing');const q=String.fromCharCode(39),d=String.fromCharCode(36);const added='  '+q+'0.5.50-libmpv-r2w.rc1'+q+': { tag: '+q+'libmpv-r2k-v0.5.50-r6'+q+', installer: '+q+'LilacAnime-Libmpv-R2W-Setup.'+d+'{ext}'+q+' }';const out=src.replace(line,line.trimEnd()+','+'\n'+added);fs.writeFileSync(process.argv[2],out)" $tenraiSource $tenraiR2w
          if($LASTEXITCODE -ne 0){throw 'R2W Tenrai smoke adapter generation failed'}
          node $tenraiR2w
          $tenraiExit=$LASTEXITCODE
          Remove-Item $tenraiR2w -Force -ErrorAction SilentlyContinue
          if($tenraiExit -ne 0){throw 'Tenrai live smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2r-full-ui-startup.cjs
          if($LASTEXITCODE -ne 0){throw 'full UI startup failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2v-subtitle-controls.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V subtitle controls failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2v-subtitle-visual.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V subtitle visual failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2v-miniplayer-fallback.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V mini-player fallback failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2t-miniplayer-interaction.cjs
          if($LASTEXITCODE -ne 0){throw 'direct mini-player interaction failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2u-preload-miniplayer.cjs
          if($LASTEXITCODE -ne 0){throw 'direct preload mini-player bridge failed'}
          node scripts/smoke-libmpv-r2t-miniplayer-window.cjs
          if($LASTEXITCODE -ne 0){throw 'mini-player lifecycle failed'}
          & npx.cmd electron scripts/smoke-libmpv-vtt-overlay.cjs
          if($LASTEXITCODE -ne 0){throw 'retained VTT overlay failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2m-open-race.cjs
          if($LASTEXITCODE -ne 0){throw 'open-race regression failed'}
          node scripts/smoke-libmpv-r2s-key-policy.cjs
          if($LASTEXITCODE -ne 0){throw 'key policy failed'}
          node scripts/smoke-libmpv-r2m-key-ui.cjs
          if($LASTEXITCODE -ne 0){throw 'keyboard UI failed'}
          node scripts/smoke-libmpv-r2p-pipeline-untouched.cjs
          if($LASTEXITCODE -ne 0){throw 'qualified renderer marker failed'}
          Write-Host 'R2W_BEHAVIOR_OK'

      - name: Verify native FHD performance and full upstream regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LILAC_LIBMPV_PLAYER_ADDON=(Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path
          $env:LILAC_LIBMPV_DLL=(Resolve-Path 'electron/libmpv-2.dll').Path
          $env:ELECTRON_RUN_AS_NODE='1'
          foreach($s in @('scripts/smoke-libmpv-native-retention-fhd.cjs','scripts/smoke-libmpv-native-command-roundtrip.cjs','scripts/smoke-libmpv-r2-pump-sim.cjs','scripts/smoke-libmpv-relay-av.cjs')){
            & npx.cmd electron $s
            if($LASTEXITCODE -ne 0){throw "runtime regression failed: $s"}
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer input stress failed'}
          $tests=@(Get-ChildItem tests -File -Filter '*.test.cjs'|Sort-Object Name|ForEach-Object{$_.FullName})
          & node --test @tests
          if($LASTEXITCODE -ne 0){throw 'upstream 0.5.50 regression suite failed'}
          node scripts/smoke-flix-proxy-fixture.cjs
          if($LASTEXITCODE -ne 0){throw 'Flix fixture failed'}
          Write-Host "R2W_FULL_REGRESSION_OK upstreamTestFiles=$($tests.Count)"

      - name: Verify source architecture and exact native identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2w.rc1' -or $pkg.lilacCustomTag -ne $env:CUSTOM_RELEASE_TAG -or $pkg.build.win.artifactName -ne 'LilacAnime-Libmpv-R2W-Setup.${ext}'){throw 'R2W package identity mismatch'}
          $main=Get-Content electron/main.cjs -Raw
          $mini=Get-Content electron/miniplayer-window.cjs -Raw
          $bridge=Get-Content electron/libmpv-shared-main.cjs -Raw
          $preload=Get-Content electron/preload-libmpv-shared.generated.cjs -Raw
          foreach($marker in @('LILAC_R2W_ASPECT_CADENCE',"setVideoAspectLocked(win,next.mode==='player'||next.mode==='hidden')")){if(-not $main.Contains($marker)){throw "main marker missing: $marker"}}
          foreach($marker in @('aspectLocked: isVideoAspectLocked(win)','setVideoAspectLocked(win, true)','setVideoAspectLocked(win, state.aspectLocked)')){if(-not $mini.Contains($marker)){throw "mini marker missing: $marker"}}
          foreach($marker in @('actualPresentedFps','displayFrequency','refreshQuantizedErrorStdMs')){if(-not $bridge.Contains($marker)){throw "bridge cadence marker missing: $marker"}}
          foreach($marker in @('createRollingCadenceTracker','observePresentationCadence','copyExternalImageToTexture')){if(-not $preload.Contains($marker)){throw "generated preload marker missing: $marker"}}
          if($preload.Contains('await requestAnimationFrame') -or $preload.Contains('await nextFrame')){throw 'generated preload retains frame across cadence observation'}
          $addonHash=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant()
          $dllHash=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($addonHash -ne $env:QUALIFIED_ADDON_SHA256 -or $dllHash -ne $env:QUALIFIED_DLL_SHA256){throw 'native identity changed before build'}
          Write-Host "R2W_ARCHITECTURE_IDENTITY_OK addon=$addonHash dll=$dllHash"

      - name: Build Windows R2W installer
        run: npx electron-builder --win nsis --publish never

      - name: Unpack and verify actual R2W installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem dist -File -Filter $env:INSTALLER_NAME|Select-Object -First 1
          if(-not $installer){throw 'R2W installer missing'}
          $raw=Join-Path $env:RUNNER_TEMP 'r2w-installer';$nested=Join-Path $env:RUNNER_TEMP 'r2w-nested';$asarOut=Join-Path $env:RUNNER_TEMP 'r2w-asar'
          New-Item -ItemType Directory -Force -Path $raw,$nested,$asarOut|Out-Null
          7z.exe x $installer.FullName "-o$raw" -y|Out-Null
          $i=0
          foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){
            $i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null
            7z.exe x $a.FullName "-o$out" -y|Out-Null
          }
          $addon=Get-ChildItem $raw,$nested -Recurse -File -Filter 'lilac-libmpv-player-bridge.node'|Select-Object -First 1
          $dll=Get-ChildItem $raw,$nested -Recurse -File -Filter 'libmpv-2.dll'|Select-Object -First 1
          if(-not $addon -or -not $dll){throw 'actual installer native payload missing'}
          $addonHash=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $dllHash=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($addonHash -ne $env:QUALIFIED_ADDON_SHA256 -or $dllHash -ne $env:QUALIFIED_DLL_SHA256){throw "actual installer native hash mismatch addon=$addonHash dll=$dllHash"}
          $asar=Get-ChildItem $raw,$nested -Recurse -File -Filter 'app.asar'|Select-Object -First 1
          if(-not $asar){throw 'actual installer app.asar missing'}
          & npx.cmd asar extract $asar.FullName $asarOut
          if($LASTEXITCODE -ne 0){throw 'actual installer app.asar extraction failed'}
          $packagedPkg=Get-Content (Join-Path $asarOut 'package.json') -Raw|ConvertFrom-Json
          if($packagedPkg.version -ne '0.5.50-libmpv-r2w.rc1' -or $packagedPkg.lilacCustomTag -ne $env:CUSTOM_RELEASE_TAG){throw 'actual installer metadata mismatch'}
          $packagedMain=Get-Content (Join-Path $asarOut 'electron/main.cjs') -Raw
          $packagedPreload=Get-Content (Join-Path $asarOut 'electron/preload-libmpv-shared.generated.cjs') -Raw
          if(-not $packagedMain.Contains('LILAC_R2W_ASPECT_CADENCE')){throw 'actual installer aspect marker missing'}
          foreach($marker in @('createRollingCadenceTracker','observePresentationCadence','actualPresentedFps')){if(-not $packagedPreload.Contains($marker)){throw "actual installer cadence marker missing: $marker"}}
          $installerHash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSize=$installer.Length
          $releaseManifest=[ordered]@{
            applicationSourceSha=$env:R2W_TESTED_SHA
            upstreamSha=$env:UPSTREAM_SHA
            tag=$env:CUSTOM_RELEASE_TAG
            version='0.5.50-libmpv-r2w.rc1'
            installerName=$env:INSTALLER_NAME
            installerSize=[long]$installerSize
            installerSha256=$installerHash
            addonSha256=$addonHash
            dllSha256=$dllHash
            cadenceObserver='post-copy-requestAnimationFrame-scalar-only'
            aspectRatio='16:9-native-BrowserWindow'
          }
          $manifestPath=Join-Path (Resolve-Path 'dist').Path 'r2w-release-manifest.json'
          $releaseManifest|ConvertTo-Json -Depth 4|Set-Content $manifestPath -Encoding utf8
          "R2W_INSTALLER_SHA256=$installerHash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "R2W_INSTALLER_SIZE=$installerSize"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2W_INSTALLER_OK sha256=$installerHash size=$installerSize addon=$addonHash dll=$dllHash"

      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-Libmpv-R2W-r6
          path: |
            dist/LilacAnime-Libmpv-R2W-Setup.exe
            dist/r2w-release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish R2W prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @"
          R2W keeps the real-hardware-qualified libmpv/D3D11 shared-texture/WebGPU payload unchanged.

          Changes from R2V:
          - native BrowserWindow 16:9 aspect-ratio constraint while the player is windowed and in mini-player
          - mini-player restores the previous aspect lock and existing bounds/maximize/fullscreen state
          - observation-only rolling 10s presentation cadence diagnostics (post-copy rAF timestamps, scalar metadata only)
          - source FPS and active display refresh-rate diagnostics

          Qualified native payload:
          - addon SHA-256: $env:QUALIFIED_ADDON_SHA256
          - DLL SHA-256: $env:QUALIFIED_DLL_SHA256

          Installer SHA-256: $env:R2W_INSTALLER_SHA256
          Installer size: $env:R2W_INSTALLER_SIZE bytes
          "@ | Set-Content release-notes-r2w.md -Encoding utf8
          $installer=(Resolve-Path "dist/$env:INSTALLER_NAME").Path
          $manifest=(Resolve-Path 'dist/r2w-release-manifest.json').Path
          gh release view $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){
            gh release edit $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:R2W_TESTED_SHA --title 'LilacAnime libmpv R2W r6' --notes-file release-notes-r2w.md
            if($LASTEXITCODE -ne 0){throw 'release edit failed'}
            gh release upload $env:CUSTOM_RELEASE_TAG $installer $manifest --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:CUSTOM_RELEASE_TAG $installer $manifest --repo $env:GITHUB_REPOSITORY --prerelease --target $env:R2W_TESTED_SHA --title 'LilacAnime libmpv R2W r6' --notes-file release-notes-r2w.md
          }
          if($LASTEXITCODE -ne 0){throw 'R2W prerelease publish failed'}
          Write-Host "R2W_RELEASE_PUBLISHED tag=$env:CUSTOM_RELEASE_TAG"

      - name: Verify published installer bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $verify=Join-Path $env:RUNNER_TEMP 'r2w-published'
          New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:INSTALLER_NAME --pattern 'r2w-release-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'published release download failed'}
          $downloaded=Join-Path $verify $env:INSTALLER_NAME
          $hash=(Get-FileHash $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $downloaded).Length
          if($hash -ne $env:R2W_INSTALLER_SHA256 -or $size -ne [long]$env:R2W_INSTALLER_SIZE){throw "published installer mismatch hash=$hash size=$size"}
          $manifest=Get-Content (Join-Path $verify 'r2w-release-manifest.json') -Raw|ConvertFrom-Json
          if($manifest.installerSha256 -ne $hash -or $manifest.addonSha256 -ne $env:QUALIFIED_ADDON_SHA256 -or $manifest.dllSha256 -ne $env:QUALIFIED_DLL_SHA256){throw 'published manifest mismatch'}
          Write-Host "R2W_PUBLISHED_BYTES_OK sha256=$hash size=$size"
