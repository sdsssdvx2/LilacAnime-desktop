name: Native mpv prototype

on:
  push:
    branches: [mpv-native-engine]
  workflow_dispatch:

concurrency:
  group: lilac-native-mpv-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native-mpv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windows cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64 wine64

      - name: Configure prototype identity and packaging
        run: node scripts/configure-native-mpv-package.cjs

      - name: Build raw Win32 HWND host helper
        run: >-
          x86_64-w64-mingw32-g++
          -std=c++17 -O2 -static-libgcc -static-libstdc++
          native/win32-mpv-host.cpp
          -o electron/win32-mpv-host.exe
          -luser32 -lgdi32

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply V11 helper-created raw HWND source transform
        run: node scripts/apply-native-mpv-v11.cjs

      - name: Fix hosted mpv full-screen layout geometry
        run: node scripts/apply-native-mpv-layout-fix.cjs

      - name: Add automatic diagnostic self-test
        run: node scripts/apply-native-mpv-autodiag.cjs

      - name: Add transparent Lilac control and subtitle overlay
        run: node scripts/apply-native-mpv-overlay.cjs

      - name: Build Windows installer
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
        run: npm run dist -- --publish never

      - name: Candidate checksum
        run: |
          sha256sum dist/LilacAnime-Native-Prototype-Setup.exe
          sha256sum electron/win32-mpv-host.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-native-mpv-prototype
          path: |
            dist/LilacAnime-Native-Prototype-Setup.exe
            electron/main.cjs
            electron/mpv-native-main.cjs
            electron/mpv-relay.cjs
            electron/mpv-overlay.html
            electron/mpv-overlay.js
            electron/mpv-overlay-preload.cjs
            electron/win32-mpv-host.exe
            native/win32-mpv-host.cpp
            src/mpv-native-entry.js
            src/mpv-native.generated.js
          if-no-files-found: error
          retention-days: 14
