name: Native mpv prototype

on:
  push:
    branches: [mpv-native-engine]
  workflow_dispatch:

concurrency:
  group: lilac-native-mpv-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native-mpv:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure prototype identity and packaging
        run: node scripts/configure-native-mpv-package.cjs
      - name: Build raw Win32 HWND host helper
        shell: cmd
        run: >-
          cl /nologo /EHsc /std:c++17 /O2
          /Fe:electron\\win32-mpv-host.exe
          native\\win32-mpv-host.cpp user32.lib gdi32.lib
      - name: Verify Win32 region and bounds parser
        shell: cmd
        run: electron\win32-mpv-host.exe --self-test-region
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Probe same-window WebContentsView over native child
        continue-on-error: true
        run: npx electron scripts/probe-webcontentsview-native-zorder.cjs
      - name: Real ReAnime and Flix HLS fragment smoke gate
        shell: powershell
        run: |
          $env:LILAC_SMOKE_REANIME = '1'
          $stdout = Join-Path $env:RUNNER_TEMP 'lilac-reanime-smoke-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'lilac-reanime-smoke-err.log'
          $proc = Start-Process -FilePath 'npx.cmd' -ArgumentList @('electron','.') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $lines = @()
          if (Test-Path $stdout) { $lines += Get-Content $stdout }
          if (Test-Path $stderr) { $lines += Get-Content $stderr }
          $safe = $lines | ForEach-Object {
            $_ `
              -replace 'http://127\.0\.0\.1:\d+/\S+', '[local-media]' `
              -replace 'https?://\S+', '[media-url]' `
              -replace '(?i)\b(authorization|cookie|referer|origin)\s*[:=]\s*\S+', '$1=[redacted]'
          }
          $safe | ForEach-Object { Write-Host $_ }
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "ReAnime smoke exited $($proc.ExitCode)" }
          if (-not ($safe -match 'LILAC_SMOKE_OK')) { throw 'ReAnime smoke did not report LILAC_SMOKE_OK' }
      - name: Apply V11 helper-created raw HWND source transform
        run: node scripts/apply-native-mpv-v11.cjs
      - name: Fix hosted mpv full-screen layout geometry
        run: node scripts/apply-native-mpv-layout-fix.cjs
      - name: Add automatic diagnostic self-test
        run: node scripts/apply-native-mpv-autodiag.cjs
      - name: Apply docked Lilac controls and mpv subtitle integration
        run: node scripts/apply-native-mpv-overlay.cjs
      - name: Activate V13D2 dock layout and diagnostics
        run: node scripts/apply-native-mpv-v13d2.cjs
      - name: Add V13D3 safe load diagnostics and one-shot loopback recovery
        run: node scripts/apply-native-mpv-v13d3.cjs
      - name: Fix V13D4 dock CSS and native subtitle renderer
        run: node scripts/apply-native-mpv-v13d4.cjs
      - name: Apply V13D5 deferred diagnostics and full-stage HWND holes
        run: node scripts/apply-native-mpv-v13d5.cjs
      - name: Apply V13D6 Windows DPI scaling and settings-region hole
        run: node scripts/apply-native-mpv-v13d6.cjs
      - name: Preserve V13D7 Win32 input holes end-to-end
        run: node scripts/apply-native-mpv-v13d7.cjs
      - name: Accept V13D8 renderer w-h input holes
        run: node scripts/apply-native-mpv-v13d8.cjs
      - name: Apply V13D9 compact visible-control HWND holes
        run: node scripts/apply-native-mpv-v13d9.cjs
      - name: Keep V13D10 native video alive under diagnostic card
        run: node scripts/apply-native-mpv-v13d10.cjs
      - name: Add V13D11 deep mpv and Flix diagnostics
        run: node scripts/apply-native-mpv-v13d11-diagnostics.cjs
      - name: Verify transformed bounds and input-hole serialization
        run: node scripts/verify-native-mpv-transforms.cjs
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: Candidate checksum
        shell: powershell
        run: |
          Get-FileHash dist/LilacAnime-Native-Prototype-Setup.exe -Algorithm SHA256 | Format-List
          Get-FileHash electron/win32-mpv-host.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-native-mpv-prototype
          path: |
            dist/LilacAnime-Native-Prototype-Setup.exe
            electron/main.cjs
            electron/mpv-native-main.cjs
            electron/mpv-relay.cjs
            electron/flix-proxy.cjs
            electron/win32-mpv-host.exe
            native/win32-mpv-host.cpp
            src/mpv-native-entry.js
            src/mpv-native.generated.js
          if-no-files-found: error
          retention-days: 14
