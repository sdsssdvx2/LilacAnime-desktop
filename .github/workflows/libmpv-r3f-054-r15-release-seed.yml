name: LilacAnime R3F r15 release seed

on:
  push:
    branches: [libmpv-r3f-054-release-r15]
    paths: [.github/workflows/libmpv-r3f-054-r15-release-seed.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed target prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: libmpv-r2k-v0.5.54-r15
          TARGET: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" --repo "$REPO" --target "$TARGET" --title "LilacAnime libmpv R3F 0.5.54 r15 seed" --notes "Temporary prerelease seed for the existing r15 finalizer's idempotent cleanup path." --prerelease
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease --jq '.tagName + " prerelease=" + (.isPrerelease|tostring)'
