name: LilacAnime R45 focus transition visual diagnostic

on:
  workflow_dispatch:
  push:
    branches: [libmpv-r3f-054-r41-visual-handoff-stall-trace]
    paths:
      - .github/workflows/r45-focus-transition-visual-diagnostic.yml
      - scripts/r45-*

concurrency:
  group: lilac-r45-focus-transition-visual-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_VERSION: 44.9.3
  R44_RELEASE_TAG: libmpv-r2k-v0.5.54-r44
  R44_APP_VERSION: 0.5.54-libmpv-r3f.rc23
  R44_INSTALLER_NAME: LilacAnime-Libmpv-R44-Setup.exe
  R44_INSTALLER_SHA256: 5b71017d1a93450ae803c174dfc184f8f0797d2263df0745b97347182f8bcaf8
  R44_INSTALLER_SIZE: 185779681
  R44_MANIFEST_NAME: lilacanime-libmpv-r44-manifest.json
  R44_MANIFEST_SHA256: 96f79cd0c80c49a2b3acee0a909e11277e16a8dd19eaa27e174d8ae3e31efb7a
  R44_MANIFEST_SIZE: 2307

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned diagnostic runtime
        shell: powershell
        run: npm install --no-save --no-audit --no-fund electron@44.9.3 @electron/asar@3.2.18 ffmpeg-static@5.3.0

      - name: Syntax check transition diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/r45-reconstruct-r44-release.cjs
          if($LASTEXITCODE-ne 0){throw 'R45 R44 reconstructor syntax failed'}
          node --check scripts/r45-focus-transition-visual-probe.cjs
          if($LASTEXITCODE-ne 0){throw 'R45 transition visual probe syntax failed'}
          node --check scripts/r45-inspect-r44-focus-helper.cjs
          if($LASTEXITCODE-ne 0){throw 'R45 focus helper inspector syntax failed'}

      - name: Reconstruct immutable public R44 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/r45-reconstruct-r44-release.cjs

      - name: Inspect shipped R44 focus helper
        shell: powershell
        run: node scripts/r45-inspect-r44-focus-helper.cjs

      - name: Probe eight real focus transitions for black-frame risk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LILAC_LIBMPV_PLAYER_ADDON=(Join-Path $PWD 'electron/lilac-libmpv-player-bridge.node')
          $env:LILAC_LIBMPV_DLL=(Join-Path $PWD 'electron/libmpv-2.dll')
          node scripts/r40-run-electron-gate.cjs scripts/r45-focus-transition-visual-probe.cjs R45_FOCUS_TRANSITION_VISUAL_PROBE_OK 150000
          if($LASTEXITCODE-ne 0){throw "R45 focus-transition probe exited $LASTEXITCODE"}
