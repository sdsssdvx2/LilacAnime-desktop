          gh release create $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'LilacAnime libmpv R2R · upstream 0.5.50 + UI startup fix' --notes 'Fixes the r6/r7 renderer-startup regression where the subtitle UI transform accidentally removed neighboring ASS/VTT controls, causing app.js/player.js null errors before search, navigation, settings, and home buttons could bind. This release adds a full Electron renderer startup gate that actually clicks Settings, returns Home, and submits global Search before packaging. It is rebased onto upstream Lilac 0.5.50, preserving the new Miruro persistent browser-session/Cloudflare authentication recovery and the official subtitle line-spacing setting. The readability controls now use that official subtitleLineHeight key (old vttLineHeight values migrate automatically) alongside weight, outline, max width, and shadow. Tenrai metadata recovery remains enabled. The exact previously hardware-qualified native/libmpv/WebGPU payload is reused unchanged; no CPU readback or new per-frame Canvas2D path is added.' dist/LilacAnime-Libmpv-R2R-Setup.exe dist/LilacAnime-Libmpv-R2R-Setup.sha256.txt dist/LilacAnime-Libmpv-R2R-attestation.json
