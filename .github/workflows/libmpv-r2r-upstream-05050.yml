name: Libmpv R2R upstream 0.5.50 UI startup fix

on:
  push:
    branches: [libmpv-r2r-upstream-0.5.50-ui-startup]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2r-upstream-05050-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_TAG: v0.5.50
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_SOURCE_COMMIT: 78e643838b168ac961dd9631d1225b5ac8fc8ec6
  QUALIFICATION_RELEASE_TAG: libmpv-hwq-r2i-pipeline-78e643838b16
  QUALIFICATION_EXE_SHA256: 6d06dcf1543c7ec69488ce0718d846a2e525e04ee56ad17dbc686fef54ebb395
  QUALIFICATION_MANIFEST_SHA256: c18543c10de436dd66544aed5fca6879fca258f1bd875a91b4d7bf17ea738b8e
  CUSTOM_RELEASE_TAG: libmpv-r2k-v0.5.50-r1

jobs:
  build-r2r:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Overlay exact upstream Lilac 0.5.50 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.50'
          Remove-Item $up -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 --branch $env:UPSTREAM_TAG https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          $sha=(git -C $up rev-parse HEAD).Trim()
          if($sha -ne $env:UPSTREAM_SHA){throw "upstream tag moved: $sha"}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          if((node -p "require('./package.json').version") -ne '0.5.50'){throw 'upstream version mismatch'}
          if(-not (Test-Path electron/miruro-session.cjs)){throw '0.5.50 Miruro session module missing'}
          $main=Get-Content electron/main.cjs -Raw
          if(-not $main.Contains("createMiruroSession") -or -not $main.Contains("require('./miruro-session.cjs')")){throw '0.5.50 Miruro session wiring missing'}
          Write-Host "R2R_UPSTREAM_05050_OVERLAY_OK sha=$sha miruroSession=1"

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18

      - name: Syntax-check transforms and R2R tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($s in @(
            'scripts/apply-libmpv-r2j-subtitle-overlay.cjs',
            'scripts/apply-libmpv-r2k-upstream-polish.cjs',
            'scripts/apply-libmpv-r2l-player-polish.cjs',
            'scripts/apply-libmpv-r2m-open-race-key-ui.cjs',
            'scripts/apply-libmpv-r2m-finalize.cjs',
            'scripts/apply-libmpv-r2n-webgpu-pip.cjs',
            'scripts/normalize-libmpv-r2p-subtitle-anchor.cjs',
            'scripts/apply-libmpv-r2p-subtitle-ui.cjs',
            'scripts/apply-libmpv-r2p-metadata-finalize.cjs',
            'scripts/apply-libmpv-r2q-tenrai-metadata.cjs',
            'scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs',
            'scripts/rebundle-libmpv-r2p.cjs',
            'scripts/smoke-libmpv-r2r-full-ui-startup.cjs',
            'scripts/smoke-libmpv-r2m-open-race.cjs',
            'scripts/smoke-libmpv-r2m-key-ui.cjs',
            'scripts/smoke-libmpv-r2n-webgpu-pip.cjs',
            'scripts/smoke-libmpv-r2p-subtitle-ui.cjs',
            'scripts/smoke-libmpv-r2p-pip-policy.cjs',
            'scripts/smoke-libmpv-r2p-pipeline-untouched.cjs',
            'scripts/smoke-libmpv-r2q-metadata-api.cjs',
            'scripts/smoke-libmpv-r2r-updater.cjs')){
            node --check $s
            if($LASTEXITCODE -ne 0){throw "syntax failed: $s"}
          }
          Write-Host 'R2R_PATCH_SYNTAX_OK'

      - name: Apply qualified R2I through R2R transforms on 0.5.50 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          # Historical transforms advance their own custom version metadata. Feed them the
          # metadata they expect while retaining the exact v0.5.50 source tree overlaid above.
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs',
            'scripts/apply-libmpv-r2-runtime-fixes.cjs',
            'scripts/apply-libmpv-r2b-command-import-diagnostics.cjs',
            'scripts/apply-libmpv-r2c-texture-pool.cjs',
            'scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs',
            'scripts/apply-libmpv-r2g-electron44-releasefix.cjs',
            'scripts/apply-libmpv-r2h-webgpu-copy.cjs',
            'scripts/apply-libmpv-r2i-pipeline-headroom.cjs',
            'scripts/apply-libmpv-r2h-bundle-marker-fix.cjs',
            'scripts/apply-libmpv-r2j-subtitle-overlay.cjs',
            'scripts/apply-libmpv-r2k-upstream-polish.cjs',
            'scripts/apply-libmpv-r2l-player-polish.cjs',
            'scripts/apply-libmpv-r2m-open-race-key-ui.cjs',
            'scripts/apply-libmpv-shared-texture.cjs',
            'scripts/apply-libmpv-r2e-native-command-gates.cjs',
            'scripts/apply-libmpv-r2m-finalize.cjs',
            'scripts/apply-libmpv-r2n-webgpu-pip.cjs',
            'scripts/normalize-libmpv-r2p-subtitle-anchor.cjs',
            'scripts/apply-libmpv-r2p-subtitle-ui.cjs',
            'scripts/apply-libmpv-r2p-metadata-finalize.cjs',
            'scripts/apply-libmpv-r2q-tenrai-metadata.cjs',
            'scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs')
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2p.cjs
          if($LASTEXITCODE -ne 0){throw 'R2R renderer rebundle failed'}
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          $electron=node -p "require('electron/package.json').version"
          $version=node -p "require('./package.json').version"
          $tag=node -p "require('./package.json').lilacCustomTag"
          if($electron -ne $env:ELECTRON_VERSION){throw "Electron mismatch: $electron"}
          if($version -ne '0.5.50-libmpv-r2r.rc1' -or $tag -ne $env:CUSTOM_RELEASE_TAG){throw "R2R metadata mismatch: $version / $tag"}
          foreach($s in @('electron/main.cjs','electron/updater.cjs','electron/miruro-session.cjs','src/libmpv-shared-entry.js','src/libmpv-shared.generated.js','src/player.js','src/app.js')){node --check $s;if($LASTEXITCODE -ne 0){throw "post-transform syntax failed: $s"}}
          Write-Host 'R2R_TRANSFORMS_APPLIED_OK upstream=0.5.50'

      - name: Bind exact real-hardware-qualified native payload
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $q=Join-Path $env:RUNNER_TEMP 'qualified-r2i';New-Item -ItemType Directory -Force -Path $q|Out-Null
          & gh release download $env:QUALIFICATION_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $q --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe' --pattern 'qualification-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'qualification download failed'}
          $exe=Join-Path $q 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe';$manifest=Join-Path $q 'qualification-manifest.json'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_EXE_SHA256){throw 'qualification EXE SHA mismatch'}
          if((Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_MANIFEST_SHA256){throw 'qualification manifest SHA mismatch'}
          $m=Get-Content $manifest -Raw|ConvertFrom-Json
          if($m.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT -or $m.electronVersion -ne $env:ELECTRON_VERSION){throw 'qualification provenance mismatch'}
          $raw=Join-Path $env:RUNNER_TEMP 'q-extract';$nested=Join-Path $env:RUNNER_TEMP 'q-nested';New-Item -ItemType Directory -Force -Path $raw,$nested|Out-Null
          & 7z.exe x $exe "-o$raw" -y|Out-Null
          function FindPayload([string]$name){Get-ChildItem $raw,$nested -Recurse -File -Filter $name -ErrorAction SilentlyContinue|Select-Object -First 1}
          $addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll'
          if(-not $addon -or -not $dll){$i=0;foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){$i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null;& 7z.exe x $a.FullName "-o$out" -y|Out-Null;$addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll';if($addon -and $dll){break}}}
          if(-not $addon -or -not $dll){throw 'qualified native payload missing'}
          $expectedAddon=[string]$m.payloadSha256.PSObject.Properties['electron/lilac-libmpv-player-bridge.node'].Value;$expectedDll=[string]$m.payloadSha256.PSObject.Properties['electron/libmpv-2.dll'].Value
          $addonHash=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$dllHash=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($addonHash -ne $expectedAddon -or $dllHash -ne $expectedDll){throw 'qualified native hash mismatch'}
          Copy-Item $addon.FullName electron/lilac-libmpv-player-bridge.node -Force;Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          "QUALIFIED_ADDON_SHA256=$addonHash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"QUALIFIED_DLL_SHA256=$dllHash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2R_EXACT_NATIVE_REUSED addon=$addonHash dll=$dllHash"

      - name: Prove full UI metadata subtitles PiP reopen keyboard and updater behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/smoke-libmpv-r2q-metadata-api.cjs;if($LASTEXITCODE -ne 0){throw 'R2R live metadata API smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2r-full-ui-startup.cjs;if($LASTEXITCODE -ne 0){throw 'R2R full UI startup interaction smoke failed'}
          foreach($s in @('scripts/smoke-libmpv-vtt-overlay.cjs','scripts/smoke-libmpv-r2m-open-race.cjs','scripts/smoke-libmpv-r2l-vtt-position.cjs','scripts/smoke-libmpv-r2p-subtitle-ui.cjs')){& npx.cmd electron $s;if($LASTEXITCODE -ne 0){throw "Electron UI smoke failed: $s"}}
          node scripts/smoke-libmpv-r2m-key-ui.cjs;if($LASTEXITCODE -ne 0){throw 'R2M key UI smoke failed'}
          node scripts/smoke-libmpv-r2p-pip-policy.cjs;if($LASTEXITCODE -ne 0){throw 'R2R PiP policy smoke failed'}
          node scripts/smoke-libmpv-r2p-pipeline-untouched.cjs;if($LASTEXITCODE -ne 0){throw 'R2R playback pipeline invariant failed'}
          node scripts/smoke-libmpv-r2r-updater.cjs;if($LASTEXITCODE -ne 0){throw 'R2R updater smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2n-webgpu-pip.cjs;if($LASTEXITCODE -ne 0){throw 'R2N WebGPU PiP E2E smoke failed'}
          Write-Host 'R2R_BEHAVIOR_SMOKES_OK fullUi=1 metadata=live subtitles=merged pip=r2n reopen=r2m keyboard=r2m updater=0.5.50-r1'

      - name: Run retained libmpv and upstream 0.5.50 regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LILAC_LIBMPV_PLAYER_ADDON=(Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path;$env:LILAC_LIBMPV_DLL=(Resolve-Path 'electron/libmpv-2.dll').Path;$env:ELECTRON_RUN_AS_NODE='1'
          foreach($s in @('scripts/smoke-libmpv-native-retention-fhd.cjs','scripts/smoke-libmpv-native-command-roundtrip.cjs','scripts/smoke-libmpv-r2-pump-sim.cjs','scripts/smoke-libmpv-relay-av.cjs')){& npx.cmd electron $s;if($LASTEXITCODE -ne 0){throw "runtime regression failed: $s"}}
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs;if($LASTEXITCODE -ne 0){throw 'renderer input regression failed'}
          node --test tests/player-interactions.test.cjs tests/community-matching.test.cjs tests/community-search.test.cjs tests/reanime-audio.test.cjs tests/stream-ad-filter.test.cjs tests/subtitle-sync.test.cjs tests/subtitle-translator.test.cjs tests/whisper.test.cjs tests/watermark-learner.test.cjs tests/window-buttons.test.cjs tests/startup.test.cjs tests/miruro-playback.test.cjs tests/miruro-recovery.test.cjs tests/miruro-session.test.cjs
          if($LASTEXITCODE -ne 0){throw '0.5.50 regression suite failed'}
          node scripts/smoke-flix-proxy-fixture.cjs;if($LASTEXITCODE -ne 0){throw 'Flix fixture regression failed'}
          Write-Host 'R2R_05050_REGRESSIONS_OK miruroSession=1'

      - name: Verify architecture UI guards metadata subtitle policy PiP and exact native identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $entry=Get-Content src/libmpv-shared-entry.js -Raw;$bundle=Get-Content src/libmpv-shared.generated.js -Raw;$player=Get-Content src/player.js -Raw;$app=Get-Content src/app.js -Raw;$index=Get-Content src/index.html -Raw;$main=Get-Content electron/main.cjs -Raw
          foreach($required in @('copyExternalImageToTexture','state.fileLoaded !== true','this._loadConfirmed = true','this._ended = this._loadConfirmed &&','this._ended && !previousEnded','position.toFixed(3)')){if(-not $entry.Contains($required) -or -not $bundle.Contains($required)){throw "R2R bundle marker missing: $required"}}
          if($player.Contains('typingTarget')){throw 'broad keyboard reveal survived'}
          if(-not $player.Contains("if (!playerLocked) showPlayerControls('mouse');")){throw 'mouse-only reveal marker missing'}
          if(-not $player.Contains("showPlayerControls('settings')")){throw 'settings pin reveal marker missing'}
          if(-not $app.Contains("if(source!=='mouse'&&!settingsOpen())return")){throw 'controls source guard missing'}
          foreach($required in @('function libmpvPipSurface(',"canvas[data-lilac-libmpv-surface]",'surface.captureStream(30)','document.pictureInPictureEnabled === true')){if(-not $player.Contains($required)){throw "R2R PiP marker missing: $required"}}
          foreach($required in @('assEffectsSheet','psVttStyle','psSubtitleBestPreset','psVttWeight','psVttMaxWidth','psVttShadow','psSubtitleLineHeight')){if(-not $index.Contains($required)){throw "R2R subtitle/UI guard missing: $required"}}
          if($index.Contains('id="psVttLineHeight"')){throw 'duplicate legacy R2P line-height control survived'}
          foreach($required in @('vttWeight: 650','vttOutline: 2.25','vttMaxWidth: 82','subtitleLineHeight: 120','vttShadow: 55')){if(-not $player.Contains($required)){throw "R2R preset marker missing: $required"}}
          foreach($required in @("localStorage.getItem('vttWeight') || 650","localStorage.getItem('vttMaxWidth') || 82","localStorage.getItem('subtitleLineHeight')","localStorage.getItem('vttShadow') || 55",'sideInset.toFixed(3)')){if(-not $entry.Contains($required) -or -not $bundle.Contains($required)){throw "R2R rendered subtitle marker missing: $required"}}
          if(-not $app.Contains("localStorage.getItem('vttLineHeight')")){throw 'legacy line-height migration missing'}
          if(-not $main.Contains("const API = 'https://api.tenrai.org/v1';")){throw 'Tenrai metadata base missing'}
          if($main.Contains('api.jikan.moe')){throw 'retired Jikan URL survived'}
          if(-not $main.Contains('AbortSignal.timeout(15000)')){throw 'metadata timeout missing'}
          if(-not (Test-Path electron/miruro-session.cjs) -or -not $main.Contains('createMiruroSession')){throw 'upstream 0.5.50 Miruro session handling missing'}
          if((Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_ADDON_SHA256){throw 'addon identity changed'}
          if((Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_DLL_SHA256){throw 'DLL identity changed'}
          Write-Host 'R2R_ARCHITECTURE_IDENTITY_OK upstream=0.5.50 fullUiGuards=1 metadata=tenrai subtitlePreset=95/10/650/2.25/82/120/55 lineHeight=upstream pip=direct-surface native=exact'

      - name: Build Windows R2R installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify packaged installer payload and R2R features
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem dist -File -Filter 'LilacAnime-Libmpv-R2R-Setup.exe'|Select-Object -First 1;if(-not $installer){throw 'R2R installer missing'}
          $raw=Join-Path $env:RUNNER_TEMP 'r2r-installer';$nested=Join-Path $env:RUNNER_TEMP 'r2r-nested';$asarOut=Join-Path $env:RUNNER_TEMP 'r2r-asar';New-Item -ItemType Directory -Force -Path $raw,$nested,$asarOut|Out-Null
          & 7z.exe x $installer.FullName "-o$raw" -y|Out-Null;$i=0;foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){$i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null;& 7z.exe x $a.FullName "-o$out" -y|Out-Null}
          $addon=Get-ChildItem $raw,$nested -Recurse -File -Filter 'lilac-libmpv-player-bridge.node'|Select-Object -First 1;$dll=Get-ChildItem $raw,$nested -Recurse -File -Filter 'libmpv-2.dll'|Select-Object -First 1
          if(-not $addon -or -not $dll){throw 'packaged native payload missing'}
          if((Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_ADDON_SHA256){throw 'packaged addon mismatch'};if((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_DLL_SHA256){throw 'packaged DLL mismatch'}
          $asar=Get-ChildItem $raw,$nested -Recurse -File -Filter 'app.asar'|Select-Object -First 1;if(-not $asar){throw 'app.asar missing'};& npx.cmd asar extract $asar.FullName $asarOut;if($LASTEXITCODE -ne 0){throw 'asar extract failed'}
          $entry=Get-Content (Join-Path $asarOut 'src/libmpv-shared.generated.js') -Raw;$player=Get-Content (Join-Path $asarOut 'src/player.js') -Raw;$app=Get-Content (Join-Path $asarOut 'src/app.js') -Raw;$index=Get-Content (Join-Path $asarOut 'src/index.html') -Raw;$main=Get-Content (Join-Path $asarOut 'electron/main.cjs') -Raw;$pkg=Get-Content (Join-Path $asarOut 'package.json') -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2r.rc1' -or $pkg.lilacCustomTag -ne $env:CUSTOM_RELEASE_TAG){throw 'packaged R2R metadata mismatch'}
          foreach($required in @('state.fileLoaded !== true','this._loadConfirmed = true','this._ended = this._loadConfirmed &&','copyExternalImageToTexture')){if(-not $entry.Contains($required)){throw "packaged core marker missing: $required"}}
          foreach($required in @('surface.captureStream(30)','function libmpvPipSurface(')){if(-not $player.Contains($required)){throw "packaged PiP marker missing: $required"}}
          foreach($required in @('assEffectsSheet','psVttStyle','psSubtitleBestPreset','psVttWeight','psVttMaxWidth','psVttShadow','psSubtitleLineHeight')){if(-not $index.Contains($required)){throw "packaged UI/subtitle marker missing: $required"}}
          if($index.Contains('id="psVttLineHeight"')){throw 'packaged duplicate line-height control survived'}
          foreach($required in @('vttWeight: 650','vttOutline: 2.25','vttMaxWidth: 82','subtitleLineHeight: 120','vttShadow: 55')){if(-not $player.Contains($required)){throw "packaged preset marker missing: $required"}}
          foreach($required in @("vttWeight') || 650","vttMaxWidth') || 82","subtitleLineHeight')","vttShadow') || 55",'sideInset.toFixed(3)')){if(-not $entry.Contains($required)){throw "packaged subtitle renderer marker missing: $required"}}
          if(-not $app.Contains("localStorage.getItem('vttLineHeight')")){throw 'packaged legacy line-height migration missing'}
          if(-not $main.Contains("const API = 'https://api.tenrai.org/v1';") -or $main.Contains('api.jikan.moe') -or -not $main.Contains('AbortSignal.timeout(15000)')){throw 'packaged metadata API policy mismatch'}
          if(-not (Test-Path (Join-Path $asarOut 'electron/miruro-session.cjs')) -or -not $main.Contains('createMiruroSession')){throw 'packaged upstream 0.5.50 Miruro session missing'}
          $hash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant();"R2R_INSTALLER_PATH=$($installer.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"R2R_INSTALLER_SHA256=$hash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2R_PACKAGED_VERIFY_OK bytes=$($installer.Length) sha=$hash upstream=0.5.50 uiStartupFix=1 metadata=tenrai subtitlePreset=95/10/650/2.25/82/120/55 pip=direct-surface native=exact"

      - name: Create checksum and attestation
        shell: powershell
        run: |
          $installer=Get-Item $env:R2R_INSTALLER_PATH;$checksum=Join-Path $installer.DirectoryName 'LilacAnime-Libmpv-R2R-Setup.sha256.txt';[IO.File]::WriteAllText($checksum,"$env:R2R_INSTALLER_SHA256  $($installer.Name)`n",(New-Object Text.UTF8Encoding($false)))
          $att=[ordered]@{schema=1;releaseTag=$env:CUSTOM_RELEASE_TAG;version='0.5.50-libmpv-r2r.rc1';upstream='v0.5.50';upstreamSha=$env:UPSTREAM_SHA;electron=$env:ELECTRON_VERSION;qualifiedSource=$env:QUALIFIED_SOURCE_COMMIT;qualifiedAddonSha256=$env:QUALIFIED_ADDON_SHA256;qualifiedDllSha256=$env:QUALIFIED_DLL_SHA256;installerSha256=$env:R2R_INSTALLER_SHA256;metadataApi=[ordered]@{base='https://api.tenrai.org/v1';timeoutMs=15000;routes=@('season','top','search','detail');liveSmoke=$true};subtitlePreset=[ordered]@{size=95;position=10;weight=650;outline=2.25;maxWidth=82;lineHeight=120;lineHeightKey='subtitleLineHeight';shadow=55;fileStyle=$false};fixes=@('fix full renderer startup regression caused by overly broad R2P subtitle HTML normalization','preserve ASS original-effects and VTT file-style controls','add full renderer settings-home-search interaction gate','rebase onto upstream Lilac 0.5.50','preserve upstream 0.5.50 Miruro persistent session/auth recovery','use upstream 0.5.50 official subtitle line-height control and migrate old vttLineHeight','preserve Tenrai metadata recovery and 15 second timeout','preserve R2N direct WebGPU PiP','preserve R2M stale EOF and keyboard UI policy','no native/WebGPU playback pipeline changes')};$att|ConvertTo-Json -Depth 7|Set-Content (Join-Path $installer.DirectoryName 'LilacAnime-Libmpv-R2R-attestation.json') -Encoding utf8
          Write-Host 'R2R_ATTESTATION_OK'

