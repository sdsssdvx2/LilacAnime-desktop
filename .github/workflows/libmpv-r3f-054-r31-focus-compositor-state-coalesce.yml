name: LilacAnime Libmpv R31 focus compositor state coalesce

on:
  push:
    branches: [libmpv-r3f-054-r31-focus-compositor-state-coalesce]
    paths:
      - .github/workflows/libmpv-r3f-054-r31-focus-compositor-state-coalesce.yml
      - scripts/r31-focus-compositor-state-coalesce-build.ps1
      - scripts/r31-transform-anchor-normalize.cjs
      - scripts/r31-focus-compositor-state-coalesce-fix.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r31-focus-compositor-state-coalesce
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  RELEASE_TAG: libmpv-r2k-v0.5.54-r31
  INSTALLER_NAME: LilacAnime-Libmpv-R31-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r31-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc11
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12
      - name: Build and qualify R31 focus compositor state coalesce
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r31-focus-compositor-state-coalesce-build.ps1
      - name: Upload qualified R31 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r31-focus-compositor-state-coalesce
          path: |
            dist/LilacAnime-Libmpv-R31-Setup.exe
            dist/lilacanime-libmpv-r31-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish and reverify public bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r31 focus compositor state coalesce' --notes 'R31 addresses the two independently isolated R30 issues without changing the qualified native producer bytes. Focused playback remains the R27/R30 direct WebGPU path. When the window is unfocused, R31 covers the WebGPU swapchain with a separate Canvas2D compositor shield fed directly from the received VideoFrame; this is deliberately not the failed R28 WebGPU staging path. A low-rate hidden mirror prewarms the shield and it remains visible for two direct frames after focus returns. Separately, routine synchronous pollPlayback calls are coalesced from 250ms to 1000ms while the renderer extrapolates currentTime from the native sample wall clock, preserving smooth subtitle/progress timing while reducing main-thread stalls. R30 managed SharedTextureImported.release(), producer watchdog/backlog collapse, R27 diagnostics, R24 mailbox/occlusion guards, window/PiP behavior, profile identity, addon and libmpv DLL bytes are preserved.'
          if($LASTEXITCODE-ne 0){throw 'release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'release upload failed'}
          $v=Join-Path $env:RUNNER_TEMP 'r31-public';New-Item -ItemType Directory -Force -Path $v|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $v --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'public redownload failed'}
          $e=Join-Path $v $env:INSTALLER_NAME;$m=Get-Content (Join-Path $v $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $e).Length
          if($h-ne $env:R31_INSTALLER_SHA256 -or $z-ne [long]$env:R31_INSTALLER_SIZE){throw 'public installer byte mismatch'}
          if($m.installerSha256-ne $h -or $m.electron-ne '44.9.3' -or $m.sharedTextureImport-ne 'function' -or $m.sharedTextureSend-ne 'function'){throw 'public runtime proof mismatch'}
          if($m.deliveryMode-ne 'serial-latest-frame-mailbox' -or $m.inactiveCompositorGuard-ne $true -or $m.cadenceHotpath-ne 'record-only-snapshot-4hz'){throw 'public qualified baseline mismatch'}
          if($m.r26BoundaryTrace-ne 'ring256-on-demand-main-dispatch-renderer-entry-getVideoFrame-gpu-copy-present-release'){throw 'public R26 trace mismatch'}
          if($m.r27FocusStallRetention-ne 'anomaly64-threshold60-main+renderer-focus-visibility'){throw 'public R27 retention mismatch'}
          if($m.r30ManagedReleaseProducerDrain-ne 'r27-renderer-byte-identical+managed-sync-token-release+producer-watchdog250+latest-backlog-collapse'){throw 'public R30 producer drain mismatch'}
          if($m.r31FocusCompositorShield-ne 'focused-direct-webgpu+unfocused-canvas2d-shield+prewarm8+recovery2'){throw 'public R31 focus shield mismatch'}
          if($m.r31StateCoalesce-ne 'native-poll1000ms+renderer-wall-clock-extrapolation'){throw 'public R31 state coalesce mismatch'}
          Write-Host "R31_PUBLISHED_OK sha256=$h size=$z electron=$($m.electron) focusedPresenter=direct-webgpu unfocusedPresenter=canvas2d-shield stateNativePollMs=1000 uiClock=wall-extrapolated managedRelease=1 nativeUnchanged=1"
