name: libmpv D3D11 bridge smoke

on:
  push:
    branches: [libmpv-d3d11-prototype]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-d3d11-bridge-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch pinned libmpv SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z'
          $expected = 'efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633'
          $archive = Join-Path $env:RUNNER_TEMP 'libmpv.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'libmpv-sdk'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'libmpv download failed' }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "LIBMPV_ARCHIVE_SHA256=$actual"
          if ($actual -ne $expected) { throw "libmpv SHA mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & 7z.exe x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'libmpv extraction failed' }

          $client = Get-ChildItem $extract -Recurse -File -Filter client.h |
            Where-Object { $_.FullName -match '[\\/]mpv[\\/]client\.h$' } |
            Select-Object -First 1
          if (-not $client) { throw 'mpv/client.h not found in SDK archive' }
          $mpvHeaderDir = Split-Path $client.FullName -Parent
          $vendor = Join-Path $PWD 'native\libmpv-d3d11-bridge\vendor\include\mpv'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          Copy-Item (Join-Path $mpvHeaderDir '*') $vendor -Recurse -Force

          $dll = Get-ChildItem $extract -Recurse -File |
            Where-Object { $_.Name -in @('libmpv-2.dll','mpv-2.dll') } |
            Select-Object -First 1
          if (-not $dll) { throw 'libmpv DLL not found in SDK archive' }
          $runtimeDir = Join-Path $PWD 'native\libmpv-d3d11-bridge\runtime'
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $runtimeDll = Join-Path $runtimeDir 'libmpv-2.dll'
          Copy-Item $dll.FullName $runtimeDll -Force

          Write-Host "LIBMPV_HEADER_DIR=$mpvHeaderDir"
          Write-Host "LIBMPV_DLL_SOURCE=$($dll.FullName)"
          Write-Host "LIBMPV_DLL_BYTES=$((Get-Item $runtimeDll).Length)"
          "LILAC_LIBMPV_DLL=$runtimeDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Electron build dependencies
        shell: powershell
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund electron@43.8.1 node-gyp@12.2.0
          node -e "const v=require('electron/package.json').version;if(v!=='43.8.1')throw new Error('unexpected Electron '+v);console.log('BRIDGE_ELECTRON='+v)"

      - name: Build Electron ABI libmpv D3D11 addon
        shell: powershell
        run: |
          $electronVersion = node -p "require('electron/package.json').version"
          $nodeGyp = Join-Path $PWD 'node_modules\.bin\node-gyp.cmd'
          & $nodeGyp rebuild --directory native/libmpv-d3d11-bridge --target=$electronVersion --dist-url=https://electronjs.org/headers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addon = Resolve-Path 'native/libmpv-d3d11-bridge/build/Release/lilac_libmpv_d3d11_bridge.node'
          "LILAC_LIBMPV_BRIDGE_ADDON=$($addon.Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Syntax check smoke harness
        run: node --check scripts/libmpv-d3d11-smoke.cjs

      - name: Render deterministic BMP through libmpv D3D11
        shell: powershell
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $log = Join-Path $env:RUNNER_TEMP 'libmpv-d3d11-smoke.log'
          & npx.cmd electron scripts/libmpv-d3d11-smoke.cjs 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Copy-Item $log 'libmpv-d3d11-smoke.log' -Force
          if ($code -ne 0) { exit $code }

      - name: Upload bridge smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-d3d11-bridge-smoke
          path: |
            libmpv-d3d11-smoke.log
            native/libmpv-d3d11-bridge/build/Release/lilac_libmpv_d3d11_bridge.node
            native/libmpv-d3d11-bridge/runtime/libmpv-2.dll
          if-no-files-found: warn
          retention-days: 7
