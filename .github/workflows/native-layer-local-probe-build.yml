name: Build one-click native mpv layer probe

on:
  workflow_dispatch:
  push:
    branches: [mpv-native-engine]
    paths:
      - electron/native-layer-local-probe.cjs
      - native/win32-mpv-host.cpp
      - native/win32-screen-pixel.cpp
      - electron-builder.native-layer-probe.yml
      - .github/workflows/native-layer-local-probe-build.yml

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build production-equivalent Win32 mpv host helper
        shell: cmd
        run: >-
          cl /nologo /EHsc /std:c++17 /O2
          /Fe:electron\\win32-mpv-host.exe
          native\\win32-mpv-host.cpp user32.lib gdi32.lib
      - name: Build real-screen pixel sampler
        shell: cmd
        run: >-
          cl /nologo /EHsc /std:c++17 /O2
          /Fe:electron\\win32-screen-pixel.exe
          native\\win32-screen-pixel.cpp user32.lib gdi32.lib
      - name: Validate probe source and host region parser
        shell: powershell
        run: |
          node --check electron/native-layer-local-probe.cjs
          if (-not (Test-Path electron/win32-mpv-host.exe)) { throw 'mpv host helper missing' }
          if (-not (Test-Path electron/win32-screen-pixel.exe)) { throw 'screen pixel helper missing' }
          & electron/win32-mpv-host.exe --self-test-region
          if ($LASTEXITCODE -ne 0) { throw "host region self-test failed: $LASTEXITCODE" }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Exercise packaged Electron probe entrypoint
        shell: powershell
        env:
          LILAC_NATIVE_LAYER_PROBE_SMOKE: '1'
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'LilacNativeMpvLayerProbe-smoke.json'
          $env:LILAC_NATIVE_LAYER_PROBE_RESULT = $resultPath
          & npx.cmd electron electron/native-layer-local-probe.cjs
          $probeExit = $LASTEXITCODE
          if (-not (Test-Path $resultPath)) { throw 'smoke probe did not write result JSON' }
          $raw = Get-Content $resultPath -Raw
          $result = $raw | ConvertFrom-Json
          Write-Host $raw
          Write-Host "HOSTED_SMOKE_PROCESS_EXIT=$probeExit"
          if ($result.schema -ne 4) { throw "unexpected smoke schema: $($result.schema)" }
          if (-not $result.smokeMode) { throw 'probe did not enter smoke mode' }
          if ($result.probe -ne 'Lilac exact mpv host + WebContentsView local probe') { throw "unexpected smoke probe identity: $($result.probe)" }
          if ($null -eq $result.phaseSmoke) { throw 'smoke probe did not execute WebContentsView phase' }
          if (-not $result.phaseSmoke.webContentsViewClickHandler) {
            Write-Warning 'Hosted Windows runner did not deliver synthetic WebContentsView input. This is informational only; real OS click delivery is validated by the local exact-mpv probe.'
          }
          Write-Host 'LOCAL_MPV_PROBE_ENTRYPOINT_OK'
      - name: Build portable exact-mpv probe EXE
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --config electron-builder.native-layer-probe.yml --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist-native-layer-probe -Filter 'LilacNativeMpvLayerProbe.exe' | Select-Object -First 1
          if (-not $exe) { throw 'portable exact-mpv probe EXE was not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'dist-native-layer-probe/LilacNativeMpvLayerProbe.sha256.txt' -Value "$hash  LilacNativeMpvLayerProbe.exe" -Encoding ascii
          Write-Host "PROBE_EXE_BYTES=$($exe.Length)"
          Write-Host "PROBE_EXE_SHA256=$hash"
      - name: Upload direct exact-mpv probe EXE
        uses: actions/upload-artifact@v4
        with:
          name: LilacNativeMpvLayerProbe
          path: |
            dist-native-layer-probe/LilacNativeMpvLayerProbe.exe
            dist-native-layer-probe/LilacNativeMpvLayerProbe.sha256.txt
          if-no-files-found: error
          retention-days: 14
