name: CI native layer composition evidence

on:
  workflow_dispatch:
  push:
    branches: [mpv-native-engine]
    paths:
      - scripts/probe-webcontentsview-d3d11-zorder.cjs
      - native/win32-d3d11-layer-probe.cpp
      - native/win32-screen-pixel.cpp
      - .github/workflows/native-layer-composition-probe.yml

permissions:
  contents: read

jobs:
  native-layer-composition:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build D3D11 native child renderer
        shell: cmd
        run: >-
          cl /nologo /EHsc /std:c++17 /O2
          /Fe:electron\\win32-d3d11-layer-probe.exe
          native\\win32-d3d11-layer-probe.cpp user32.lib gdi32.lib d3d11.lib dxgi.lib
      - name: Build real-screen pixel sampler
        shell: cmd
        run: >-
          cl /nologo /EHsc /std:c++17 /O2
          /Fe:electron\\win32-screen-pixel.exe
          native\\win32-screen-pixel.cpp user32.lib gdi32.lib
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run D3D11 same-window composition probe and preserve status
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'native-layer-probe'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $env:LILAC_NATIVE_PROBE_OUTDIR = $out
          & npx.cmd electron scripts/probe-webcontentsview-d3d11-zorder.cjs
          $probeExit = $LASTEXITCODE
          Set-Content -Path (Join-Path $out 'exit-code.txt') -Value $probeExit -Encoding ascii
          if (-not (Test-Path (Join-Path $out 'result.json'))) {
            '{"schema":4,"probe":"same-window-webcontentsview-d3d11-child","status":"fail","error":"probe exited before writing result.json"}' | Set-Content -Path (Join-Path $out 'result.json') -Encoding utf8
          }
          Write-Host "NATIVE_LAYER_PROBE_PROCESS_EXIT=$probeExit"
          # Evidence must be uploaded before the workflow decides pass/fail.
          exit 0
      - name: Upload native layer probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-layer-composition-evidence
          path: ${{ runner.temp }}/native-layer-probe
          if-no-files-found: error
          retention-days: 14
      - name: Assert native layer composition result
        if: always()
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'native-layer-probe'
          $resultPath = Join-Path $out 'result.json'
          if (-not (Test-Path $resultPath)) {
            throw 'native layer probe did not produce result.json'
          }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          Write-Host (Get-Content $resultPath -Raw)
          if ($result.status -ne 'pass') {
            throw "native layer composition probe failed: $($result.error)"
          }
          foreach ($name in @('phase-a.png', 'phase-b.png', 'probe.log')) {
            if (-not (Test-Path (Join-Path $out $name))) {
              throw "native layer composition evidence is incomplete: missing $name"
            }
          }
          if ($result.screenshotErrors.Count -gt 0) {
            throw 'native layer composition screenshot capture reported an error'
          }
          Write-Host 'NATIVE_LAYER_EVIDENCE_ASSERT_OK'
