name: LilacAnime Libmpv R40 qualified direct-test draft

on:
  push:
    branches: [libmpv-r3f-054-r40-callback-pacing-subtitle-overlay]
    paths:
      - .github/workflows/libmpv-r3f-054-r40-release.yml
      - scripts/r40-postqualify-release.ps1
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r40-qualified-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Exact historical values needed by r40-preflight.ps1 to reconstruct and
  # requalify the authoritative R39 final6 baseline before applying R40.
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r39
  INSTALLER_NAME: LilacAnime-Libmpv-R39-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r39-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc19
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

  # R40 direct-test identity. Keep these separate from the R39 reconstruction env.
  R40_RELEASE_TAG: libmpv-r2k-v0.5.54-r40
  R40_INSTALLER_NAME: LilacAnime-Libmpv-R40-Setup.exe
  R40_MANIFEST_NAME: lilacanime-libmpv-r40-manifest.json
  R40_APP_VERSION: 0.5.54-libmpv-r3f.rc20

jobs:
  qualify-package-publish:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install qualification and packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Parse R40 release PowerShell before qualification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/r40-postqualify-release.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_};throw 'R40 release PowerShell parse failed'}
          Write-Host 'R40_RELEASE_SCRIPT_PARSE_OK'

      - name: Re-run exact R40 preflight and all runtime hard gates
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          # r40-preflight.ps1 deliberately reconstructs historical R39 with real
          # git checkouts, which removes release-only files introduced after the
          # qualified product commit. Preserve the postqualification script outside
          # the worktree and restore it after the fail-closed product preflight.
          $releaseScriptBackup=Join-Path $env:RUNNER_TEMP 'r40-postqualify-release.ps1'
          Copy-Item 'scripts/r40-postqualify-release.ps1' $releaseScriptBackup -Force
          try {
            ./scripts/r40-preflight.ps1
          }
          finally {
            New-Item -ItemType Directory -Force -Path 'scripts' | Out-Null
            Copy-Item $releaseScriptBackup 'scripts/r40-postqualify-release.ps1' -Force
          }
          if(-not(Test-Path 'scripts/r40-postqualify-release.ps1')){throw 'R40 release script restore failed after preflight'}
          Write-Host 'R40_RELEASE_SCRIPT_RESTORED_AFTER_PREFLIGHT'

      - name: Package and postqualify exact R40 workspace
        shell: powershell
        run: ./scripts/r40-postqualify-release.ps1

      - name: Upload qualified R40 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r40-qualified-direct-test
          path: |
            dist/LilacAnime-Libmpv-R40-Setup.exe
            dist/lilacanime-libmpv-r40-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Create direct-test draft and reverify release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'

          # R2K's custom updater reads the repository's releases collection and filters
          # out drafts, but it does NOT filter prereleases. Therefore the one-user R40
          # acceptance build must remain a draft until direct testing is complete.
          # Never delete or overwrite a published R40 release. A rerun may clean up
          # only a draft targeted at this exact workflow SHA.
          # Windows PowerShell 5.1 can turn redirected native stderr into a terminating
          # NativeCommandError when ErrorActionPreference=Stop. Existence probes are
          # intentionally allowed to return exit 1, so temporarily relax only that probe.
          $savedErrorActionPreference=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            $existingRaw = gh release view $env:R40_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,targetCommitish 2>$null
            $existingExit=$LASTEXITCODE
          }
          finally {
            $ErrorActionPreference=$savedErrorActionPreference
          }
          if($existingExit-eq 0){
            $existing=$existingRaw|ConvertFrom-Json
            if($existing.isDraft-ne $true -or $existing.targetCommitish-ne $env:GITHUB_SHA){
              throw "Refusing to replace existing R40 release: prerelease=$($existing.isPrerelease) draft=$($existing.isDraft) target=$($existing.targetCommitish) expected=$env:GITHUB_SHA"
            }
            gh release delete $env:R40_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if($LASTEXITCODE-ne 0){throw 'R40 safe draft cleanup failed'}
          }
          elseif($existingExit-ne 1){
            throw "R40 draft release existence probe failed with exit $existingExit"
          }

          gh release create $env:R40_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r40 callback pacing + single-DOM subtitle' --notes 'R40 is a qualified draft for one direct user acceptance test. It is deliberately kept as a GitHub draft because the existing R2K custom updater reads the releases collection and excludes drafts but does not exclude prereleases. This prevents R39 installations from automatically selecting R40 before the direct test passes. R40 preserves the R33 unfocused native-only owned popup, R37 explicit renderer handoff/full-popup no-hole black-flash path, R38 updater lifecycle, R39 PiP/miniplayer bidirectional native topmost behavior, and focused direct WebGPU presenter. R40 makes the native frame callback authoritative, keeps the 250 ms watchdog recovery-only, removes release-wake cadence amplification except real backpressure, and gates JS wakeups by fresh frame IDs. The real product direct-WebGPU runtime gate measures a focused 11-second interval with a 10-second cadence window and three 4-second native-only blur/refocus cycles, requiring prompt direct-WebGPU recovery and no >=300 ms focused dispatch gaps. R40 also moves unfocused subtitles to a transparent owned overlay sourced from the same focused Chromium DOM/computed style, with real rival-focus ordering, deferred one-shot replay, explicit hide/minimize lifecycle suppression, format-agnostic custom FontFace byte loading/readiness, natural multiline/nested-markup geometry, and raw-HWND pixel/z-order qualification. A producer-thread one-shot current-frame redraw closes the paused/no-subtitle R37 handoff case without moving playback or restoring native subtitle authority. Exact R39 final6 reconstruction, R37 E2E, R39 real native-topmost runtime, packaged ASAR/native hash verification, release-asset redownload verification, and an exact simulation of the R2K custom-updater release filter are mandatory in this workflow.'
          if($LASTEXITCODE-ne 0){throw 'R40 draft release create failed'}

          gh release upload $env:R40_RELEASE_TAG "dist/$env:R40_INSTALLER_NAME" "dist/$env:R40_MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'R40 draft release upload failed'}

          $releaseInfo=gh release view $env:R40_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,targetCommitish
          if($LASTEXITCODE-ne 0){throw 'R40 draft release metadata lookup failed'}
          $release=$releaseInfo|ConvertFrom-Json
          if($release.tagName-ne $env:R40_RELEASE_TAG -or $release.isDraft-ne $true -or $release.targetCommitish-ne $env:GITHUB_SHA){throw 'R40 draft release publication state mismatch'}

          # A draft may or may not have a materialized git tag ref yet. If GitHub has
          # created one, it must point at this exact workflow SHA; otherwise the
          # release targetCommitish check above is authoritative until publication.
          git fetch --tags --force
          $savedErrorActionPreference=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            $tagOutput=@(git rev-list -n 1 $env:R40_RELEASE_TAG 2>$null)
            $tagProbeExit=$LASTEXITCODE
          }
          finally {
            $ErrorActionPreference=$savedErrorActionPreference
          }
          $tagExists=($tagProbeExit-eq 0 -and $tagOutput.Count-gt 0)
          $publishedTagSha='draft-no-tag-ref'
          if($tagExists){
            $publishedTagSha=([string]$tagOutput[0]).Trim()
            if($publishedTagSha-ne $env:GITHUB_SHA){throw "R40 draft tag target mismatch $publishedTagSha != $env:GITHUB_SHA"}
          }
          elseif($tagProbeExit-ne 128 -and $tagProbeExit-ne 1){
            throw "R40 draft tag existence probe failed with exit $tagProbeExit"
          }

          $verify=Join-Path $env:RUNNER_TEMP 'r40-draft-reverify'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:R40_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:R40_INSTALLER_NAME --pattern $env:R40_MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R40 draft release asset redownload failed'}

          $exe=Join-Path $verify $env:R40_INSTALLER_NAME
          $manifestPath=Join-Path $verify $env:R40_MANIFEST_NAME
          if(-not(Test-Path $exe)-or-not(Test-Path $manifestPath)){throw 'R40 redownloaded draft assets missing'}
          $manifest=Get-Content $manifestPath -Raw|ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if($manifest.version-ne $env:R40_APP_VERSION -or
             $manifest.tag-ne $env:R40_RELEASE_TAG -or
             $manifest.releaseWorkflowSourceSha-ne $env:GITHUB_SHA -or
             $manifest.qualifiedSourceSha-ne $env:QUALIFIED_SOURCE_SHA -or
             $manifest.installer-ne $env:R40_INSTALLER_NAME -or
             $manifest.installerSha256-ne $hash -or
             [long]$manifest.installerSize-ne $size -or
             $manifest.electron-ne $env:ELECTRON_VERSION -or
             $manifest.nativeDll-ne $env:QUALIFIED_DLL_SHA256){throw 'R40 redownloaded draft identity/hash mismatch'}

          foreach($flag in @('r40PreflightQualified','r40CallbackPacingRuntimeQualified','r40HandoffForcedRedrawQualified','r40SingleDomSubtitleRuntimeQualified','r40SubtitleFontRuntimeQualified','r40SubtitleGeometryRuntimeQualified','r40R37ProtectedE2EQualified','r40R39TopmostRuntimeRequalified')){
            if($manifest.$flag-ne $true){throw "R40 redownloaded qualification flag missing: $flag"}
          }
          if($manifest.r40BlackFlashInvariant-ne 'R37-full-owned-popup-no-ui-holes-preserved'){throw 'R40 black-flash invariant mismatch'}
          if($manifest.r40UpdaterInvariant-ne 'R38-updater-byte-identical'){throw 'R40 updater invariant mismatch'}
          if($manifest.r40PiPInvariant-ne 'R39-browser+owned-popup-bidirectional-topmost-runtime-repassed'){throw 'R40 PiP/topmost invariant mismatch'}
          if($manifest.r40FocusedPresenterInvariant-ne 'R39-shared-preload-byte-identical-direct-webgpu'){throw 'R40 focused direct-WebGPU invariant mismatch'}
          if($manifest.r40ForbiddenPathInvariant-ne 'R25-disable-direct-composition-absent+R28-staged-webgpu-absent'){throw 'R40 forbidden-path invariant mismatch'}

          # Mirror the exact R2K custom updater exposure rule from
          # apply-libmpv-r2k-upstream-polish.cjs: first 100 releases, not draft,
          # and a libmpv-r2k custom tag. R40 must be absent from that candidate set.
          $channelRaw=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if($LASTEXITCODE-ne 0){throw 'R40 custom updater exposure API lookup failed'}
          $channel=@($channelRaw|ConvertFrom-Json)
          $customTagRe='^libmpv-r2k-v\d+\.\d+\.\d+-r\d+$'
          $customCandidates=@($channel|Where-Object{($_.draft-ne $true)-and([string]$_.tag_name -match $customTagRe)})
          $r40Exposed=@($customCandidates|Where-Object{[string]$_.tag_name -eq $env:R40_RELEASE_TAG})
          if($r40Exposed.Count-ne 0){throw 'R40 draft unexpectedly exposed to R2K custom updater candidate list'}
          $selectedCustomTag=if($customCandidates.Count){[string]$customCandidates[0].tag_name}else{'none'}

          Write-Host "R40_DRAFT_RELEASE_CREATED_AND_REVERIFIED_OK sha256=$hash size=$size tagSha=$publishedTagSha draft=1 customUpdaterExposure=0 selectedExistingCustomTag=$selectedCustomTag pacing=qualified subtitle=qualified handoffRedraw=qualified r37=qualified r39Topmost=qualified"
