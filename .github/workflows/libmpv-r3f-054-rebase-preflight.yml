name: LilacAnime libmpv R3F upstream 0.5.54 rebase preflight

on:
  push:
    branches: [libmpv-r3f-upstream-0.5.54-rebase]
    paths:
      - .github/workflows/libmpv-r3f-054-rebase-preflight.yml
      - scripts/r3f-054-rebase-preflight.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3f-054-rebase-preflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility-map:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild exact 0.5.54 and map libmpv transform compatibility
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/r3f-054-rebase-preflight.cjs
          if($LASTEXITCODE -ne 0){throw "R3F 0.5.54 preflight failed: $LASTEXITCODE"}
