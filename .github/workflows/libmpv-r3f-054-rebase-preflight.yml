name: LilacAnime libmpv R3F upstream 0.5.54 rebase preflight

on:
  push:
    branches: [libmpv-r3f-upstream-0.5.54-rebase]
    paths:
      - .github/workflows/libmpv-r3f-054-rebase-preflight.yml
      - scripts/r3f-054-rebase-preflight.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3f-054-rebase-preflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility-map:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild exact 0.5.54 and map libmpv transform compatibility through R2M
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/r3f-054-rebase-preflight.cjs
          if($LASTEXITCODE -ne 0){throw "R3F 0.5.54 preflight failed: $LASTEXITCODE"}
          node --check scripts/apply-libmpv-r2m-finalize.cjs
          if($LASTEXITCODE -ne 0){throw 'R2M finalize syntax failed'}
          node scripts/apply-libmpv-r2m-finalize.cjs
          if($LASTEXITCODE -ne 0){throw 'R2M finalize failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.49-libmpv-r2m.rc2' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.49-r4'){throw 'R2M historical metadata restore failed'}
          Write-Host 'R3F_0554_R2M_METADATA_OK'

      - name: Apply R2N WebGPU PiP on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/apply-libmpv-r2n-webgpu-pip.cjs
          if($LASTEXITCODE -ne 0){throw 'R2N syntax failed'}
          node scripts/apply-libmpv-r2n-webgpu-pip.cjs
          if($LASTEXITCODE -ne 0){throw 'R2N compatibility failed'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint')){
            if(-not $combined.Contains($marker)){throw "R2N erased upstream marker: $marker"}
          }
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){
            if(-not $updater.Contains($marker)){throw "R2N erased updater marker: $marker"}
          }
          if(Test-Path electron/miruro-session.cjs){throw 'R2N resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2N removed Miruro browser'}
          Write-Host 'R3F_0554_R2N_GUARD_OK'

      - name: Apply R2P subtitle UI on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs')){
            node --check $script
            if($LASTEXITCODE -ne 0){throw "R2P syntax failed: $script"}
            node $script
            if($LASTEXITCODE -ne 0){throw "R2P compatibility failed: $script"}
          }
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.49-libmpv-r2p.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.49-r6'){throw 'R2P metadata mismatch'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','psVttWeight','vttMaxWidth','vttLineHeight','vttShadow')){
            if(-not $combined.Contains($marker)){throw "R2P required marker missing: $marker"}
          }
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){
            if(-not $updater.Contains($marker)){throw "R2P erased updater marker: $marker"}
          }
          if(Test-Path electron/miruro-session.cjs){throw 'R2P resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2P removed Miruro browser'}
          Write-Host 'R3F_0554_R2P_GUARD_OK'

      - name: Apply R2Q Tenrai metadata on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/apply-libmpv-r2q-tenrai-metadata.cjs
          if($LASTEXITCODE -ne 0){throw 'R2Q syntax failed'}
          node scripts/apply-libmpv-r2q-tenrai-metadata.cjs
          if($LASTEXITCODE -ne 0){throw 'R2Q compatibility failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.49-libmpv-r2q.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.49-r7'){throw 'R2Q metadata mismatch'}
          $main=Get-Content electron/main.cjs -Raw
          if(-not $main.Contains("const API = 'https://api.tenrai.org/v1';")){throw 'R2Q Tenrai base missing'}
          if($main.Contains('api.jikan.moe')){throw 'R2Q Jikan runtime URL survived'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','psVttWeight','vttMaxWidth','vttLineHeight','vttShadow')){
            if(-not $combined.Contains($marker)){throw "R2Q erased required marker: $marker"}
          }
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){
            if(-not $updater.Contains($marker)){throw "R2Q erased updater marker: $marker"}
          }
          if(Test-Path electron/miruro-session.cjs){throw 'R2Q resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2Q removed Miruro browser'}
          Write-Host 'R3F_0554_R2Q_GUARD_OK'
