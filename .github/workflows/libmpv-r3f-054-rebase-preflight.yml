name: LilacAnime libmpv R3F upstream 0.5.54 rebase preflight

on:
  push:
    branches: [libmpv-r3f-upstream-0.5.54-rebase]
    paths: [.github/workflows/libmpv-r3f-054-rebase-preflight.yml]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3f-054-rebase-preflight
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_SHA: e4ac62214f5c4863eebae5052633e7f9f33dcbaa
  LEGACY_TEST_SHA: 1d983e1d68e388bfd57abd3c6772d2e037d72dcd

jobs:
  compatibility-map:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble exact 0.5.54 upstream with custom-only libmpv files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:LEGACY_TEST_SHA
          if((git rev-parse HEAD).Trim() -ne $env:LEGACY_TEST_SHA){throw 'legacy tooling pin mismatch'}

          $up=Join-Path $env:RUNNER_TEMP 'upstream-0554'
          git clone --depth 1 --branch v0.5.54 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          if((git -C $up rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA){throw 'upstream 0.5.54 SHA mismatch'}

          # Preserve only files which exist in our legacy tree but not at all in upstream 0.5.54.
          # This keeps libmpv-only integration files while making deleted/renamed upstream files disappear.
          $custom=Join-Path $env:RUNNER_TEMP 'r3f-custom-only'
          New-Item -ItemType Directory -Force -Path $custom|Out-Null
          foreach($area in @('electron','src')){
            $legacyBase=(Resolve-Path $area).Path.TrimEnd('\')+'\'
            $upArea=Join-Path $up $area
            Get-ChildItem $area -Recurse -File | ForEach-Object {
              $rel=$_.FullName.Substring($legacyBase.Length)
              if(!(Test-Path (Join-Path $upArea $rel))){
                $dest=Join-Path (Join-Path $custom $area) $rel
                New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent)|Out-Null
                Copy-Item $_.FullName $dest -Force
                Write-Host "R3F_CUSTOM_ONLY=$area/$($rel.Replace('\','/'))"
              }
            }
          }

          Remove-Item electron -Recurse -Force
          Remove-Item src -Recurse -Force
          Remove-Item tests -Recurse -Force
          Copy-Item (Join-Path $up 'electron') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests') tests -Recurse -Force

          foreach($area in @('electron','src')){
            $saved=Join-Path $custom $area
            if(Test-Path $saved){Copy-Item (Join-Path $saved '*') $area -Recurse -Force}
          }

          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts/anime4k-entry.mjs') scripts/anime4k-entry.mjs -Force

          # Prove representative upstream-owned surfaces are still byte-identical before transforms.
          foreach($p in @('electron/main.cjs','electron/preload.cjs','electron/updater.cjs','electron/miruro-browser.cjs','src/app.js','src/player.js','src/index.html','src/player-android.css')){
            $actual=(Get-FileHash $p -Algorithm SHA256).Hash
            $expected=(Get-FileHash (Join-Path $up $p) -Algorithm SHA256).Hash
            if($actual -ne $expected){throw "upstream surface changed during assembly: $p"}
          }

          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.54'){throw 'assembled package is not upstream 0.5.54'}
          $all=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint')){
            if(-not $all.Contains($marker)){throw "0.5.54 player marker missing: $marker"}
          }
          if(Test-Path electron/miruro-session.cjs){throw 'obsolete Miruro session file survived assembly'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw '0.5.54 Miruro browser missing'}
          foreach($p in @('electron/libmpv-shared-main.cjs','electron/libmpv-shared-preload.cjs','src/libmpv-shared-entry.js')){
            if(!(Test-Path $p)){throw "custom libmpv file missing after assembly: $p"}
          }
          Write-Host "R3F_0554_ASSEMBLY_OK upstream=$env:UPSTREAM_SHA nativeTooling=$env:LEGACY_TEST_SHA"

      - name: Install exact upstream dependencies and transform tools
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 node-gyp@12.2.0
          if($LASTEXITCODE -ne 0){throw 'transform tool install failed'}

      - name: Probe cumulative transform compatibility until first real conflict
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          # Historical transforms have internal version guards. Metadata only is normalized for this probe.
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs',
            'scripts/apply-libmpv-r2-runtime-fixes.cjs',
            'scripts/apply-libmpv-r2b-command-import-diagnostics.cjs',
            'scripts/apply-libmpv-r2c-texture-pool.cjs',
            'scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs',
            'scripts/apply-libmpv-r2g-electron44-releasefix.cjs',
            'scripts/apply-libmpv-r2h-webgpu-copy.cjs',
            'scripts/apply-libmpv-r2i-pipeline-headroom.cjs',
            'scripts/apply-libmpv-r2h-bundle-marker-fix.cjs',
            'scripts/apply-libmpv-r2j-subtitle-overlay.cjs',
            'scripts/apply-libmpv-r2k-upstream-polish.cjs',
            'scripts/apply-libmpv-r2l-player-polish.cjs',
            'scripts/apply-libmpv-r2m-open-race-key-ui.cjs'
          )

          $passed=@()
          foreach($s in $scripts){
            node --check $s
            if($LASTEXITCODE -ne 0){throw "syntax failed: $s"}
            Write-Host "R3F_PROBE_START=$s"
            node $s
            if($LASTEXITCODE -ne 0){
              Write-Host "R3F_FIRST_CONFLICT=$s"
              Write-Host "R3F_PASSED_PREFIX=$($passed -join ',')"
              exit 23
            }
            $passed += $s
            Write-Host "R3F_PROBE_OK=$s"
          }
          Write-Host "R3F_PREFIX_ALL_OK=$($passed.Count)"

      - name: Guard upstream 0.5.54 features after compatible prefix
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint')){
            if(-not $combined.Contains($marker)){throw "compatible prefix erased upstream player feature: $marker"}
          }
          if(Test-Path electron/miruro-session.cjs){throw 'compatible prefix resurrected obsolete Miruro verification implementation'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'compatible prefix removed Miruro browser transport'}
          Write-Host 'R3F_0554_UPSTREAM_FEATURE_GUARD_OK'
