name: LilacAnime libmpv R3F upstream 0.5.54 rebase preflight

on:
  push:
    branches: [libmpv-r3f-upstream-0.5.54-rebase]
    paths:
      - .github/workflows/libmpv-r3f-054-rebase-preflight.yml
      - scripts/r3f-054-rebase-preflight.cjs
      - scripts/r3f-port-r2q-tenrai-0554.cjs
      - scripts/r3f-bridge-r2r-metadata-0554.cjs
      - scripts/r3f-patch-r2t-transform-0554.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3f-054-rebase-preflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility-map:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild exact 0.5.54 and map libmpv transform compatibility through R2M
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r2qPort=Join-Path $env:RUNNER_TEMP 'r3f-port-r2q-tenrai-0554.cjs'
          $r2rBridge=Join-Path $env:RUNNER_TEMP 'r3f-bridge-r2r-metadata-0554.cjs'
          $r2tPatch=Join-Path $env:RUNNER_TEMP 'r3f-patch-r2t-transform-0554.cjs'
          Copy-Item scripts/r3f-port-r2q-tenrai-0554.cjs $r2qPort -Force
          Copy-Item scripts/r3f-bridge-r2r-metadata-0554.cjs $r2rBridge -Force
          Copy-Item scripts/r3f-patch-r2t-transform-0554.cjs $r2tPatch -Force
          "R3F_R2Q_PORT=$r2qPort"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "R3F_R2R_BRIDGE=$r2rBridge"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "R3F_R2T_PATCH=$r2tPatch"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          node scripts/r3f-054-rebase-preflight.cjs
          if($LASTEXITCODE -ne 0){throw "R3F 0.5.54 preflight failed: $LASTEXITCODE"}
          node --check scripts/apply-libmpv-r2m-finalize.cjs
          if($LASTEXITCODE -ne 0){throw 'R2M finalize syntax failed'}
          node scripts/apply-libmpv-r2m-finalize.cjs
          if($LASTEXITCODE -ne 0){throw 'R2M finalize failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.49-libmpv-r2m.rc2' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.49-r4'){throw 'R2M historical metadata restore failed'}
          Write-Host 'R3F_0554_R2M_METADATA_OK'

      - name: Apply R2N WebGPU PiP on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/apply-libmpv-r2n-webgpu-pip.cjs
          if($LASTEXITCODE -ne 0){throw 'R2N syntax failed'}
          node scripts/apply-libmpv-r2n-webgpu-pip.cjs
          if($LASTEXITCODE -ne 0){throw 'R2N compatibility failed'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint')){if(-not $combined.Contains($marker)){throw "R2N erased upstream marker: $marker"}}
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){if(-not $updater.Contains($marker)){throw "R2N erased updater marker: $marker"}}
          if(Test-Path electron/miruro-session.cjs){throw 'R2N resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2N removed Miruro browser'}
          Write-Host 'R3F_0554_R2N_GUARD_OK'

      - name: Apply R2P subtitle UI on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs')){
            node --check $script;if($LASTEXITCODE -ne 0){throw "R2P syntax failed: $script"}
            node $script;if($LASTEXITCODE -ne 0){throw "R2P compatibility failed: $script"}
          }
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.49-libmpv-r2p.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.49-r6'){throw 'R2P metadata mismatch'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','psVttWeight','vttMaxWidth','vttLineHeight','vttShadow')){if(-not $combined.Contains($marker)){throw "R2P required marker missing: $marker"}}
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){if(-not $updater.Contains($marker)){throw "R2P erased updater marker: $marker"}}
          if(Test-Path electron/miruro-session.cjs){throw 'R2P resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2P removed Miruro browser'}
          Write-Host 'R3F_0554_R2P_GUARD_OK'

      - name: Apply R2Q Tenrai metadata on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check $env:R3F_R2Q_PORT;if($LASTEXITCODE -ne 0){throw 'R3F R2Q porter syntax failed'}
          node $env:R3F_R2Q_PORT;if($LASTEXITCODE -ne 0){throw 'R3F R2Q 0.5.54 port failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.49-libmpv-r2q.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.49-r7'){throw 'R2Q metadata mismatch'}
          $main=Get-Content electron/main.cjs -Raw
          foreach($marker in @("const API = 'https://api.tenrai.org/v1';",'AbortSignal.timeout(15000)',"Accept: 'application/json'")){if(-not $main.Contains($marker)){throw "R2Q metadata marker missing: $marker"}}
          if($main.Contains('api.jikan.moe')){throw 'R2Q Jikan runtime URL survived'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','psVttWeight','vttMaxWidth','vttLineHeight','vttShadow')){if(-not $combined.Contains($marker)){throw "R2Q erased required marker: $marker"}}
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){if(-not $updater.Contains($marker)){throw "R2Q erased updater marker: $marker"}}
          if(Test-Path electron/miruro-session.cjs){throw 'R2Q resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2Q removed Miruro browser'}
          Write-Host 'R3F_0554_R2Q_GUARD_OK'

      - name: Bridge R2R metadata and apply R2S on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check $env:R3F_R2R_BRIDGE;if($LASTEXITCODE -ne 0){throw 'R3F R2R bridge syntax failed'}
          node $env:R3F_R2R_BRIDGE;if($LASTEXITCODE -ne 0){throw 'R3F R2R metadata bridge failed'}
          foreach($script in @('scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/rebundle-libmpv-r2s.cjs')){
            node --check $script;if($LASTEXITCODE -ne 0){throw "R2S syntax failed: $script"}
            node $script;if($LASTEXITCODE -ne 0){throw "R2S compatibility failed: $script"}
          }
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2s.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r2'){throw 'R2S metadata mismatch'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','psSubtitleOriginalPreset','playPipSource','event.shiftKey','takeScreenshot()')){if(-not $combined.Contains($marker)){throw "R2S required marker missing: $marker"}}
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){if(-not $updater.Contains($marker)){throw "R2S erased updater marker: $marker"}}
          if(Test-Path electron/miruro-session.cjs){throw 'R2S resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2S removed Miruro browser'}
          $main=Get-Content electron/main.cjs -Raw
          if(-not $main.Contains("const API = 'https://api.tenrai.org/v1';")){throw 'R2S erased Tenrai base'}
          Write-Host 'R3F_0554_R2S_GUARD_OK'

      - name: Apply R2T zero-copy miniplayer parity on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check $env:R3F_R2T_PATCH
          if($LASTEXITCODE -ne 0){throw 'R3F R2T patcher syntax failed'}
          node $env:R3F_R2T_PATCH
          if($LASTEXITCODE -ne 0){throw 'R3F R2T transform patch failed'}
          node --check scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs
          if($LASTEXITCODE -ne 0){throw 'R2T syntax failed'}
          node scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs
          if($LASTEXITCODE -ne 0){throw 'R2T compatibility failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2t.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r3'){throw 'R2T metadata mismatch'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','setLibmpvMiniPlayer','MiniPlayerWindowController')){if(-not $combined.Contains($marker) -and -not (Get-Content electron/main.cjs -Raw).Contains($marker)){throw "R2T required marker missing: $marker"}}
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){if(-not $updater.Contains($marker)){throw "R2T erased updater marker: $marker"}}
          if(Test-Path electron/miruro-session.cjs){throw 'R2T resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2T removed Miruro browser'}
          if(-not (Get-Content electron/main.cjs -Raw).Contains("const API = 'https://api.tenrai.org/v1';")){throw 'R2T erased Tenrai base'}
          Write-Host 'R3F_0554_R2T_GUARD_OK'

      - name: Apply R2U subtitle font and miniplayer fix on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/apply-libmpv-r2u-subtitle-font-miniplayer-fix.cjs
          if($LASTEXITCODE -ne 0){throw 'R2U syntax failed'}
          node scripts/apply-libmpv-r2u-subtitle-font-miniplayer-fix.cjs
          if($LASTEXITCODE -ne 0){throw 'R2U compatibility failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2u.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r4'){throw 'R2U metadata mismatch'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','VTT_FONT_FAMILIES','LilacMiniPlayerDiagnostics','__lilac_miniplayer_on__')){if(-not $combined.Contains($marker) -and -not (Get-Content electron/main.cjs -Raw).Contains($marker)){throw "R2U required marker missing: $marker"}}
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){if(-not $updater.Contains($marker)){throw "R2U erased updater marker: $marker"}}
          if(Test-Path electron/miruro-session.cjs){throw 'R2U resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2U removed Miruro browser'}
          Write-Host 'R3F_0554_R2U_GUARD_OK'

      - name: Apply R2V calibrated subtitle and miniplayer fallback on rebased tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V syntax failed'}
          node scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V compatibility failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2v.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r5'){throw 'R2V metadata mismatch'}
          $combined=(Get-Content src/app.js -Raw)+(Get-Content src/player.js -Raw)+(Get-Content src/index.html -Raw)
          foreach($marker in @('playerSeekHint','controlsOnPlaying','showSeekHint','subtitleSize:105','subtitlePosition:10','subtitleLineHeight:130','vttMaxWidth:92','LilacMiniPlayerDiagnostics')){if(-not $combined.Contains($marker)){throw "R2V required marker missing: $marker"}}
          if($combined.Contains("localStorage.setItem('vttStyle','false')")){throw 'R2V readability preset disables file styles'}
          $updater=Get-Content electron/updater.cjs -Raw
          foreach($marker in @('CUSTOM_RELEASES_API','checkCustom()',"!MAC && !DEB && this.state.status === 'ready'")){if(-not $updater.Contains($marker)){throw "R2V erased updater marker: $marker"}}
          if(Test-Path electron/miruro-session.cjs){throw 'R2V resurrected obsolete Miruro'}
          if(!(Test-Path electron/miruro-browser.cjs)){throw 'R2V removed Miruro browser'}
          if(-not (Get-Content electron/main.cjs -Raw).Contains("const API = 'https://api.tenrai.org/v1';")){throw 'R2V erased Tenrai base'}
          Write-Host 'R3F_0554_R2V_GUARD_OK'
