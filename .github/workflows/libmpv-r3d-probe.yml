name: LilacAnime libmpv R3D r13 probe

on:
  push:
    branches: [libmpv-r3d-stall-isolation-r13]
    paths:
      - scripts/apply-libmpv-r3d-stall-isolation.cjs
      - scripts/smoke-libmpv-r3d-native-timing.cjs
      - .github/workflows/libmpv-r3d-probe.yml
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3d-r13-probe
  cancel-in-progress: true

permissions:
  contents: read

env:
  R3D_RECIPE_SHA: 6b010ba3a1362b03ed413c87f50cee30ddd4f64a
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pin exact R3D recipe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:R3D_RECIPE_SHA
          if((git rev-parse HEAD).Trim() -ne $env:R3D_RECIPE_SHA){throw 'R3D recipe SHA mismatch'}
          if(-not (Test-Path scripts/apply-libmpv-r3d-stall-isolation.cjs)){throw 'R3D transform missing'}
          if(-not (Test-Path scripts/smoke-libmpv-r3d-native-timing.cjs)){throw 'R3D timing smoke missing'}
          Write-Host 'R3D_RECIPE_OK'

      - name: Reproduce exact upstream through R3D
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'upstream-05050'
          git clone --depth 1 --branch v0.5.50 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0 -or (git -C $up rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA){throw 'upstream pin mismatch'}
          Copy-Item (Join-Path $up 'electron/*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src/*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests/*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts/anime4k-entry.mjs') scripts/anime4k-entry.mjs -Force
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 node-gyp@12.2.0
          if($LASTEXITCODE -ne 0){throw 'tool install failed'}
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          if($LASTEXITCODE -ne 0){throw 'package seed failed'}
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs','scripts/apply-libmpv-r2w-aspect-cadence.cjs','scripts/apply-libmpv-r2x-vsync-fullscreen.cjs','scripts/apply-libmpv-r2x-pipeline-diagnostics.cjs','scripts/rebundle-libmpv-r2x-preload.cjs','scripts/apply-libmpv-r2y-cadence-fix.cjs','scripts/apply-libmpv-r2y-timestamp-phase.cjs','scripts/apply-libmpv-r2z-direct-present-ui-fixed.cjs','scripts/apply-libmpv-r3a-decoupled-delivery.cjs','scripts/apply-libmpv-r3a-poll-cadence-fix.cjs','scripts/apply-libmpv-r3a-phase-deadline.cjs','scripts/apply-libmpv-r3b-update-callback.cjs','scripts/apply-libmpv-r3b-pending-wake.cjs','scripts/apply-libmpv-r3c-hotpath-state.cjs','scripts/apply-libmpv-r3d-stall-isolation.cjs'
          )
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2v.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer rebundle failed'}
          npm install --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'post-transform install failed'}
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 node-gyp@12.2.0
          if($LASTEXITCODE -ne 0){throw 'post-transform tool install failed'}
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r3d.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r13' -or $pkg.build.win.artifactName -ne 'LilacAnime-Libmpv-R3D-Setup.${ext}'){throw 'R3D identity mismatch'}
          $b=Get-Content electron/libmpv-shared-main.cjs -Raw
          $n=Get-Content native/libmpv-d3d11-bridge/player_addon.cc -Raw
          $pre=Get-Content electron/libmpv-shared-preload.cjs -Raw
          foreach($m in @('NO_FRAME_BURST_RETRIES = 3','NO_FRAME_BACKOFF_MS = 6','nextActivePumpDelay(performance.now(), true)','nativeUpdateTimingMaxMs','nativeRenderMaxMs','statePollPlaybackMaxMs')){if(-not $b.Contains($m)){throw "R3D bridge marker missing: $m"}}
          foreach($m in @('nativeUpdateMs','nativeEnsureTextureMs','nativeRenderMs','mpv_render_context_set_update_callback')){if(-not $n.Contains($m)){throw "R3D native marker missing: $m"}}
          if($b.Contains('nativeUpdateCallbackInstalled ? 250')){throw 'callback-only 250ms fallback survived'}
          if($b.Contains('await sharedTexture.sendSharedTexture')){throw 'producer transport await survived'}
          if(-not $pre.Contains("presentationMode = 'direct-receive-webgpu-copy'")){throw 'direct presenter lost'}
          Write-Host 'R3D_TRANSFORM_OK'

      - name: Runtime gate retained UI aspect and direct presenter
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & npx.cmd electron scripts/smoke-libmpv-r2z-ui-position-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'UI runtime failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2z-webgpu-direct-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'direct WebGPU runtime failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2w-window-aspect-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'aspect runtime failed'}
          Write-Host 'R3D_UI_RUNTIME_OK'

      - name: Fetch pinned SDK and build R3D addon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'libmpv.7z'
          $extract=Join-Path $env:RUNNER_TEMP 'libmpv-sdk'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $env:LIBMPV_SDK_URL
          if($LASTEXITCODE -ne 0){throw 'SDK download failed'}
          $sdk=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sdk -ne $env:LIBMPV_SDK_SHA256){throw "SDK hash mismatch $sdk"}
          New-Item -ItemType Directory -Force -Path $extract|Out-Null
          7z.exe x $archive "-o$extract" -y|Out-Null
          $client=Get-ChildItem $extract -Recurse -File -Filter client.h|Where-Object{(Split-Path (Split-Path $_.FullName -Parent) -Leaf) -eq 'mpv'}|Select-Object -First 1
          if(-not $client){throw 'client.h missing'}
          $vendor=Join-Path $PWD 'native/libmpv-d3d11-bridge/vendor/include/mpv'
          New-Item -ItemType Directory -Force -Path $vendor|Out-Null
          Copy-Item (Join-Path (Split-Path $client.FullName -Parent) '*') $vendor -Recurse -Force
          $dll=Get-ChildItem $extract -Recurse -File|Where-Object{$_.Name -in @('libmpv-2.dll','mpv-2.dll')}|Select-Object -First 1
          if(-not $dll){throw 'DLL missing'}
          Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          $dh=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($dh -ne $env:QUALIFIED_DLL_SHA256){throw "DLL hash mismatch $dh"}
          & node_modules/.bin/node-gyp.cmd rebuild --directory native/libmpv-d3d11-bridge --target=$env:ELECTRON_VERSION --dist-url=https://electronjs.org/headers
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Copy-Item native/libmpv-d3d11-bridge/build/Release/lilac_libmpv_player_bridge.node electron/lilac-libmpv-player-bridge.node -Force
          $ah=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant()
          "R3D_ADDON_SHA256=$ah"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LILAC_LIBMPV_PLAYER_ADDON=$((Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LILAC_LIBMPV_DLL=$((Resolve-Path 'electron/libmpv-2.dll').Path)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R3D_NATIVE_BUILD_OK addon=$ah dll=$dh"

      - name: Prove timing attribution callback fallback and native retention
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:ELECTRON_RUN_AS_NODE='1'
          & npx.cmd electron scripts/smoke-libmpv-r3d-native-timing.cjs
          if($LASTEXITCODE -ne 0){throw 'R3D native timing smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r3c-callback-signal.cjs
          if($LASTEXITCODE -ne 0){throw 'callback signal smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r3c-poll-latency.cjs
          if($LASTEXITCODE -ne 0){throw 'poll latency smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-native-retention-fhd.cjs
          if($LASTEXITCODE -ne 0){throw 'native retention FHD failed'}
          & npx.cmd electron scripts/smoke-libmpv-native-command-roundtrip.cjs
          if($LASTEXITCODE -ne 0){throw 'native command roundtrip failed'}
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          node scripts/smoke-libmpv-r3a-decoupled-delivery.cjs
          if($LASTEXITCODE -ne 0){throw 'decoupled delivery stress failed'}
          node scripts/smoke-libmpv-r3c-phase-fallback.cjs
          if($LASTEXITCODE -ne 0){throw 'phase fallback failed'}
          Write-Host 'R3D_TIMING_RUNTIME_OK'

      - name: Run retained renderer subtitle miniplayer and open-race regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer input stress failed'}
          foreach($s in @('scripts/smoke-libmpv-r2v-subtitle-controls.cjs','scripts/smoke-libmpv-r2v-subtitle-visual.cjs','scripts/smoke-libmpv-r2v-miniplayer-fallback.cjs','scripts/smoke-libmpv-r2t-miniplayer-interaction.cjs','scripts/smoke-libmpv-r2m-open-race-runtime.cjs')){
            if(Test-Path $s){& npx.cmd electron $s;if($LASTEXITCODE -ne 0){throw "retained Electron probe failed: $s"}}
          }
          Write-Host 'R3D_RETAINED_RUNTIME_OK'

      - name: Run upstream v0.5.50 regression suite
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(Get-ChildItem tests -File -Filter '*.test.cjs'|Sort-Object Name|ForEach-Object{$_.FullName})
          if($tests.Count -lt 1){throw 'upstream tests missing'}
          & node --test @tests
          if($LASTEXITCODE -ne 0){throw 'upstream suite failed'}
          Write-Host "R3D_UPSTREAM_OK files=$($tests.Count)"

      - name: Final R3D architecture gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $b=Get-Content electron/libmpv-shared-main.cjs -Raw
          $n=Get-Content native/libmpv-d3d11-bridge/player_addon.cc -Raw
          $pre=Get-Content electron/libmpv-shared-preload.cjs -Raw
          if($b.Contains('nativeUpdateCallbackInstalled ? 250')){throw 'obsolete callback-only fallback present'}
          if($b.Contains('await sharedTexture.sendSharedTexture')){throw 'producer blocks on delivery'}
          foreach($m in @('NO_FRAME_BACKOFF_MS = 6','nativeUpdateTimingMaxMs','nativeRenderMaxMs','statePollPlaybackMaxMs','async function deliverImportedFrame')){if(-not $b.Contains($m)){throw "final bridge marker missing: $m"}}
          foreach($m in @('nativeUpdateMs','nativeEnsureTextureMs','nativeRenderMs','MPV_RENDER_PARAM_BLOCK_FOR_TARGET_TIME')){if(-not $n.Contains($m)){throw "final native marker missing: $m"}}
          if(-not $pre.Contains("presentationMode = 'direct-receive-webgpu-copy'")){throw 'final direct presenter marker missing'}
          Write-Host "R3D_PROBE_PASS addon=$env:R3D_ADDON_SHA256 dll=$env:QUALIFIED_DLL_SHA256"
