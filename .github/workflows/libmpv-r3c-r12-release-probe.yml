name: Libmpv R3C r12 release-quality probe

on:
  push:
    branches: [libmpv-r3c-release-r12]
    paths: [.github/workflows/libmpv-r3c-r12-release-probe.yml]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3c-r12-release-probe
  cancel-in-progress: true

permissions:
  contents: read

env:
  R3C_TEST_SHA: 02cbba96b03c96d02951255e796d1c359c0b45c1
  R3C_PRODUCT_SHA: 1f467a056e147e87f54b791060dbc2c6763a2e2e
  R2Z_PRODUCT_SHA: 7907d63eb1f15eed7928dd93f4a2b922fbbf01a9
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pin exact R3C product and test-only source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:R3C_TEST_SHA
          if((git rev-parse HEAD).Trim() -ne $env:R3C_TEST_SHA){throw 'R3C test source mismatch'}
          git diff --quiet $env:R3C_PRODUCT_SHA $env:R3C_TEST_SHA -- electron src native package.json package-lock.json
          if($LASTEXITCODE -ne 0){throw 'R3C product files changed after product SHA'}
          git diff --quiet $env:R3C_PRODUCT_SHA $env:R3C_TEST_SHA -- scripts/apply-libmpv-r3c-hotpath-state.cjs scripts/apply-libmpv-r3b-update-callback.cjs scripts/apply-libmpv-r3b-pending-wake.cjs scripts/apply-libmpv-r3a-decoupled-delivery.cjs scripts/apply-libmpv-r3a-poll-cadence-fix.cjs scripts/apply-libmpv-r3a-phase-deadline.cjs
          if($LASTEXITCODE -ne 0){throw 'R3C product transforms changed after product SHA'}
          git diff --quiet $env:R2Z_PRODUCT_SHA $env:R3C_PRODUCT_SHA -- src
          if($LASTEXITCODE -ne 0){throw 'R3C unexpectedly changed renderer UI source'}
          Write-Host 'R3C_SOURCE_IDENTITY_OK product=1f467a0 tests=02cbba9 r2z-ui-retained=1'

      - name: Reproduce exact upstream through R3C
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'upstream-05050'
          git clone --depth 1 --branch v0.5.50 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0 -or (git -C $up rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA){throw 'upstream pin mismatch'}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          if($LASTEXITCODE -ne 0){throw 'package seed failed'}
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs','scripts/apply-libmpv-r2w-aspect-cadence.cjs','scripts/apply-libmpv-r2x-vsync-fullscreen.cjs','scripts/apply-libmpv-r2x-pipeline-diagnostics.cjs','scripts/rebundle-libmpv-r2x-preload.cjs','scripts/apply-libmpv-r2y-cadence-fix.cjs','scripts/apply-libmpv-r2y-timestamp-phase.cjs','scripts/apply-libmpv-r2z-direct-present-ui-fixed.cjs','scripts/apply-libmpv-r3a-decoupled-delivery.cjs','scripts/apply-libmpv-r3a-poll-cadence-fix.cjs','scripts/apply-libmpv-r3a-phase-deadline.cjs','scripts/apply-libmpv-r3b-update-callback.cjs','scripts/apply-libmpv-r3b-pending-wake.cjs','scripts/apply-libmpv-r3c-hotpath-state.cjs'
          )
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2v.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer rebundle failed'}
          npm install --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'post-transform install failed'}
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 node-gyp@12.2.0
          $p=Get-Content package.json -Raw|ConvertFrom-Json
          if($p.version -ne '0.5.50-libmpv-r3c.rc1' -or $p.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r12' -or $p.build.win.artifactName -ne 'LilacAnime-Libmpv-R3C-Setup.${ext}'){throw 'R3C identity mismatch'}
          if((node -p "require('electron/package.json').version") -ne $env:ELECTRON_VERSION){throw 'Electron version mismatch'}
          $b=Get-Content electron/libmpv-shared-main.cjs -Raw;$n=Get-Content native/libmpv-d3d11-bridge/player_addon.cc -Raw;$pre=Get-Content electron/libmpv-shared-preload.cjs -Raw
          foreach($m in @('pollPlayback','fullDiagnostics ? addon.poll(playerId) : addon.pollPlayback(playerId)','nativeWakePending','nextDelay = nextActivePumpDelay()','async function deliverImportedFrame')){if(-not $b.Contains($m)){throw "bridge marker missing: $m"}}
          foreach($m in @('napi_value PollPlayback','mpv_render_context_set_update_callback','napi_call_threadsafe_function','updateCallbacksInFlight')){if(-not $n.Contains($m)){throw "native marker missing: $m"}}
          if($n.Contains("DrainEvents(player);`n  const uint64_t flags = gMpv.render_context_update")){throw 'normal event drain remains in render hot path'}
          if($b.Contains('await sharedTexture.sendSharedTexture')){throw 'delivery is blocking producer'}
          if(-not $pre.Contains("presentationMode = 'direct-receive-webgpu-copy'")){throw 'R2Z direct presenter lost'}
          Write-Host 'R3C_REPRODUCE_OK callback+phase-timer direct-present async-delivery'

      - name: Retain R2Z fullscreen UI aspect and direct presentation runtime gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & npx.cmd electron scripts/smoke-libmpv-r2z-ui-position-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'UI position runtime failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2z-webgpu-direct-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'direct WebGPU runtime failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2w-window-aspect-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'aspect runtime failed'}
          Write-Host 'R3C_R2Z_RUNTIME_OK uiToggles=8 aspect=16:9 presentation=direct'

      - name: Fetch exact libmpv SDK and build R3C callback addon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'libmpv.7z';$extract=Join-Path $env:RUNNER_TEMP 'libmpv-sdk'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $env:LIBMPV_SDK_URL
          if($LASTEXITCODE -ne 0){throw 'libmpv SDK download failed'}
          $sdkHash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sdkHash -ne $env:LIBMPV_SDK_SHA256){throw "SDK hash mismatch: $sdkHash"}
          New-Item -ItemType Directory -Force -Path $extract|Out-Null
          7z.exe x $archive "-o$extract" -y|Out-Null
          if($LASTEXITCODE -ne 0){throw 'SDK extraction failed'}
          $client=Get-ChildItem $extract -Recurse -File -Filter client.h|Where-Object{$_.FullName -match '[\\/]mpv[\\/]client\.h$'}|Select-Object -First 1
          if(-not $client){throw 'mpv/client.h missing'}
          $headerDir=Split-Path $client.FullName -Parent;$vendor=Join-Path $PWD 'native\libmpv-d3d11-bridge\vendor\include\mpv'
          New-Item -ItemType Directory -Force -Path $vendor|Out-Null;Copy-Item (Join-Path $headerDir '*') $vendor -Recurse -Force
          $dll=Get-ChildItem $extract -Recurse -File|Where-Object{$_.Name -in @('libmpv-2.dll','mpv-2.dll')}|Select-Object -First 1
          if(-not $dll){throw 'libmpv DLL missing'}
          Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          $dh=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($dh -ne $env:QUALIFIED_DLL_SHA256){throw "DLL hash changed: $dh"}
          $nodeGyp=Join-Path $PWD 'node_modules\.bin\node-gyp.cmd'
          & $nodeGyp rebuild --directory native/libmpv-d3d11-bridge --target=$env:ELECTRON_VERSION --dist-url=https://electronjs.org/headers
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $built=(Resolve-Path 'native/libmpv-d3d11-bridge/build/Release/lilac_libmpv_player_bridge.node').Path
          Copy-Item $built electron/lilac-libmpv-player-bridge.node -Force
          $ah=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant()
          "R3C_ADDON_SHA256=$ah"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LILAC_LIBMPV_PLAYER_ADDON=$((Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path)"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LILAC_LIBMPV_DLL=$((Resolve-Path 'electron/libmpv-2.dll').Path)"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R3C_NATIVE_BUILD_OK addon=$ah dll=$dh sdk=$sdkHash"

      - name: Prove callback semantics lightweight state and hybrid cadence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:ELECTRON_RUN_AS_NODE='1'
          & npx.cmd electron scripts/smoke-libmpv-r3c-callback-signal.cjs
          if($LASTEXITCODE -ne 0){throw 'real callback signal smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r3c-poll-latency.cjs
          $pollExit=$LASTEXITCODE
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          if($pollExit -ne 0){throw 'lightweight poll smoke failed'}
          node scripts/smoke-libmpv-r3a-decoupled-delivery.cjs
          if($LASTEXITCODE -ne 0){throw 'callback+phase delayed-transport stress failed'}
          node scripts/smoke-libmpv-r2y-pump-sim.cjs
          if($LASTEXITCODE -ne 0){throw 'phase-aware timer fallback regression failed'}
          Write-Host 'R3C_TIMING_GATES_OK callback=real hybrid=synthetic phaseFallback=retained'

      - name: Run native retained renderer subtitle miniplayer and open-race regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:ELECTRON_RUN_AS_NODE='1'
          foreach($s in @('scripts/smoke-libmpv-native-retention-fhd.cjs','scripts/smoke-libmpv-native-command-roundtrip.cjs','scripts/smoke-libmpv-relay-av.cjs')){& npx.cmd electron $s;if($LASTEXITCODE -ne 0){throw "native regression failed: $s"}}
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer input stress failed'}
          foreach($s in @('scripts/smoke-libmpv-r2v-subtitle-controls.cjs','scripts/smoke-libmpv-r2v-subtitle-visual.cjs','scripts/smoke-libmpv-r2v-miniplayer-fallback.cjs','scripts/smoke-libmpv-r2t-miniplayer-interaction.cjs')){& npx.cmd electron $s;if($LASTEXITCODE -ne 0){throw "retained Electron probe failed: $s"}}
          foreach($s in @('scripts/smoke-libmpv-r2t-miniplayer-window.cjs','scripts/smoke-libmpv-r2m-key-ui.cjs','scripts/smoke-flix-proxy-fixture.cjs')){node $s;if($LASTEXITCODE -ne 0){throw "retained node probe failed: $s"}}
          & npx.cmd electron scripts/smoke-libmpv-r2m-open-race.cjs
          if($LASTEXITCODE -ne 0){throw 'open-race Electron probe failed'}
          Write-Host 'R3C_RETAINED_REGRESSIONS_OK native+renderer+subtitle+miniplayer+openRace'

      - name: Run upstream 0.5.50 regression suite
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $t='tests/window-buttons.test.cjs';$original=Get-Content $t -Raw
          node -e "const fs=require('fs'),p=process.argv[1],s=fs.readFileSync(p,'utf8'),n='const context=vm.createContext({process:{platform},windowButtons,BrowserWindow:{fromWebContents:()=>win},ipcMain:{handle:(name,handler)=>handlers.set(name,handler)}});';if(!s.includes(n))throw Error('VM anchor missing');fs.writeFileSync(p,s.replace(n,'const context=vm.createContext({process:{platform},windowButtons,setVideoAspectLocked:()=>{},BrowserWindow:{fromWebContents:()=>win},ipcMain:{handle:(name,handler)=>handlers.set(name,handler)}});'))" $t
          if($LASTEXITCODE -ne 0){throw 'window-buttons VM adapter failed'}
          $tests=@(Get-ChildItem tests -File -Filter '*.test.cjs'|Sort-Object Name|ForEach-Object{$_.FullName})
          & node --test @tests
          $exit=$LASTEXITCODE
          Set-Content $t -Value $original -NoNewline
          if($exit -ne 0){throw 'upstream 0.5.50 regression suite failed'}
          Write-Host 'R3C_UPSTREAM_REGRESSION_OK expected=278'

      - name: Final release-candidate architecture and identity gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Content package.json -Raw|ConvertFrom-Json;$b=Get-Content electron/libmpv-shared-main.cjs -Raw;$n=Get-Content native/libmpv-d3d11-bridge/player_addon.cc -Raw;$pre=Get-Content electron/libmpv-shared-preload.cjs -Raw;$css=Get-Content src/player-android.css -Raw
          if($p.version -ne '0.5.50-libmpv-r3c.rc1' -or $p.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r12'){throw 'final identity drift'}
          foreach($m in @('nativeWakePending','nativeUpdateSignals','nativeUpdateWakeups','pollPlayback','async function deliverImportedFrame','nextActivePumpDelay')){if(-not$b.Contains($m)){throw "final bridge marker missing $m"}}
          foreach($m in @('mpv_render_context_set_update_callback','napi_create_threadsafe_function','napi_value PollPlayback')){if(-not$n.Contains($m)){throw "final native marker missing $m"}}
          if($b.Contains('await sharedTexture.sendSharedTexture')){throw 'blocking transport returned'}
          if(-not$pre.Contains("presentationMode = 'direct-receive-webgpu-copy'")){throw 'direct presenter lost'}
          if($pre.Contains("presentationMode = 'raf-warm-staged-copy'")){throw 'R2Y staged presenter returned'}
          if($css.Contains('.immersive-player.windowed .player-settings { right: 150px; }')){throw 'fullscreen settings-position regression returned'}
          $ah=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant();$dh=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ah -ne $env:R3C_ADDON_SHA256 -or $dh -ne $env:QUALIFIED_DLL_SHA256){throw 'native artifact identity drift'}
          Write-Host "R3C_RELEASE_PROBE_PASS product=$env:R3C_PRODUCT_SHA addon=$ah dll=$dh"

      - name: Upload qualified R3C native candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: R3C-r12-release-probe-native
          path: |
            electron/lilac-libmpv-player-bridge.node
            electron/libmpv-2.dll
          retention-days: 7
