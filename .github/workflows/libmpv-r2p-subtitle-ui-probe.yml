name: Libmpv R2P subtitle UI probe

on:
  push:
    branches: [libmpv-r2p-subtitle-ui]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2p-subtitle-ui-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe-r2p:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Overlay exact upstream Lilac 0.5.49 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.49'
          git clone --depth 1 --branch v0.5.49 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          $sha=(git -C $up rev-parse HEAD).Trim()
          if($sha -ne 'e67c86d40aa0d7fa84db06d9151f6a097b5099ad'){throw "upstream tag moved: $sha"}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
      - name: Syntax-check R2P additions
        shell: powershell
        run: |
          foreach($s in @('scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/rebundle-libmpv-r2p.cjs','scripts/smoke-libmpv-r2p-subtitle-ui.cjs')){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"}}
      - name: Apply qualified R2I through R2P transforms
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs',
            'scripts/apply-libmpv-r2-runtime-fixes.cjs',
            'scripts/apply-libmpv-r2b-command-import-diagnostics.cjs',
            'scripts/apply-libmpv-r2c-texture-pool.cjs',
            'scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs',
            'scripts/apply-libmpv-r2g-electron44-releasefix.cjs',
            'scripts/apply-libmpv-r2h-webgpu-copy.cjs',
            'scripts/apply-libmpv-r2i-pipeline-headroom.cjs',
            'scripts/apply-libmpv-r2h-bundle-marker-fix.cjs',
            'scripts/apply-libmpv-r2j-subtitle-overlay.cjs',
            'scripts/apply-libmpv-r2k-upstream-polish.cjs',
            'scripts/apply-libmpv-r2l-player-polish.cjs',
            'scripts/apply-libmpv-r2m-open-race-key-ui.cjs',
            'scripts/apply-libmpv-shared-texture.cjs',
            'scripts/apply-libmpv-r2e-native-command-gates.cjs',
            'scripts/apply-libmpv-r2m-finalize.cjs',
            'scripts/apply-libmpv-r2n-webgpu-pip.cjs',
            'scripts/normalize-libmpv-r2p-subtitle-anchor.cjs',
            'scripts/apply-libmpv-r2p-subtitle-ui.cjs')
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2p.cjs
          if($LASTEXITCODE -ne 0){throw 'R2P renderer rebundle failed'}
          $version=node -p "require('./package.json').version"
          $tag=node -p "require('./package.json').lilacCustomTag"
          if($version -ne '0.5.49-libmpv-r2p.rc1' -or $tag -ne 'libmpv-r2k-v0.5.49-r6'){throw "R2P metadata mismatch: $version / $tag"}
          foreach($s in @('src/player.js','src/app.js','src/libmpv-shared-entry.js','src/libmpv-shared.generated.js')){node --check $s;if($LASTEXITCODE -ne 0){throw "post-transform syntax failed: $s"}}
          Write-Host 'R2P_TRANSFORMS_APPLIED_OK'
      - name: Verify subtitle UI and existing behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & npx.cmd electron scripts/smoke-libmpv-vtt-overlay.cjs
          if($LASTEXITCODE -ne 0){throw 'existing VTT overlay smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2p-subtitle-ui.cjs
          if($LASTEXITCODE -ne 0){throw 'R2P subtitle UI smoke failed'}
          node scripts/smoke-libmpv-r2m-key-ui.cjs
          if($LASTEXITCODE -ne 0){throw 'R2M keyboard UI regression failed'}
          node scripts/smoke-libmpv-r2n-pip-policy.cjs
          if($LASTEXITCODE -ne 0){throw 'R2N PiP policy regression failed'}
          Write-Host 'R2P_BEHAVIOR_PROBE_OK'
      - name: Prove playback pipeline sources were not edited by R2P transform
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $transform=Get-Content scripts/apply-libmpv-r2p-subtitle-ui.cjs -Raw
          foreach($forbidden in @('electron/libmpv-shared-main.cjs','electron/libmpv-shared-preload.cjs','electron/lilac-libmpv-player-bridge.node','electron/libmpv-2.dll','copyExternalImageToTexture(')){
            if($transform.Contains("write('$forbidden'") -or $transform.Contains("write(\"$forbidden\"")){throw "R2P transform writes playback pipeline: $forbidden"}
          }
          $entry=Get-Content src/libmpv-shared-entry.js -Raw
          if(-not $entry.Contains('copyExternalImageToTexture')){throw 'qualified WebGPU copy marker missing'}
          Write-Host 'R2P_PLAYBACK_PIPELINE_UNTOUCHED_OK'
