name: LilacAnime Libmpv R39 runtime recovery

on:
  push:
    branches: [libmpv-r3f-054-r39-runtime-recovery]
    paths:
      - .github/workflows/libmpv-r3f-054-r39-runtime-recovery.yml
      - scripts/r39-runtime-source-probe.cjs
      - scripts/r39-runtime-recovery-fix.cjs
      - scripts/r39-runtime-recovery-smoke.cjs
      - scripts/r39-refocus-phase-e2e-smoke.cjs
      - scripts/r39-miniplayer-electron-smoke.cjs
      - scripts/r39-qualified-build.ps1
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r39-runtime-recovery
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r38
  INSTALLER_NAME: LilacAnime-Libmpv-R38-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r38-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc18
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  qualify-package-publish:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Preflight R39 support
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('scripts/r39-runtime-source-probe.cjs','scripts/r39-runtime-recovery-fix.cjs','scripts/r39-runtime-recovery-smoke.cjs','scripts/r39-refocus-phase-e2e-smoke.cjs','scripts/r39-miniplayer-electron-smoke.cjs')){
            node --check $script
            if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          }
          $null=[scriptblock]::Create((Get-Content scripts/r39-qualified-build.ps1 -Raw))
          Write-Host 'R39_SUPPORT_PREFLIGHT_OK'

      - name: Reconstruct exact fully qualified R38 baseline
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node scripts/r32-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r33-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r36-transform-r35-anchor-compat.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          ./scripts/r38-qualified-build.ps1
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Write-Host 'R39_R38_BASELINE_OK fullInheritedQualification=1'

      - name: Probe exact final R38 source before modification
        shell: powershell
        run: |
          node scripts/r39-runtime-source-probe.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}

      - name: Switch release identity to R39 and qualify changes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @(
            'RELEASE_TAG=libmpv-r2k-v0.5.54-r39',
            'INSTALLER_NAME=LilacAnime-Libmpv-R39-Setup.exe',
            'MANIFEST_NAME=lilacanime-libmpv-r39-manifest.json',
            'APP_VERSION=0.5.54-libmpv-r3f.rc19'
          ) | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          $env:RELEASE_TAG='libmpv-r2k-v0.5.54-r39'
          $env:INSTALLER_NAME='LilacAnime-Libmpv-R39-Setup.exe'
          $env:MANIFEST_NAME='lilacanime-libmpv-r39-manifest.json'
          $env:APP_VERSION='0.5.54-libmpv-r3f.rc19'
          ./scripts/r39-qualified-build.ps1
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}

      - name: Upload qualified R39 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-Libmpv-R39-qualified
          path: |
            dist/LilacAnime-Libmpv-R39-Setup.exe
            dist/lilacanime-libmpv-r39-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish R39 release only after all gates pass
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $installer='dist/LilacAnime-Libmpv-R39-Setup.exe'
          $manifest='dist/lilacanime-libmpv-r39-manifest.json'
          if(-not(Test-Path $installer)-or -not(Test-Path $manifest)){throw 'R39 qualified assets missing'}
          $notes=Join-Path $env:RUNNER_TEMP 'r39-release-notes.md'
          @(
            '# LilacAnime Libmpv 0.5.54 r39 runtime recovery',
            '',
            'R39 is a targeted runtime recovery on top of the fully qualified R38/R37 stack.',
            '',
            '- Preserves the R33 unfocused native-only owned-popup path and the R37 explicit renderer handoff/native freeze that removed black focus flashes.',
            '- Preserves focused direct WebGPU (`copyExternalImageToTexture`) and does not restore the failed R25 Direct Composition disable or R28 staged WebGPU path.',
            '- Re-anchors the JavaScript source-frame phase only when returning from native-only presentation to focused direct WebGPU, and records active-playback gaps separately from pause/seek/buffering gaps.',
            '- Aligns the native unfocused WebVTT fallback with the focused DOM subtitle size, position, outline, weight, and visual baseline settings instead of R38 mismatched defaults.',
            '- Hardens the libmpv mini-player with Windows `pop-up-menu` always-on-top level, verifies the topmost state, re-pins after focus/z-order events, and exposes mini-player state in diagnostics.',
            '- Qualification repeats the complete R38/R37 baseline first, reruns the R37 raw shared-texture handoff E2E after the R39 changes, exercises four real native-only -> focused refocus cycles, and verifies PiP/topmost with two real Electron BrowserWindows plus the Win32 `WS_EX_TOPMOST` bit.',
            '- The R37 native producer, libmpv DLL, focused WebGPU preload/generated preload, R38 updater implementation, and desktop-state persistence implementation remain byte-identical.',
            '',
            'No uninstall, profile reset, settings reset, or watch-history reset is required. Install over the existing LilacAnime Libmpv installation.'
          ) | Set-Content -LiteralPath $notes -Encoding UTF8

          $tag='libmpv-r2k-v0.5.54-r39'
          $existing=$false
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if($LASTEXITCODE-eq 0){$existing=$true}
          if($existing){
            gh release upload $tag $installer $manifest --repo '${{ github.repository }}' --clobber
            if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
            gh release edit $tag --repo '${{ github.repository }}' --title 'LilacAnime Libmpv 0.5.54 r39 runtime recovery' --notes-file $notes
            if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          } else {
            gh release create $tag $installer $manifest --repo '${{ github.repository }}' --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r39 runtime recovery' --notes-file $notes
            if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          }
          Write-Host 'R39_RELEASE_UPLOAD_OK'

      - name: Re-download and verify public R39 bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'r39-public-reverify'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download libmpv-r2k-v0.5.54-r39 --repo '${{ github.repository }}' --pattern 'LilacAnime-Libmpv-R39-Setup.exe' --pattern 'lilacanime-libmpv-r39-manifest.json' --dir $dir
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          $installer=Join-Path $dir 'LilacAnime-Libmpv-R39-Setup.exe'
          $manifestPath=Join-Path $dir 'lilacanime-libmpv-r39-manifest.json'
          $manifest=Get-Content $manifestPath -Raw | ConvertFrom-Json
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $installer).Length
          if($manifest.installerSha256 -ne $hash){throw "public R39 SHA mismatch manifest=$($manifest.installerSha256) actual=$hash"}
          if([int64]$manifest.installerSize -ne $size){throw "public R39 size mismatch manifest=$($manifest.installerSize) actual=$size"}
          if($manifest.version -ne '0.5.54-libmpv-r3f.rc19' -or $manifest.tag -ne 'libmpv-r2k-v0.5.54-r39'){throw 'public R39 manifest identity mismatch'}
          Write-Host "R39_PUBLISHED_OK sha256=$hash size=$size electron=$($manifest.electron) refocus=4cycles pip=real-win32-topmost subtitle=native-DOM-parity blackFlash=R37-preserved"
