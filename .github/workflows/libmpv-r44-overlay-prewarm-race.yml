name: LilacAnime R44 overlay prewarm and race fix

on:
  workflow_dispatch:
  push:
    branches: [libmpv-r3f-054-r41-visual-handoff-stall-trace]
    paths:
      - .github/workflows/libmpv-r44-overlay-prewarm-race.yml
      - scripts/r44-*

concurrency:
  group: lilac-r44-overlay-prewarm-race
  cancel-in-progress: false

permissions:
  contents: write

env:
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K
  R41_RELEASE_TAG: libmpv-r2k-v0.5.54-r41
  R41_INSTALLER_NAME: LilacAnime-Libmpv-R41-Setup.exe
  R41_MANIFEST_NAME: lilacanime-libmpv-r41-manifest.json
  R41_APP_VERSION: 0.5.54-libmpv-r3f.rc21
  R41_BASE_INSTALLER_SHA256: 71a8aca205f7e91574236795cc87f02843d304282d98f9d02e9cadfea4d0e19e
  R41_BASE_INSTALLER_SIZE: 182603002
  R41_BASE_MANIFEST_SHA256: bf4034484314c8dd7fc256b2801ff8b5fb86d7feb423ace7a274830bbebd3ef0
  R41_BASE_MANIFEST_SIZE: 1537
  R43_RELEASE_TAG: libmpv-r2k-v0.5.54-r43
  R43_APP_VERSION: 0.5.54-libmpv-r3f.rc22
  R43_BASE_INSTALLER_SHA256: 7a56a8a4b372bbbf83e73b95e0ca43548e5c10029bf2d218c9f4b86e2aae4589
  R43_BASE_MANIFEST_SHA256: 5732a77967ec4961719deb75656d3e6340b6295f8b83ec42ce301328ebc82ed0
  R44_RELEASE_TAG: libmpv-r2k-v0.5.54-r44
  R44_APP_VERSION: 0.5.54-libmpv-r3f.rc23
  R44_INSTALLER_NAME: LilacAnime-Libmpv-R44-Setup.exe
  R44_MANIFEST_NAME: lilacanime-libmpv-r44-manifest.json

jobs:
  qualify-package-publish:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pinned runtime and packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund electron@44.9.3 @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Syntax-check R44 support before reconstruction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @(
            'scripts/r42-reconstruct-r41-release.cjs',
            'scripts/r43-subtitle-persistent-hwnd.cjs',
            'scripts/r44-overlay-prewarm-race-fix.cjs',
            'scripts/r44-overlay-zorder-finalize.cjs',
            'scripts/r44-first-active-zorder-guard.cjs',
            'scripts/r44-overlay-concurrent-ensure-smoke.cjs',
            'scripts/r44-package-postqualify.cjs'
          )){
            node --check $script
            if($LASTEXITCODE-ne 0){throw "syntax failed $script"}
          }

      - name: Reconstruct qualified R43 and qualify R44 runtime behavior
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r44-preflight.ps1

      - name: Package and independently postqualify R44 installer
        shell: powershell
        run: node scripts/r44-package-postqualify.cjs

      - name: Upload qualified R44 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r44-qualified-prerelease
          path: |
            dist/LilacAnime-Libmpv-R44-Setup.exe
            dist/lilacanime-libmpv-r44-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish and reverify R44 updater-visible prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $saved=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            gh release view $env:R44_RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            $existingExit=$LASTEXITCODE
          } finally { $ErrorActionPreference=$saved }
          if($existingExit-eq 0){throw 'R44 release already exists unexpectedly; refusing to replace qualified assets'}
          if($existingExit-ne 1){throw "R44 release existence probe failed exit=$existingExit"}

          gh release create $env:R44_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r44 prewarmed subtitle overlay' --notes 'R43 removed repeated unfocused subtitle cue-window shows, but the first subtitle after every focus-to-blur session still had one DWM soft reveal. R44 removes that remaining first-cue show path. On owner blur it prewarms an empty transparent subtitle HWND; concurrent prewarm/first-cue callers serialize on one load promise; first show and hard hide are opacity-zero transitions; the first active cue performs at most one opacity-zero z-order reanchor after native R33 popup activation and double-rAF before exposure; later cue gaps and cues neither re-show nor re-hide nor churn z-order. CI forces the concurrent-load race, then runs the real R33 native presenter with empty prewarm, first cue, four inactive/active cycles, compositor captures, native-video desktop probes, refocus hard-hide, and the protected R41 live-handoff regression gate. R41 focused direct WebGPU, libmpv bridge/preload bundle, native addon, libmpv DLL, R38 updater, and R40 overlay DOM renderer remain byte-identical. R44 also records a bounded overlay transition trace for any remaining focus/blur black flash. The submitted user diagnostic showed a clean 10-second 23.976fps supply cadence on a 144Hz display, so R44 deliberately does not alter playback speed, decoder delivery, or the video present pipeline while final display-phase judder remains under investigation.'
          if($LASTEXITCODE-ne 0){throw 'R44 prerelease create failed'}
          gh release upload $env:R44_RELEASE_TAG "dist/$env:R44_INSTALLER_NAME" "dist/$env:R44_MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE-ne 0){throw 'R44 prerelease upload failed'}

          $release=(gh release view $env:R44_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,targetCommitish|ConvertFrom-Json)
          if($release.tagName-ne$env:R44_RELEASE_TAG-or$release.isDraft-ne$false-or$release.isPrerelease-ne$true-or[string]$release.targetCommitish-ne$env:GITHUB_SHA){throw 'R44 release state mismatch'}
          $verify=Join-Path $env:RUNNER_TEMP 'r44-release-reverify'
          New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:R44_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:R44_INSTALLER_NAME --pattern $env:R44_MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R44 release asset redownload failed'}
          $exe=Join-Path $verify $env:R44_INSTALLER_NAME
          $manifestPath=Join-Path $verify $env:R44_MANIFEST_NAME
          $manifest=Get-Content $manifestPath -Raw|ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if($manifest.version-ne$env:R44_APP_VERSION-or$manifest.tag-ne$env:R44_RELEASE_TAG-or$manifest.releaseWorkflowSourceSha-ne$env:GITHUB_SHA-or$manifest.installerSha256-ne$hash-or[long]$manifest.installerSize-ne$size){throw 'R44 redownload identity/hash mismatch'}
          foreach($flag in @('r44PreflightQualified','r44ConcurrentEnsureQualified','r44PrewarmedFirstCueRuntimeQualified','r44R41LiveHandoffRequalified','r44ProtectedVideoPipelineBytesQualified')){if($manifest.$flag-ne$true){throw "R44 qualification flag missing $flag"}}
          if($manifest.baseInstallerSha256-ne$env:R43_BASE_INSTALLER_SHA256-or$manifest.baseManifestSha256-ne$env:R43_BASE_MANIFEST_SHA256){throw 'R44 pinned R43 identity evidence mismatch'}

          $rawTags=@(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')
          if($LASTEXITCODE-ne 0){throw 'R44 updater release collection query failed'}
          $tags=@($rawTags|ForEach-Object{([string]$_).Trim()}|Where-Object{$_})
          $customTagRe='^libmpv-r2k-v[0-9]+[.][0-9]+[.][0-9]+-r[0-9]+$'
          $custom=@($tags|Where-Object{$_-match$customTagRe})
          $r44=@($custom|Where-Object{$_-eq$env:R44_RELEASE_TAG})
          if($r44.Count-ne 1){throw "R44 updater exposure mismatch count=$($r44.Count) candidates=$($custom -join ',')"}
          if([string]$custom[0]-ne$env:R44_RELEASE_TAG){throw "R44 updater ordering mismatch selected=$($custom[0])"}
          Write-Host "R44_PRERELEASE_CREATED_AND_REVERIFIED_OK sha256=$hash size=$size selectedCustomTag=$($custom[0]) source=$env:GITHUB_SHA"
