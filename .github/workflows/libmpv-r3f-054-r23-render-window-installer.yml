name: LilacAnime Libmpv R23 render window installer

on:
  push:
    branches: [libmpv-r3f-054-r23-render-window]
    paths:
      - .github/workflows/libmpv-r3f-054-r23-render-window-installer.yml
      - scripts/r23-render-window-fix.cjs
      - scripts/r23-window-controller-smoke.cjs
      - scripts/r23-render-window-installer.ps1
      - build/stable-installer-r23.nsh
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r23-render-window-installer
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r22
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R22-Setup.exe
  BASE_INSTALLER_SHA256: 3cb0c6639369943ca97ebf794a233b551eecd0cceee37cded039de6acae1c218
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r23-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc3
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_FOLDER_NAME: LilacAnime-Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install helper packaging tools
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12
      - name: Build and qualify R23 renderer window installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r23-render-window-installer.ps1
      - name: Upload qualified R23
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r23-render-window-installer
          path: |
            dist/LilacAnime-Libmpv-R23-Setup.exe
            dist/lilacanime-libmpv-r23-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish and reverify public bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r23 render/window repair' --notes 'R23 preserves the R22 Electron 44.9.3/sharedTexture runtime fix and the qualified R3E native producer. It reduces only renderer-side hot-path diagnostic overhead (4 Hz receiver stats, no periodic WebGPU queue completion fence), restores a persistent drag strip for windowed playback and libmpv mini-player, reapplies mini-player always-on-top after window state transitions, and restores the assisted install-directory page with the stable LilacAnime-Libmpv folder preselected. Profile identity remains lilacanime-desktop.'
          if($LASTEXITCODE-ne 0){throw 'release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'release upload failed'}
          $v=Join-Path $env:RUNNER_TEMP 'r23-public';New-Item -ItemType Directory -Force -Path $v|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $v --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'public redownload failed'}
          $e=Join-Path $v $env:INSTALLER_NAME;$m=Get-Content (Join-Path $v $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $e).Length
          if($h-ne $env:R23_INSTALLER_SHA256 -or $z-ne [long]$env:R23_INSTALLER_SIZE){throw 'public installer byte mismatch'}
          if($m.installerSha256-ne $h -or $m.packagedRuntimeElectron-ne '44.9.3' -or $m.packagedSharedTextureImport-ne 'function' -or $m.packagedSharedTextureSend-ne 'function'){throw 'public runtime proof mismatch'}
          if($m.rendererMode-ne 'direct-receive-webgpu-copy' -or $m.receiverStatsIntervalMs-ne 250 -or $m.gpuCompletionFenceSampling-ne $false -or $m.installDirectoryPage-ne $true){throw 'public R23 feature manifest mismatch'}
          if($m.installerRuntimeProbe-ne 'exact-extracted-installer-payload-pass' -or $m.installerMigrationProbe-ne 'stable-path-shortcut-profile-pass'){throw 'public installer qualification mismatch'}
          Write-Host "R23_PUBLISHED_OK sha256=$h size=$z electron=$($m.packagedRuntimeElectron) sharedTexture=1 rendererHotpath=1 windowRepair=1 directoryPage=1"
