name: R39 runtime regression smoke preflight

on:
  push:
    branches: [libmpv-r3f-054-r39-refocus-pip-subtitle]
    paths:
      - .github/workflows/r39-long-blur-refocus-smoke-preflight.yml
      - scripts/r39-long-blur-refocus-runtime-smoke.cjs
      - scripts/r39-miniplayer-native-topmost-runtime-smoke.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate R39 runtime regression smokes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @(
            'scripts/r39-long-blur-refocus-runtime-smoke.cjs',
            'scripts/r39-miniplayer-native-topmost-runtime-smoke.cjs'
          )){
            node --check $script
            if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          }
          $refocus=Get-Content scripts/r39-long-blur-refocus-runtime-smoke.cjs -Raw
          foreach($marker in @(
            'R39_LONG_BLUR_REFOCUS_RUNTIME_OK',
            'blurMs=4000',
            'first focused frame too slow',
            'sustained focused cadence',
            'focused dispatch gap survived refocus',
            'LILAC_R39_REFOCUS_PHASE_REANCHOR'
          )){if(-not $refocus.Contains($marker)){throw "R39 refocus smoke marker missing: $marker"}}
          $topmost=Get-Content scripts/r39-miniplayer-native-topmost-runtime-smoke.cjs -Raw
          foreach($marker in @(
            'R39_MINIPLAYER_NATIVE_TOPMOST_RUNTIME_OK',
            'ownerTopmost===true',
            'windowTopmost===true',
            'ownerTopmost===false',
            'windowTopmost===false',
            'desktopCapturer'
          )){if(-not $topmost.Contains($marker)){throw "R39 topmost smoke marker missing: $marker"}}
          Write-Host 'R39_RUNTIME_REGRESSION_PREFLIGHT_OK refocusSyntax=1 cycles=3 blurMs=4000 firstFrameLimitMs=300 sustainedFrames=12 dispatchGapLimitMs=300 topmostSyntax=1 realBrowserWindow=1 realNativePopup=1 desktopCapture=1 bidirectional=1'
