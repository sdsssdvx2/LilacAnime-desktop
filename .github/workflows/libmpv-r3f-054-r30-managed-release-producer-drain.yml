name: LilacAnime Libmpv R30 managed release producer drain

on:
  push:
    branches: [libmpv-r3f-054-r30-managed-release-producer-drain]
    paths:
      - .github/workflows/libmpv-r3f-054-r30-managed-release-producer-drain.yml
      - scripts/r30-managed-release-producer-drain-build.ps1
      - scripts/r30-managed-release-producer-drain-fix.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r30-managed-release-producer-drain
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  RELEASE_TAG: libmpv-r2k-v0.5.54-r30
  INSTALLER_NAME: LilacAnime-Libmpv-R30-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r30-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc10
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12
      - name: Build and qualify R30 managed release producer drain
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r30-managed-release-producer-drain-build.ps1
      - name: Upload qualified R30 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r30-managed-release-producer-drain
          path: |
            dist/LilacAnime-Libmpv-R30-Setup.exe
            dist/lilacanime-libmpv-r30-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish and reverify public bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r30 managed release producer drain' --notes 'R30 fixes the R29 one-frame freeze by removing the invalid subtle.release use from the managed sendSharedTexture path. The renderer is byte-identical to R27 and again uses Electron managed SharedTextureImported.release(), whose lifetime is automatically protected by the managed sync-token flow. Failed R28 focus staging and all R29 renderer lifetime code are absent. R30 keeps only the independently verified producer-side repair: callback-authoritative 250ms JS watchdog plus newest-only collapse of already queued native frames after main-thread stalls. R27 focus/stall diagnostics, R24 mailbox/occlusion guards, direct WebGPU presentation, native addon/DLL bytes, window/PiP behavior, and profile identity are preserved.'
          if($LASTEXITCODE-ne 0){throw 'release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'release upload failed'}
          $v=Join-Path $env:RUNNER_TEMP 'r30-public';New-Item -ItemType Directory -Force -Path $v|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $v --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'public redownload failed'}
          $e=Join-Path $v $env:INSTALLER_NAME;$m=Get-Content (Join-Path $v $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $e).Length
          if($h-ne $env:R30_INSTALLER_SHA256 -or $z-ne [long]$env:R30_INSTALLER_SIZE){throw 'public installer byte mismatch'}
          if($m.installerSha256-ne $h -or $m.electron-ne '44.9.3' -or $m.sharedTextureImport-ne 'function' -or $m.sharedTextureSend-ne 'function'){throw 'public runtime proof mismatch'}
          if($m.deliveryMode-ne 'serial-latest-frame-mailbox' -or $m.inactiveCompositorGuard-ne $true -or $m.cadenceHotpath-ne 'record-only-snapshot-4hz'){throw 'public qualified baseline mismatch'}
          if($m.r26BoundaryTrace-ne 'ring256-on-demand-main-dispatch-renderer-entry-getVideoFrame-gpu-copy-present-release'){throw 'public R26 trace mismatch'}
          if($m.r27FocusStallRetention-ne 'anomaly64-threshold60-main+renderer-focus-visibility'){throw 'public R27 retention mismatch'}
          if($m.r30ManagedReleaseProducerDrain-ne 'r27-renderer-byte-identical+managed-sync-token-release+producer-watchdog250+latest-backlog-collapse'){throw 'public R30 producer drain mismatch'}
          Write-Host "R30_PUBLISHED_OK sha256=$h size=$z electron=$($m.electron) presenter=R27-direct-webgpu rendererRelease=managed-sync-token producerWatchdogMs=250 backlog=newest-only"
