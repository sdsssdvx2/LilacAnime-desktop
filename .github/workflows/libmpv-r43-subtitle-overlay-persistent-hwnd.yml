name: LilacAnime R43 persistent subtitle overlay HWND fix

on:
  workflow_dispatch:
  push:
    branches: [libmpv-r3f-054-r41-visual-handoff-stall-trace]
    paths:
      - .github/workflows/libmpv-r43-subtitle-overlay-persistent-hwnd.yml
      - scripts/r43-*

concurrency:
  group: lilac-r43-persistent-subtitle-overlay-hwnd
  cancel-in-progress: false

permissions:
  contents: write

env:
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K
  R41_RELEASE_TAG: libmpv-r2k-v0.5.54-r41
  R41_INSTALLER_NAME: LilacAnime-Libmpv-R41-Setup.exe
  R41_MANIFEST_NAME: lilacanime-libmpv-r41-manifest.json
  R41_APP_VERSION: 0.5.54-libmpv-r3f.rc21
  R41_BASE_INSTALLER_SHA256: 71a8aca205f7e91574236795cc87f02843d304282d98f9d02e9cadfea4d0e19e
  R41_BASE_INSTALLER_SIZE: 182603002
  R41_BASE_MANIFEST_SHA256: bf4034484314c8dd7fc256b2801ff8b5fb86d7feb423ace7a274830bbebd3ef0
  R41_BASE_MANIFEST_SIZE: 1537
  R43_RELEASE_TAG: libmpv-r2k-v0.5.54-r43
  R43_INSTALLER_NAME: LilacAnime-Libmpv-R43-Setup.exe
  R43_MANIFEST_NAME: lilacanime-libmpv-r43-manifest.json
  R43_APP_VERSION: 0.5.54-libmpv-r3f.rc22
  R43_FIRST_QUALIFIED_SHA: 754b0e023d182685cc3c90a695c4d69adb3f1930

jobs:
  qualify-package-publish:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pinned runtime, qualification and packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund electron@44.9.3 @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Syntax-check R43 support before shipped-R41 reconstruction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/r42-reconstruct-r41-release.cjs
          if($LASTEXITCODE-ne 0){throw 'R43 R41-release reconstruction syntax failed'}
          node --check scripts/r43-subtitle-persistent-hwnd.cjs
          if($LASTEXITCODE-ne 0){throw 'R43 transform syntax failed'}
          node --check scripts/r43-package-postqualify.cjs
          if($LASTEXITCODE-ne 0){throw 'R43 package verifier syntax failed'}

      - name: Reconstruct pinned shipped R41 and qualify persistent subtitle HWND fix
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r43-preflight.ps1

      - name: Package and independently postqualify R43 installer
        shell: powershell
        run: node scripts/r43-package-postqualify.cjs

      - name: Upload qualified R43 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r43-qualified-prerelease
          path: |
            dist/LilacAnime-Libmpv-R43-Setup.exe
            dist/lilacanime-libmpv-r43-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish or reverify R43 updater-visible prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $releaseAlreadyExists=$false
          $expectedSourceSha=$env:GITHUB_SHA
          $saved=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            $existingRaw=gh release view $env:R43_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,targetCommitish 2>$null
            $existingExit=$LASTEXITCODE
          }
          finally { $ErrorActionPreference=$saved }

          if($existingExit-eq 0){
            $existing=$existingRaw|ConvertFrom-Json
            if($existing.tagName-ne$env:R43_RELEASE_TAG-or$existing.isDraft-ne$false-or$existing.isPrerelease-ne$true){throw 'Existing R43 release state mismatch'}
            $target=[string]$existing.targetCommitish
            if($target-ne$env:R43_FIRST_QUALIFIED_SHA-and$target-ne$env:GITHUB_SHA){throw "Existing R43 target is not an accepted qualified source: $target"}
            $expectedSourceSha=$target
            $releaseAlreadyExists=$true
            Write-Host "R43_EXISTING_QUALIFIED_RELEASE_REUSE target=$target"
          }
          elseif($existingExit-eq 1){
            gh release create $env:R43_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r43 persistent subtitle overlay HWND' --notes 'R42 real-user diagnostics isolated the unfocused subtitle soft-reveal: source and overlay DOM were fully opaque from the first committed frame (opacity 1, transition 0s, animation none), while every subtitle cue gap physically hid the transparent owned overlay BrowserWindow and every next cue called showInactive again. R43 fixes only that diagnosed lifecycle. During a genuine unfocused playback session, cue gaps now clear the subtitle DOM while keeping the transparent owned overlay HWND alive; the next cue reuses that HWND without another showInactive. Refocus, hide, minimize, destroy and lifecycle suppression still hard-hide it. CI exercises four inactive-to-active cue gaps with a rival focused, proves the HWND remains visible while subtitle pixels clear, proves show/hide counters do not change, proves pixels return without a re-show, and then proves real refocus hard-hides the HWND. The shipped R41 focused direct-WebGPU preload/bundle, R41 main/bridge handoff path, R33 native presenter, R38 updater, R39 behavior, R40 overlay DOM preload, native addon and libmpv DLL are protected byte-for-byte. R25 disable-direct-composition and R28 staged/private WebGPU remain forbidden.'
            if($LASTEXITCODE-ne 0){throw 'R43 prerelease create failed'}
            gh release upload $env:R43_RELEASE_TAG "dist/$env:R43_INSTALLER_NAME" "dist/$env:R43_MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY
            if($LASTEXITCODE-ne 0){throw 'R43 prerelease upload failed'}
          }
          else { throw "R43 release existence probe failed exit=$existingExit" }

          $release=(gh release view $env:R43_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,targetCommitish | ConvertFrom-Json)
          if($release.tagName-ne$env:R43_RELEASE_TAG-or$release.isDraft-ne$false-or$release.isPrerelease-ne$true-or[string]$release.targetCommitish-ne$expectedSourceSha){throw 'R43 prerelease state mismatch'}

          $verify=Join-Path $env:RUNNER_TEMP 'r43-release-reverify'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:R43_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:R43_INSTALLER_NAME --pattern $env:R43_MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R43 release asset redownload failed'}
          $exe=Join-Path $verify $env:R43_INSTALLER_NAME
          $manifestPath=Join-Path $verify $env:R43_MANIFEST_NAME
          $manifest=Get-Content $manifestPath -Raw|ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if($manifest.version-ne$env:R43_APP_VERSION-or$manifest.tag-ne$env:R43_RELEASE_TAG-or$manifest.releaseWorkflowSourceSha-ne$expectedSourceSha-or$manifest.installerSha256-ne$hash-or[long]$manifest.installerSize-ne$size){throw 'R43 redownload identity/hash mismatch'}
          foreach($flag in @('r43PreflightQualified','r43PersistentSubtitleHwndRuntimeQualified','r43R41LiveHandoffRequalified','r43ProtectedR41BytesQualified')){
            if($manifest.$flag-ne$true){throw "R43 qualification flag missing $flag"}
          }
          if($manifest.baseInstallerSha256-ne$env:R41_BASE_INSTALLER_SHA256-or$manifest.baseManifestSha256-ne$env:R41_BASE_MANIFEST_SHA256){throw 'R43 pinned R41 baseline evidence drifted'}

          # GitHub can briefly serve the just-created release through /tags while the
          # collection endpoint still has an older snapshot. Poll that exact endpoint
          # because it is what the R38 custom updater consumes.
          $customTagRe='^libmpv-r2k-v\d+\.\d+\.\d+-r\d+$'
          $r43=@()
          $customCandidates=@()
          for($attempt=1;$attempt-le 12;$attempt+=1){
            $channel=@((gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100")|ConvertFrom-Json)
            $customCandidates=@($channel|Where-Object{($_.draft-ne$true)-and([string]$_.tag_name-match$customTagRe)})
            $r43=@($customCandidates|Where-Object{[string]$_.tag_name-eq$env:R43_RELEASE_TAG})
            if($r43.Count-eq 1){break}
            Write-Host "R43 updater collection propagation pending attempt=$attempt count=$($r43.Count)"
            Start-Sleep -Seconds 3
          }
          if($r43.Count-ne 1){throw "R43 updater exposure mismatch after polling count=$($r43.Count)"}
          $selected=if($customCandidates.Count){[string]$customCandidates[0].tag_name}else{'none'}
          if($selected-ne$env:R43_RELEASE_TAG){throw "R43 is exposed but not selected by updater ordering selected=$selected"}
          Write-Host "R43_PRERELEASE_CREATED_AND_REVERIFIED_OK sha256=$hash size=$size draft=0 prerelease=1 customUpdaterExposure=1 selectedCustomTag=$selected reusedExisting=$([int]$releaseAlreadyExists) source=$expectedSourceSha"
