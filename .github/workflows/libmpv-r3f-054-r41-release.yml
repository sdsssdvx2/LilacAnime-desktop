name: LilacAnime Libmpv R41 qualified prerelease

on:
  workflow_dispatch:
  push:
    branches: [libmpv-r3f-054-r41-visual-handoff-stall-trace]
    paths:
      - .github/r41-release-trigger

concurrency:
  group: lilac-libmpv-r41-qualified-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r39
  INSTALLER_NAME: LilacAnime-Libmpv-R39-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r39-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc19
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K
  R40_RELEASE_TAG: libmpv-r2k-v0.5.54-r40
  R40_INSTALLER_NAME: LilacAnime-Libmpv-R40-Setup.exe
  R40_MANIFEST_NAME: lilacanime-libmpv-r40-manifest.json
  R40_APP_VERSION: 0.5.54-libmpv-r3f.rc20
  R41_RELEASE_TAG: libmpv-r2k-v0.5.54-r41
  R41_INSTALLER_NAME: LilacAnime-Libmpv-R41-Setup.exe
  R41_MANIFEST_NAME: lilacanime-libmpv-r41-manifest.json
  R41_APP_VERSION: 0.5.54-libmpv-r3f.rc21

jobs:
  qualify-package-publish:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install qualification and packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Preserve R41 package verifier and run exact preflight
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/r41-package-postqualify.cjs
          if ($LASTEXITCODE -ne 0) { throw 'R41 package verifier syntax failed' }
          $backup=Join-Path $env:RUNNER_TEMP 'r41-package-postqualify.cjs'
          Copy-Item 'scripts/r41-package-postqualify.cjs' $backup -Force
          try { ./scripts/r41-preflight.ps1 }
          finally {
            New-Item -ItemType Directory -Force -Path scripts | Out-Null
            Copy-Item $backup 'scripts/r41-package-postqualify.cjs' -Force
          }
          if ($LASTEXITCODE -ne 0) { throw 'R41 preflight failed' }

      - name: Package and independently postqualify R41
        shell: powershell
        run: node scripts/r41-package-postqualify.cjs

      - name: Upload qualified R41 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r41-qualified-prerelease
          path: |
            dist/LilacAnime-Libmpv-R41-Setup.exe
            dist/lilacanime-libmpv-r41-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish R41 prerelease and verify updater exposure
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          # User testing historically uses the updater itself. R41 is therefore a
          # public prerelease, not a draft. R2K intentionally accepts prereleases.
          $saved=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            $existingRaw=gh release view $env:R41_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,targetCommitish 2>$null
            $existingExit=$LASTEXITCODE
          }
          finally { $ErrorActionPreference=$saved }
          if ($existingExit -eq 0) {
            $existing=$existingRaw | ConvertFrom-Json
            throw "Refusing to replace existing R41 release: draft=$($existing.isDraft) prerelease=$($existing.isPrerelease) target=$($existing.targetCommitish)"
          }
          elseif ($existingExit -ne 1) { throw "R41 release existence probe failed exit=$existingExit" }

          gh release create $env:R41_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r41 visual handoff continuity' --notes 'R41 is a qualified updater-visible prerelease for direct user acceptance. R40 real-user evidence showed genuine black output frames after refocus plus 648-776 ms focused supply gaps even though the first WebGPU frame and R37 ACK arrived quickly. R41 preserves focused direct WebGPU, R33 native-only owned popup, R38 updater, R39 PiP/topmost and R40 single-DOM subtitle overlay. During focus handoff only, the native popup now keeps presenting current video while frames are mirrored to Chromium; moving playback must show at least 250 ms of stable direct-WebGPU delivery with no >100 ms supply gap, then cross two animation-frame compositor boundaries before the native popup may hide. Paused playback keeps the R40 one-shot redraw and requires one copied frame plus the same visual paint fence. R25 disable-direct-composition and R28 staged/private WebGPU remain forbidden.'
          if ($LASTEXITCODE -ne 0) { throw 'R41 prerelease create failed' }
          gh release upload $env:R41_RELEASE_TAG "dist/$env:R41_INSTALLER_NAME" "dist/$env:R41_MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'R41 prerelease upload failed' }

          $release=(gh release view $env:R41_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,isDraft,targetCommitish | ConvertFrom-Json)
          if ($release.tagName -ne $env:R41_RELEASE_TAG -or $release.isDraft -ne $false -or $release.isPrerelease -ne $true -or $release.targetCommitish -ne $env:GITHUB_SHA) { throw 'R41 prerelease state mismatch' }

          $verify=Join-Path $env:RUNNER_TEMP 'r41-release-reverify'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download $env:R41_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:R41_INSTALLER_NAME --pattern $env:R41_MANIFEST_NAME
          if ($LASTEXITCODE -ne 0) { throw 'R41 release asset redownload failed' }
          $exe=Join-Path $verify $env:R41_INSTALLER_NAME
          $manifestPath=Join-Path $verify $env:R41_MANIFEST_NAME
          $manifest=Get-Content $manifestPath -Raw | ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if ($manifest.version -ne $env:R41_APP_VERSION -or $manifest.tag -ne $env:R41_RELEASE_TAG -or $manifest.releaseWorkflowSourceSha -ne $env:GITHUB_SHA -or $manifest.installerSha256 -ne $hash -or [long]$manifest.installerSize -ne $size) { throw 'R41 redownload identity/hash mismatch' }
          foreach ($flag in @('r41PreflightQualified','r41LiveNativeHandoffRuntimeQualified','r41R37ProtectedE2EQualified','r41R40CallbackPacingRequalified','r41R40SubtitleOverlayRequalified','r41R39TopmostRequalified')) {
            if ($manifest.$flag -ne $true) { throw "R41 qualification flag missing $flag" }
          }

          # Reproduce the exact custom updater rule: drafts excluded, prereleases
          # accepted, custom R2K tag regex. R41 must now be visible and selected.
          $channel=@((gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100") | ConvertFrom-Json)
          $customTagRe='^libmpv-r2k-v\d+\.\d+\.\d+-r\d+$'
          $customCandidates=@($channel | Where-Object { ($_.draft -ne $true) -and ([string]$_.tag_name -match $customTagRe) })
          $r41=@($customCandidates | Where-Object { [string]$_.tag_name -eq $env:R41_RELEASE_TAG })
          if ($r41.Count -ne 1) { throw "R41 updater exposure mismatch count=$($r41.Count)" }
          $selected=if ($customCandidates.Count) { [string]$customCandidates[0].tag_name } else { 'none' }
          if ($selected -ne $env:R41_RELEASE_TAG) { throw "R41 is exposed but not selected by updater selected=$selected" }
          Write-Host "R41_PRERELEASE_CREATED_AND_REVERIFIED_OK sha256=$hash size=$size draft=0 prerelease=1 customUpdaterExposure=1 selectedCustomTag=$selected"
