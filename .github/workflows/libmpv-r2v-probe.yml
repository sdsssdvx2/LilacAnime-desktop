name: Libmpv R2V calibrated subtitle and miniplayer probe

on:
  push:
    branches: [libmpv-r2v-calibrated-subtitle-miniplayer]
    paths:
      - scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs
      - scripts/rebundle-libmpv-r2v.cjs
      - scripts/smoke-libmpv-r2v-*.cjs
      - .github/workflows/libmpv-r2v-probe.yml
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2v-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Overlay exact upstream Lilac 0.5.50
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.50'
          git clone --depth 1 --branch v0.5.50 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          $sha=(git -C $up rev-parse HEAD).Trim()
          if($sha -ne '5fa931e4dbede97dc7d586864417b62bde5d7ea0'){throw "upstream tag moved: $sha"}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
      - name: Apply exact transform chain through R2V
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs')
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2v.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V rebundle failed'}
          npm install --no-audit --no-fund
          $version=node -p "require('./package.json').version"
          $tag=node -p "require('./package.json').lilacCustomTag"
          $electron=node -p "require('electron/package.json').version"
          if($version -ne '0.5.50-libmpv-r2v.rc1' -or $tag -ne 'libmpv-r2k-v0.5.50-r5' -or $electron -ne '44.9.3'){throw "R2V identity mismatch version=$version tag=$tag electron=$electron"}
          Write-Host 'R2V_TRANSFORMS_OK'
      - name: Reproduce user runtime and verify subtitle controls
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & npx.cmd electron scripts/smoke-libmpv-r2v-subtitle-controls.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V subtitle controls failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2v-subtitle-visual.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V subtitle visual failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2v-miniplayer-fallback.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V missing-bridge fallback failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2t-miniplayer-interaction.cjs
          if($LASTEXITCODE -ne 0){throw 'retained direct miniplayer interaction failed'}
          node scripts/smoke-libmpv-r2t-miniplayer-window.cjs
          if($LASTEXITCODE -ne 0){throw 'miniplayer window lifecycle failed'}
          node scripts/smoke-libmpv-r2s-key-policy.cjs
          if($LASTEXITCODE -ne 0){throw 'key policy failed'}
          node scripts/smoke-libmpv-r2m-key-ui.cjs
          if($LASTEXITCODE -ne 0){throw 'keyboard UI failed'}
          node scripts/smoke-libmpv-r2p-pipeline-untouched.cjs
          if($LASTEXITCODE -ne 0){throw 'playback pipeline changed'}
          node scripts/smoke-libmpv-r2v-updater.cjs
          if($LASTEXITCODE -ne 0){throw 'R2V updater smoke failed'}
          Write-Host 'R2V_PROBE_PASS'
