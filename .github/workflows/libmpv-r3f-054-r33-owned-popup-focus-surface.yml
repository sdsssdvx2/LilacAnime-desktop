name: LilacAnime Libmpv R33 owned popup native-only focus surface

on:
  push:
    branches: [libmpv-r3f-054-r33-owned-popup-focus-surface]
    paths:
      - .github/workflows/libmpv-r3f-054-r33-owned-popup-focus-surface.yml
      - scripts/r33-owned-popup-focus-build.ps1
      - scripts/r33-owned-popup-focus-fix.cjs
      - scripts/r33-stall-attribution-probe.cjs
      - scripts/r33-owned-popup-visible-focus-smoke.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r33-owned-popup-focus-surface
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r33
  INSTALLER_NAME: LilacAnime-Libmpv-R33-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r33-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc13
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12
      - name: Build and qualify R33 owned popup / native-only focus
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/r32-transform-source-sanitize.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/r33-owned-popup-focus-build.ps1
      - name: Upload qualified R33 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r33-owned-popup-focus
          path: |
            dist/LilacAnime-Libmpv-R33-Setup.exe
            dist/lilacanime-libmpv-r33-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish and reverify public R33 bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r33 owned popup native-only focus surface' --notes 'R33 is based on the user hardware evidence from R32 rather than another speculative renderer fallback. During the actual playback-time blur intervals R32 returned 516 successful native Present calls with zero presenter failures—essentially the exact expected 23.976 fps frame count—while the user still saw black flashing. That proves Present success was not equivalent to DWM visibility. R33 removes the WS_CHILD/Chromium child-surface competition: the same libmpv D3D11 texture is copied to a non-activating owned WS_POPUP while Lilac is unfocused, with no black class brush and no WS_EX_TRANSPARENT paint ordering. The popup follows the physical video rectangle through ClientToScreen and owner move/resize/fullscreen events. More importantly, while the native popup owns unfocused presentation, the producer returns its slot immediately after CopyResource+Present and does not enqueue a JS callback/import/send/WebGPU copy for that same frame. Focused playback remains the qualified direct WebGPU path. Qualification now uses two visible Electron BrowserWindows, real focus loss, desktop/DWM pixel capture over multiple frames, a 900ms synchronous main-JS stall during which native presentation must continue, owner movement tracking, and focus recovery. Low-rate attribution also records independent main-event-loop gaps and native render stalls so a future anomaly cannot again be misclassified. Existing R32 Flix worker isolation, R30/R31 repairs, R27 diagnostics, profile identity and the pinned libmpv DLL remain preserved.'
          if($LASTEXITCODE-ne 0){throw 'R33 release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'R33 release upload failed'}
          $v=Join-Path $env:RUNNER_TEMP 'r33-public';New-Item -ItemType Directory -Force -Path $v|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $v --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R33 public redownload failed'}
          $e=Join-Path $v $env:INSTALLER_NAME;$m=Get-Content (Join-Path $v $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $e).Length
          if($h-ne $env:R33_INSTALLER_SHA256 -or $z-ne [long]$env:R33_INSTALLER_SIZE){throw 'R33 public installer byte mismatch'}
          if($m.installerSha256-ne $h -or $m.electron-ne '44.9.3' -or $m.nativeDll-ne $env:QUALIFIED_DLL_SHA256){throw 'R33 public runtime identity mismatch'}
          if($m.r33FocusPresenter-ne 'same-libmpv-d3d11-texture+owned-ws-popup-unfocused'){throw 'R33 public owned popup proof mismatch'}
          if($m.r33NativeOnlyUnfocused-ne 'producer-copyresource-present+slot-release+no-tsfn-no-import-no-send-no-webgpu'){throw 'R33 public native-only proof mismatch'}
          if($m.r33VisibleFocusSmoke-ne 'two-visible-browserwindows+dwm-pixel-capture+900ms-main-stall+owner-move+focus-recovery'){throw 'R33 public visible smoke proof mismatch'}
          if($m.r33StallAttribution-ne 'main-heartbeat50ms-threshold80+native-render-threshold60'){throw 'R33 public stall attribution proof mismatch'}
          if($m.r33ChromiumDuplicateDelivery-ne $false -or $m.r33OwnedPopupBlackErase-ne $false){throw 'R33 public compositor isolation proof mismatch'}
          if($m.r32FlixIsolation-ne 'worker-thread-loopback-server+no-segment-main-ipc' -or $m.r32NativeProducerWatchdog-ne 'callback-authoritative+250ms-native-watchdog'){throw 'R33 lost R32 worker/watchdog baseline'}
          Write-Host "R33_PUBLISHED_OK sha256=$h size=$z electron=$($m.electron) addon=$($m.nativeAddon) libmpvDll=$($m.nativeDll) focused=direct-webgpu unfocused=owned-popup-native-only visibleDwmSmoke=passed stallAttribution=main+native"
