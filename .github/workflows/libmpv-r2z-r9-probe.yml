name: Libmpv R2Z r9 probe

on:
  push:
    branches: [libmpv-r2z-direct-present-ui-fixed]
    paths:
      - '.github/workflows/libmpv-r2z-r9-probe.yml'
      - 'scripts/apply-libmpv-r2z-direct-present-ui-fixed.cjs'
      - 'scripts/smoke-libmpv-r2z-*.cjs'
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2z-r9-probe
  cancel-in-progress: true

permissions:
  contents: read

env:
  R2Z_SOURCE_SHA: db408eb9b2d9c0129b39bb6a307e48fd61863168
  R2Y_SOURCE_SHA: ccdabdd876737dd52ee2a301fc39ea68fd7e423f
  R2W_HEAD: 7aeb89c41c6779edc1c564c401651bf02404641a
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_SOURCE_COMMIT: 78e643838b168ac961dd9631d1225b5ac8fc8ec6
  QUALIFICATION_RELEASE_TAG: libmpv-hwq-r2i-pipeline-78e643838b16
  QUALIFICATION_EXE_SHA256: 6d06dcf1543c7ec69488ce0718d846a2e525e04ee56ad17dbc686fef54ebb395
  QUALIFICATION_MANIFEST_SHA256: c18543c10de436dd66544aed5fca6879fca258f1bd875a91b4d7bf17ea738b8e
  QUALIFIED_ADDON_SHA256: ee1790a87dd75a9d058ff5fc10a9e96ed2ab6863f03c3973a2c88d8eef72fe2b
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin R2Z source and exact upstream
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:R2Z_SOURCE_SHA
          if((git rev-parse HEAD).Trim() -ne $env:R2Z_SOURCE_SHA){throw 'R2Z source pin mismatch'}
          git merge-base --is-ancestor $env:R2Y_SOURCE_SHA $env:R2Z_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'R2Z lost R2Y ancestry'}
          git diff --quiet $env:R2Y_SOURCE_SHA $env:R2Z_SOURCE_SHA -- native
          if($LASTEXITCODE -ne 0){throw 'R2Z changed native sources'}
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.50'
          git clone --depth 1 --branch v0.5.50 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          if((git -C $up rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA){throw 'upstream v0.5.50 SHA mismatch'}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          Write-Host "R2Z_SOURCE_OK source=$env:R2Z_SOURCE_SHA upstream=$env:UPSTREAM_SHA nativeDiff=0"

      - name: Reproduce transform chain through R2Z
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          if($LASTEXITCODE -ne 0){throw 'package seed failed'}
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs','scripts/apply-libmpv-r2w-aspect-cadence.cjs','scripts/apply-libmpv-r2x-vsync-fullscreen.cjs','scripts/apply-libmpv-r2x-pipeline-diagnostics.cjs','scripts/rebundle-libmpv-r2x-preload.cjs','scripts/apply-libmpv-r2y-cadence-fix.cjs','scripts/apply-libmpv-r2y-timestamp-phase.cjs','scripts/apply-libmpv-r2z-direct-present-ui-fixed.cjs'
          )
          foreach($s in $scripts){
            node --check $s
            if($LASTEXITCODE -ne 0){throw "syntax failed: $s"}
            node $s
            if($LASTEXITCODE -ne 0){throw "transform failed: $s"}
          }
          node scripts/rebundle-libmpv-r2v.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer rebundle failed'}
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          $version=node -p "require('./package.json').version"
          $tag=node -p "require('./package.json').lilacCustomTag"
          $electron=node -p "require('electron/package.json').version"
          if($version -ne '0.5.50-libmpv-r2z.rc1' -or $tag -ne 'libmpv-r2k-v0.5.50-r9' -or $electron -ne $env:ELECTRON_VERSION){throw "R2Z identity mismatch version=$version tag=$tag electron=$electron"}
          Write-Host 'R2Z_TRANSFORM_OK'

      - name: Gate direct presenter, adaptive pump and stable UI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/smoke-libmpv-r2z-direct-present.cjs
          if($LASTEXITCODE -ne 0){throw 'R2Z direct presentation invariant failed'}
          node scripts/smoke-libmpv-r2y-pump-sim.cjs
          if($LASTEXITCODE -ne 0){throw 'R2Y phase-aware pump regression failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2z-ui-position-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'R2Z UI position runtime failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2z-webgpu-direct-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'R2Z direct WebGPU runtime failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2w-window-aspect-runtime.cjs
          if($LASTEXITCODE -ne 0){throw 'BrowserWindow aspect runtime failed'}
          Write-Host 'R2Z_PRESENT_UI_RUNTIME_OK'

      - name: Bind exact real-hardware-qualified native payload
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $q=Join-Path $env:RUNNER_TEMP 'qualified-r2i';New-Item -ItemType Directory -Force -Path $q|Out-Null
          gh release download $env:QUALIFICATION_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $q --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe' --pattern 'qualification-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'qualification download failed'}
          $exe=Join-Path $q 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe';$manifest=Join-Path $q 'qualification-manifest.json'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_EXE_SHA256){throw 'qualification EXE hash mismatch'}
          if((Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_MANIFEST_SHA256){throw 'qualification manifest hash mismatch'}
          $m=Get-Content $manifest -Raw|ConvertFrom-Json
          if($m.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT -or $m.electronVersion -ne $env:ELECTRON_VERSION){throw 'qualification provenance mismatch'}
          $raw=Join-Path $env:RUNNER_TEMP 'q-extract';$nested=Join-Path $env:RUNNER_TEMP 'q-nested';New-Item -ItemType Directory -Force -Path $raw,$nested|Out-Null
          7z.exe x $exe "-o$raw" -y|Out-Null
          function FindPayload([string]$name){Get-ChildItem $raw,$nested -Recurse -File -Filter $name -ErrorAction SilentlyContinue|Select-Object -First 1}
          $addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll'
          if(-not $addon -or -not $dll){
            $i=0
            foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){
              $i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null;7z.exe x $a.FullName "-o$out" -y|Out-Null
              $addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll';if($addon -and $dll){break}
            }
          }
          if(-not $addon -or -not $dll){throw 'qualified native payload missing'}
          $ah=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$dh=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ah -ne $env:QUALIFIED_ADDON_SHA256 -or $dh -ne $env:QUALIFIED_DLL_SHA256){throw "qualified payload mismatch addon=$ah dll=$dh"}
          Copy-Item $addon.FullName electron/lilac-libmpv-player-bridge.node -Force
          Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          Write-Host "R2Z_NATIVE_IDENTITY_OK addon=$ah dll=$dh"

      - name: Run native and retained regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LILAC_LIBMPV_PLAYER_ADDON=(Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path
          $env:LILAC_LIBMPV_DLL=(Resolve-Path 'electron/libmpv-2.dll').Path
          $env:ELECTRON_RUN_AS_NODE='1'
          foreach($s in @('scripts/smoke-libmpv-native-retention-fhd.cjs','scripts/smoke-libmpv-native-command-roundtrip.cjs','scripts/smoke-libmpv-r2-pump-sim.cjs','scripts/smoke-libmpv-relay-av.cjs')){
            & npx.cmd electron $s
            if($LASTEXITCODE -ne 0){throw "native regression failed: $s"}
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer input stress failed'}
          foreach($s in @('scripts/smoke-libmpv-r2v-subtitle-controls.cjs','scripts/smoke-libmpv-r2v-subtitle-visual.cjs','scripts/smoke-libmpv-r2v-miniplayer-fallback.cjs','scripts/smoke-libmpv-r2t-miniplayer-interaction.cjs')){
            & npx.cmd electron $s
            if($LASTEXITCODE -ne 0){throw "retained Electron probe failed: $s"}
          }
          foreach($s in @('scripts/smoke-libmpv-r2t-miniplayer-window.cjs','scripts/smoke-libmpv-r2m-key-ui.cjs','scripts/smoke-libmpv-r2m-open-race.cjs','scripts/smoke-flix-proxy-fixture.cjs')){
            node $s
            if($LASTEXITCODE -ne 0){throw "retained node probe failed: $s"}
          }
          Write-Host 'R2Z_RETAINED_REGRESSION_OK'

      - name: Run all 278 upstream tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tests/window-buttons.test.cjs';$original=Get-Content $p -Raw
          node -e "const fs=require('fs');const p=process.argv[1],s=fs.readFileSync(p,'utf8'),n='const context=vm.createContext({process:{platform},windowButtons,BrowserWindow:{fromWebContents:()=>win},ipcMain:{handle:(name,handler)=>handlers.set(name,handler)}});';if(!s.includes(n))throw Error('VM anchor missing');fs.writeFileSync(p,s.replace(n,'const context=vm.createContext({process:{platform},windowButtons,setVideoAspectLocked:()=>{},BrowserWindow:{fromWebContents:()=>win},ipcMain:{handle:(name,handler)=>handlers.set(name,handler)}});'))" $p
          if($LASTEXITCODE -ne 0){throw 'window-buttons VM adapter failed'}
          $tests=@(Get-ChildItem tests -File -Filter '*.test.cjs'|Sort-Object Name|ForEach-Object{$_.FullName})
          & node --test @tests
          $exit=$LASTEXITCODE
          Set-Content $p -Value $original -NoNewline
          if($exit -ne 0){throw 'upstream 0.5.50 regression suite failed'}
          Write-Host 'R2Z_UPSTREAM_REGRESSION_OK tests=278'

      - name: Final architecture gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $preload=Get-Content electron/preload-libmpv-shared.generated.cjs -Raw;$bridge=Get-Content electron/libmpv-shared-main.cjs -Raw;$css=Get-Content src/player-android.css -Raw;$pkg=Get-Content package.json -Raw|ConvertFrom-Json
          foreach($m in @('direct-receive-webgpu-copy','copyExternalImageToTexture','receiveCadenceTracker')){if(-not $preload.Contains($m)){throw "preload marker missing $m"}}
          foreach($m in @('stagingTexture','copyTextureToTexture','ensureGpuPresentLoop','requestAnimationFrame(')){if($preload.Contains($m)){throw "forbidden presentation marker survived $m"}}
          foreach($m in @('ACTIVE_PUMP_RETRY_MS = 2','pumpExpectedFps','refreshPumpTimingState')){if(-not $bridge.Contains($m)){throw "pump marker missing $m"}}
          if(-not $css.Contains('.immersive-player .player-top { padding-right: 28px; }') -or -not $css.Contains('.immersive-player .player-settings { right: 16px; }')){throw 'stable UI rules missing'}
          if($css.Contains('.immersive-player.windowed .player-top') -or $css.Contains('.immersive-player.windowed .player-settings')){throw 'fullscreen-dependent UI rules survived'}
          if($pkg.version -ne '0.5.50-libmpv-r2z.rc1' -or $pkg.lilacCustomTag -ne 'libmpv-r2k-v0.5.50-r9'){throw 'R2Z final identity mismatch'}
          $ah=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant();$dh=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ah -ne $env:QUALIFIED_ADDON_SHA256 -or $dh -ne $env:QUALIFIED_DLL_SHA256){throw 'native identity changed'}
          Write-Host 'R2Z_PROBE_QUALIFIED directPresent=1 rafGate=0 uiToggleInvariant=1 nativeDiff=0 upstreamTests=278'
