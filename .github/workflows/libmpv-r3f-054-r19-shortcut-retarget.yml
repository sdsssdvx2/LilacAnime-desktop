name: LilacAnime Libmpv stable installer r19

on:
  push:
    branches: [libmpv-r3f-054-stable-installer-r16]
    paths:
      - .github/workflows/libmpv-r3f-054-r19-shortcut-retarget.yml
      - scripts/r19-stable-installer.ps1
      - build/stable-installer-r19.nsh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lilac-libmpv-r19-stable-installer
  cancel-in-progress: true

env:
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r18
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R18-Setup.exe
  BASE_INSTALLER_SHA256: 9afa46e9e91b8479a876550cb46f9eceb5847d3426ea831f389e61358846be25
  BASE_APP_EXE_SHA256: 634417d59946c31895d25c3ae6f4e12e586d7b3eefbc2a37776db6587e1ade40
  BASE_APP_ASAR_SHA256: 23f6e6b0c1f6705d82b24e8b8cc55d2bbd063ab16d78ada75a8c06b96bb41560
  BASE_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  BASE_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  R2J_RELEASE_TAG: libmpv-r2j-subtitle-fix-b12a77cc5910
  R2J_INSTALLER_NAME: LilacAnime-Libmpv-R2J-SubtitleFix-Setup.exe
  R2J_INSTALLER_SHA256: 32a422e10699db63d13c7105bd93e55f63234af529b787104b1e89442ad55ab6
  RELEASE_TAG: libmpv-r2k-v0.5.54-r19
  INSTALLER_NAME: LilacAnime-Libmpv-R19-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r19-manifest.json
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_FOLDER_NAME: LilacAnime-Libmpv
  APP_VERSION: 0.5.54-libmpv-r3f.rc1

jobs:
  stable-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install packaging tools
        shell: powershell
        run: npm install --no-save --no-audit --no-fund electron-builder@26.0.12 @electron/asar@3.2.18
      - name: Build and qualify R19
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r19-stable-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r19-stable-installer
          path: |
            dist/LilacAnime-Libmpv-R19-Setup.exe
            dist/lilacanime-libmpv-r19-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish and reverify public bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 stable installer r19' --notes 'R19 fixes the real stale-shortcut launch bug after R2J migration. It keeps the qualified app payload unchanged, disables directory selection, preserves the lilacanime-desktop profile, and force-recreates Start Menu/Desktop shortcuts so they target the migrated executable.'
          if($LASTEXITCODE -ne 0){throw 'release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'release upload failed'}
          $v=Join-Path $env:RUNNER_TEMP 'r19-public';New-Item -ItemType Directory -Force -Path $v|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $v --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE -ne 0){throw 'public redownload failed'}
          $e=Join-Path $v $env:INSTALLER_NAME;$m=Get-Content (Join-Path $v $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $e).Length
          if($h -ne $env:R19_INSTALLER_SHA256 -or $z -ne [long]$env:R19_INSTALLER_SIZE -or $m.installerSha256 -ne $h -or $m.staleShortcutRegression -ne 'real-r2j-old-target-forced-pass'){throw 'public verification mismatch'}
          Write-Host "R19_PUBLISHED_OK sha256=$h size=$z shortcutRetarget=forced profileRetained=1"
