name: LilacAnime Libmpv R38 updater channel repair

on:
  push:
    branches: [libmpv-r3f-054-r38-updater-channel-repair]
    paths:
      - .github/workflows/libmpv-r3f-054-r38-updater-channel-repair.yml
      - scripts/r38-updater-channel-fix.cjs
      - scripts/r38-updater-channel-smoke.cjs
      - scripts/r38-qualified-build.ps1
      - scripts/r37-transform-anchor-compat.cjs
      - scripts/r37-explicit-handoff-clean-focus.cjs
      - scripts/r37-node-api-wake-owner-fix.cjs
      - scripts/r37-native-handoff-freeze-smoke.cjs
      - scripts/r37-explicit-handoff-e2e-smoke.cjs
      - scripts/r37-run-e2e-with-timeout.cjs
      - scripts/r37-node-api-callback-diagnostic.cjs
      - scripts/r37-qualified-build.ps1
      - scripts/r36-transform-r35-anchor-compat.cjs
      - scripts/r36-handoff-ack-subtitle-stability.cjs
      - scripts/r36-qualified-build.ps1
      - scripts/r35-hosted-native-startup-hardening.cjs
      - scripts/r35-paused-handoff-ui-recovery.cjs
      - scripts/r34-focus-handoff-stall-fix.cjs
      - scripts/r34-handoff-ack-hardening.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r38-updater-channel-repair
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r38
  INSTALLER_NAME: LilacAnime-Libmpv-R38-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r38-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc18
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Preflight R38 scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/r38-updater-channel-fix.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node --check scripts/r38-updater-channel-smoke.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node --check scripts/r37-transform-anchor-compat.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node --check scripts/r37-explicit-handoff-clean-focus.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node --check scripts/r37-node-api-wake-owner-fix.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node --check scripts/r37-native-handoff-freeze-smoke.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node --check scripts/r37-explicit-handoff-e2e-smoke.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Write-Host 'R38_PREFLIGHT_SYNTAX_OK updaterFix=checked updaterSmoke=checked R37PlaybackProof=retained'

      - name: Build and qualify R38
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/r32-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r33-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r36-transform-r35-anchor-compat.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          ./scripts/r38-qualified-build.ps1

      - name: Upload qualified R38 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r38-updater-channel-repair
          path: |
            dist/LilacAnime-Libmpv-R38-Setup.exe
            dist/lilacanime-libmpv-r38-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish and reverify public R38 bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r38 updater channel repair' --notes 'R38 is R37 playback code plus an updater-only repair. It fixes the custom-channel identity drift by forcing package.json.lilacCustomTag to the exact release tag, keeps the existing 5-second launch check and background download/install-on-quit behavior, retries a failed launch check after 60 seconds, and falls back from the unauthenticated GitHub Releases API to the public GitHub release HTML/expanded-assets pages when API discovery is rate-limited or temporarily unavailable. CI mocks both the normal API-current case and an API-403 plus HTML-fallback newer-release case, requires automatic background download dispatch for the newer release, verifies the packaged ASAR carries the exact custom tag and updater markers, then reruns all inherited R37 raw sharedTexture/focus-handoff qualification. R33 unfocused native-only owned popup and focused direct WebGPU are unchanged.'
          if($LASTEXITCODE-ne 0){throw 'R38 release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'R38 release upload failed'}

          $verify=Join-Path $env:RUNNER_TEMP 'r38-public'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R38 public redownload failed'}

          $exe=Join-Path $verify $env:INSTALLER_NAME
          $manifest=Get-Content (Join-Path $verify $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if($manifest.version-ne $env:APP_VERSION -or
             $manifest.qualifiedSourceSha-ne $env:QUALIFIED_SOURCE_SHA -or
             $manifest.installerSha256-ne $hash -or
             [long]$manifest.installerSize-ne $size -or
             $manifest.electron-ne $env:ELECTRON_VERSION -or
             $manifest.nativeDll-ne $env:QUALIFIED_DLL_SHA256){throw 'R38 public runtime identity mismatch'}
          if($manifest.r33FocusPresenter-ne 'same-libmpv-d3d11-texture+owned-ws-popup-unfocused' -or
             $manifest.r33OwnedPopupBlackErase-ne $false -or
             $manifest.r33ChromiumDuplicateDelivery-ne $false){throw 'R38 lost R33 native-only proof'}
          if($manifest.focusedPresenter-ne 'direct-receive-webgpu-copy'){throw 'R38 focused direct WebGPU proof mismatch'}
          if($manifest.r37RuntimeSmokes-ne 'r33-native-autonomy+native-freeze+raw-real-electron-sharedtexture-active+paused-subtitle+paused-no-subtitle+dep0168-zero'){throw 'R38 lost inherited R37 runtime proof'}
          if($manifest.customUpdateTag-ne $env:RELEASE_TAG){throw 'R38 public custom update tag mismatch'}
          if($manifest.customUpdaterDiscovery-ne 'github-api+public-release-html-fallback'){throw 'R38 updater discovery proof mismatch'}
          if($manifest.customUpdaterStartup-ne '5s-initial+60s-error-retry+3h-periodic'){throw 'R38 updater startup proof mismatch'}
          if($manifest.customUpdaterInstall-ne 'background-download+install-on-quit'){throw 'R38 updater install proof mismatch'}
          if($manifest.r38UpdaterSmoke-ne 'current-api+api403-html-fallback-newer+background-download+packaged-tag'){throw 'R38 updater smoke proof mismatch'}
          Write-Host "R38_PUBLISHED_OK sha256=$hash size=$size electron=$($manifest.electron) customTag=$($manifest.customUpdateTag) discovery=api+html startup=5s+60s-retry+3h install=background-download+quit playback=R37-unchanged"
