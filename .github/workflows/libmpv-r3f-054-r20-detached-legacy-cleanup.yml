name: LilacAnime Libmpv stable installer r20

on:
  push:
    branches: [libmpv-r3f-054-stable-installer-r16]
    paths: [.github/workflows/libmpv-r3f-054-r20-detached-legacy-cleanup.yml]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r20-stable-installer
  cancel-in-progress: true

permissions:
  contents: write

env:
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r19
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R19-Setup.exe
  BASE_INSTALLER_SHA256: bd586fc18e4d82a30388b3f1f60fc89b8aa6cfc4cc30cc9eb4efaeb74a73e7aa
  BASE_APP_EXE_SHA256: 634417d59946c31895d25c3ae6f4e12e586d7b3eefbc2a37776db6587e1ade40
  BASE_APP_ASAR_SHA256: 23f6e6b0c1f6705d82b24e8b8cc55d2bbd063ab16d78ada75a8c06b96bb41560
  BASE_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  BASE_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  R2J_RELEASE_TAG: libmpv-r2j-subtitle-fix-b12a77cc5910
  R2J_INSTALLER_NAME: LilacAnime-Libmpv-R2J-SubtitleFix-Setup.exe
  R2J_INSTALLER_SHA256: 32a422e10699db63d13c7105bd93e55f63234af529b787104b1e89442ad55ab6
  RELEASE_TAG: libmpv-r2k-v0.5.54-r20
  INSTALLER_NAME: LilacAnime-Libmpv-R20-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r20-manifest.json
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_FOLDER_NAME: LilacAnime-Libmpv
  APP_VERSION: 0.5.54-libmpv-r3f.rc1

jobs:
  stable-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install packaging tools
        shell: powershell
        run: npm install --no-save --no-audit --no-fund electron-builder@26.0.12 @electron/asar@3.2.18
      - name: Build and qualify R20 detached legacy repair
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r20-stable-installer.ps1
      - name: Upload qualified R20
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r20-stable-installer
          path: |
            dist/LilacAnime-Libmpv-R20-Setup.exe
            dist/lilacanime-libmpv-r20-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish and reverify public bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 stable installer r20' --notes 'R20 repairs machines where the stable install is already registered but the old LilacAnime-Libmpv-R2J-SubtitleFix folder remains detached and can still be launched by a stale Windows pin. It removes only that exact legacy Electron app folder, force-recreates canonical shortcuts, preserves the lilacanime-desktop profile, and keeps the qualified app payload byte-identical.'
          if($LASTEXITCODE -ne 0){throw 'release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'release upload failed'}
          $v=Join-Path $env:RUNNER_TEMP 'r20-public';New-Item -ItemType Directory -Force -Path $v|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $v --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE -ne 0){throw 'public redownload failed'}
          $e=Join-Path $v $env:INSTALLER_NAME;$m=Get-Content (Join-Path $v $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $e).Length
          if($h-ne $env:R20_INSTALLER_SHA256 -or $z-ne [long]$env:R20_INSTALLER_SIZE -or $m.installerSha256-ne $h -or $m.detachedLegacyRegression-ne 'stable-registry-plus-restored-old-folder-pass'){throw 'public verification mismatch'}
          Write-Host "R20_PUBLISHED_OK sha256=$h size=$z detachedLegacyRemoved=1 profileRetained=1"
