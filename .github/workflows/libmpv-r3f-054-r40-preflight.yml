name: LilacAnime Libmpv R40 preflight

on:
  push:
    branches: [libmpv-r3f-054-r40-callback-pacing-subtitle-overlay]
    paths:
      - .github/workflows/libmpv-r3f-054-r40-preflight.yml
      - scripts/r40-*.cjs
      - scripts/r40-preflight.ps1
      - electron/r40-subtitle-overlay.html
      - electron/r40-subtitle-overlay-preload.cjs
      - electron/r40-subtitle-overlay-window.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r40-preflight
  cancel-in-progress: true

permissions:
  contents: read

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r39
  INSTALLER_NAME: LilacAnime-Libmpv-R39-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r39-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc19
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12
      - name: Syntax-check R40 candidate support
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @(
            'scripts/r40-callback-pacing-fix.cjs',
            'scripts/r40-callback-watchdog-authority-correction.cjs',
            'scripts/r40-release-pump-authority-correction.cjs',
            'scripts/r40-schedule-callsite-audit.cjs',
            'scripts/r40-callback-pacing-runtime-smoke.cjs',
            'scripts/r40-native-subtitle-overlay-runtime-smoke.cjs',
            'scripts/r40-fontface-overlay-diagnostic-smoke.cjs',
            'scripts/r40-subtitle-runtime-focus-hardening.cjs',
            'scripts/r40-subtitle-runtime-coverage-hardening.cjs',
            'scripts/r40-subtitle-controller-lifecycle-hardening.cjs',
            'scripts/r40-single-dom-subtitle-overlay-fix.cjs',
            'scripts/r40-subtitle-anchor-compat.cjs',
            'scripts/r40-run-electron-gate.cjs',
            'scripts/r40-rebundle-renderer.cjs',
            'scripts/r40-finalize-identity.cjs',
            'electron/r40-subtitle-overlay-preload.cjs',
            'electron/r40-subtitle-overlay-window.cjs'
          )){
            node --check $script
            if($LASTEXITCODE-ne 0){throw "R40 preflight syntax failed $script"}
          }
          $compatProbe=Join-Path $env:RUNNER_TEMP 'r40-single-dom-subtitle-overlay-fix.compat-probe.cjs'
          Copy-Item 'scripts/r40-single-dom-subtitle-overlay-fix.cjs' $compatProbe -Force
          node scripts/r40-subtitle-anchor-compat.cjs $compatProbe
          if($LASTEXITCODE-ne 0){throw 'R40 subtitle transform compat probe failed'}
          node --check $compatProbe
          if($LASTEXITCODE-ne 0){throw 'R40 subtitle compat-probed transform syntax failed'}
          Write-Host 'R40_SUPPORT_SYNTAX_OK all-new-support=checked compatProbe=executed-before-r39-reconstruction'
      - name: Fast sandbox custom-font diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/r40-run-electron-gate.cjs scripts/r40-fontface-overlay-diagnostic-smoke.cjs R40_FONTFACE_OVERLAY_DIAGNOSTIC_OK 30000
          if($LASTEXITCODE-ne 0){throw 'R40 fast sandbox custom-font diagnostic failed'}
      - name: Reconstruct exact R39 final6 and compile R40
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/r40-preflight.ps1