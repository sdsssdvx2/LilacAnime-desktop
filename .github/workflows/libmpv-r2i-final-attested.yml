name: Libmpv R2I hardware-attested final candidate

on:
  push:
    branches: [libmpv-r2h-gpu-copy-qualification]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2i-final-attested
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_COMMIT: 78e643838b168ac961dd9631d1225b5ac8fc8ec6
  QUALIFICATION_ID: LILAC-LIBMPV-HWQ-R2I-PIPELINE-HEADROOM
  QUALIFICATION_RUN_ID: '39983791568'
  QUALIFICATION_RELEASE_TAG: libmpv-hwq-r2i-pipeline-78e643838b16
  QUALIFICATION_EXE_SHA256: 6d06dcf1543c7ec69488ce0718d846a2e525e04ee56ad17dbc686fef54ebb395
  QUALIFICATION_MANIFEST_SHA256: c18543c10de436dd66544aed5fca6879fca258f1bd875a91b4d7bf17ea738b8e
  HARDWARE_REPORT_SHA256: 62c3d214655f4156156abeb0e9bc0d6d7a09fd8ff0d66e84e8bc7f154126734b
  LIBMPV_ARCHIVE_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  ELECTRON_VERSION: 44.9.3

jobs:
  build-final-candidate:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prove source tree differs from qualified commit only by release metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git cat-file -e "$env:QUALIFIED_SOURCE_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'qualified source commit is unavailable' }
          $allowed = @(
            '.github/workflows/libmpv-r2i-final-attested.yml',
            'release-attestations/libmpv-r2i-hardware-pass-78e643838b16.json'
          )
          $changed = @(git diff --name-only "$env:QUALIFIED_SOURCE_COMMIT..HEAD")
          $unexpected = @($changed | Where-Object { $_ -and ($_ -notin $allowed) })
          Write-Host "ATTESTED_HEAD=$env:GITHUB_SHA"
          Write-Host "QUALIFIED_SOURCE_COMMIT=$env:QUALIFIED_SOURCE_COMMIT"
          Write-Host "POST_QUALIFICATION_FILES=$($changed -join ',')"
          if ($unexpected.Count -gt 0) { throw "source changed after hardware qualification: $($unexpected -join ', ')" }

      - name: Validate safe real-hardware attestation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $a = Get-Content release-attestations/libmpv-r2i-hardware-pass-78e643838b16.json -Raw | ConvertFrom-Json
          if ($a.qualificationId -ne $env:QUALIFICATION_ID) { throw 'hardware qualification ID mismatch' }
          if ($a.qualifiedSourceCommit -ne $env:QUALIFIED_SOURCE_COMMIT) { throw 'hardware source commit mismatch' }
          if ([string]$a.qualificationWorkflowRunId -ne $env:QUALIFICATION_RUN_ID) { throw 'hardware workflow run mismatch' }
          if ($a.electronVersion -ne $env:ELECTRON_VERSION) { throw 'hardware Electron version mismatch' }
          if ($a.libmpvArchiveSha256 -ne $env:LIBMPV_ARCHIVE_SHA256) { throw 'hardware libmpv pin mismatch' }
          if ($a.qualificationExeSha256 -ne $env:QUALIFICATION_EXE_SHA256) { throw 'hardware qualification EXE digest mismatch' }
          if ($a.qualificationManifestSha256 -ne $env:QUALIFICATION_MANIFEST_SHA256) { throw 'hardware qualification manifest digest mismatch' }
          if ($a.hardwareReportSha256 -ne $env:HARDWARE_REPORT_SHA256) { throw 'hardware result digest mismatch' }
          if ($a.result.status -ne 'pass' -or $a.result.stage -ne 'complete' -or $a.result.payloadVerified -ne $true) { throw 'hardware result is not a complete verified pass' }
          if ($a.result.classification -ne 'HARDWARE_SHARED_TEXTURE_RELEASE_GATE_PASS') { throw 'hardware classification mismatch' }
          if ([double]$a.throughput.measuredPresentedFps -lt 20 -or [double]$a.throughput.measuredSentFps -lt 20) { throw 'hardware throughput below release threshold' }
          if ([double]$a.throughput.measuredBackpressureRatio -gt 0.20) { throw 'hardware backpressure above release threshold' }
          if ([int]$a.throughput.texturePoolSlots -ne 24 -or [int]$a.throughput.maxPendingFrames -gt 12) { throw 'hardware pool headroom gate failed' }
          if ([double]$a.throughput.avgReleasePipelineFrames -gt 8 -or [double]$a.throughput.maxReleasePipelineFrames -gt 12) { throw 'hardware release pipeline depth gate failed' }
          foreach ($field in @('importFailures','sendFailures','drawFailures','videoFrameCloseFailures','textureReleaseFailures','gpuCopyFailures')) {
            if ([int]$a.throughput.$field -ne 0) { throw "hardware failure counter nonzero: $field" }
          }
          if ($a.media.videoCodec -ne 'h264' -or $a.media.audioCodec -ne 'aac' -or $a.media.hwdecCurrent -ne 'd3d11va' -or $a.media.audioSelected -ne $true) { throw 'hardware media qualification mismatch' }
          if ([double]$a.input.clickLatencyMs -gt 500 -or [double]$a.input.keyLatencyMs -gt 500) { throw 'hardware input latency gate failed' }
          if ([int]$a.commands.commandFailures -ne 0 -or $a.commands.pause -ne $true -or [double]$a.commands.playAdvanceSec -lt 0.45) { throw 'hardware command roundtrip gate failed' }
          foreach ($field in @('runtimeRevisionR2','pacedPump','commandNormalization','safeDiagnostics','immediateFrameRelease','drawDiagnostics','lifetimeDiagnostics','gpuCopyRenderer','lilacOnlySubtitles','nonInterceptingVideoSurface','nativeSubtitleRendererLockedOut')) {
            if ($a.architecture.$field -ne $true) { throw "hardware architecture attestation missing: $field" }
          }
          Write-Host "REAL_HARDWARE_ATTESTATION_OK presented=$($a.throughput.measuredPresentedFps) sent=$($a.throughput.measuredSentFps) pending=$($a.throughput.maxPendingFrames)/24 avgPipeline=$($a.throughput.avgReleasePipelineFrames) peakPipeline=$($a.throughput.maxReleasePipelineFrames)"

      - name: Download and verify exact qualification release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $q = Join-Path $env:RUNNER_TEMP 'qualified-r2i'
          New-Item -ItemType Directory -Force -Path $q | Out-Null
          & gh release download $env:QUALIFICATION_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $q --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe' --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.sha256.txt' --pattern 'qualification-manifest.json'
          if ($LASTEXITCODE -ne 0) { throw 'qualification release download failed' }
          $exe = Join-Path $q 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe'
          $manifestPath = Join-Path $q 'qualification-manifest.json'
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -ne $env:QUALIFICATION_EXE_SHA256) { throw "qualification EXE hash mismatch: $exeHash" }
          if ($manifestHash -ne $env:QUALIFICATION_MANIFEST_SHA256) { throw "qualification manifest hash mismatch: $manifestHash" }
          $m = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($m.qualificationId -ne $env:QUALIFICATION_ID -or $m.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT) { throw 'qualification manifest provenance mismatch' }
          if ($m.electronVersion -ne $env:ELECTRON_VERSION -or $m.libmpvArchiveSha256 -ne $env:LIBMPV_ARCHIVE_SHA256) { throw 'qualification toolchain pin mismatch' }
          if ([double]$m.acceptance.minPresentedFps -ne 20 -or [double]$m.acceptance.maxBackpressureRatio -ne 0.20 -or [int]$m.acceptance.texturePoolSlots -ne 24 -or [int]$m.acceptance.maxPendingFrames -ne 12 -or [int]$m.acceptance.maxAvgReleasePipelineFrames -ne 8 -or [int]$m.acceptance.maxPeakReleasePipelineFrames -ne 12 -or [int]$m.acceptance.absolutePeakReleaseLatencyMaxMs -ne 500) { throw 'qualification acceptance policy mismatch' }
          $resultPath = Join-Path ([Environment]::GetFolderPath('UserProfile')) 'Downloads\LilacLibmpvHardwareQualification-result.json'
          Remove-Item $resultPath -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -ArgumentList @('--verify-only') -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path $resultPath)) { throw 'qualification portable payload self-check failed' }
          $verify = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ($verify.pass -ne $true -or $verify.payloadVerified -ne $true -or $verify.classification -ne 'PACKAGED_PAYLOAD_VERIFIED' -or $verify.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT) { throw 'qualification portable did not verify exact packaged payload' }
          "QUALIFIED_MANIFEST_PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "QUALIFICATION_RELEASE_VERIFIED exe=$exeHash manifest=$manifestHash"

      - name: Fetch pinned libmpv SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'libmpv.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'libmpv-sdk'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'libmpv download failed' }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:LIBMPV_ARCHIVE_SHA256) { throw "libmpv archive SHA mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & 7z.exe x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'libmpv extraction failed' }
          $client = Get-ChildItem $extract -Recurse -File -Filter client.h | Where-Object { $_.FullName -match '[\\/]mpv[\\/]client\.h$' } | Select-Object -First 1
          if (-not $client) { throw 'mpv/client.h not found' }
          $headerDir = Split-Path $client.FullName -Parent
          $vendor = Join-Path $PWD 'native\libmpv-d3d11-bridge\vendor\include\mpv'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          Copy-Item (Join-Path $headerDir '*') $vendor -Recurse -Force
          $dll = Get-ChildItem $extract -Recurse -File | Where-Object { $_.Name -in @('libmpv-2.dll','mpv-2.dll') } | Select-Object -First 1
          if (-not $dll) { throw 'libmpv DLL not found' }
          $runtimeDir = Join-Path $PWD 'native\libmpv-d3d11-bridge\runtime'
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          Copy-Item $dll.FullName (Join-Path $runtimeDir 'libmpv-2.dll') -Force

      - name: Install baseline dependencies
        run: npm install --no-audit --no-fund

      - name: Reproduce exact qualified R2I transforms
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/apply-libmpv-d2-diagnostics.cjs',
            'scripts/apply-libmpv-r2-runtime-fixes.cjs',
            'scripts/apply-libmpv-r2b-command-import-diagnostics.cjs',
            'scripts/apply-libmpv-r2c-texture-pool.cjs',
            'scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs',
            'scripts/apply-libmpv-r2g-electron44-releasefix.cjs',
            'scripts/apply-libmpv-r2h-webgpu-copy.cjs',
            'scripts/apply-libmpv-r2i-pipeline-headroom.cjs',
            'scripts/apply-libmpv-r2h-bundle-marker-fix.cjs',
            'scripts/apply-libmpv-shared-texture.cjs',
            'scripts/apply-libmpv-r2e-native-command-gates.cjs'
          )
          foreach ($s in $scripts) {
            node --check $s
            if ($LASTEXITCODE -ne 0) { throw "syntax check failed: $s" }
            node $s
            if ($LASTEXITCODE -ne 0) { throw "transform failed: $s" }
          }
          node -e "const v=require('./package.json').devDependencies.electron;if(v!=='44.9.3')throw new Error('transformed Electron pin '+v);console.log('R2I_TRANSFORMS_REPRODUCED electron='+v)"

      - name: Install exact Electron 44.9.3 and build native payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund node-gyp@12.2.0 @electron/asar@3.2.18
          $installed = node -p "require('electron/package.json').version"
          if ($installed -ne $env:ELECTRON_VERSION) { throw "installed Electron mismatch: $installed" }
          $nodeGyp = Join-Path $PWD 'node_modules\.bin\node-gyp.cmd'
          & $nodeGyp rebuild --directory native/libmpv-d3d11-bridge --target=$installed --dist-url=https://electronjs.org/headers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item native/libmpv-d3d11-bridge/build/Release/lilac_libmpv_player_bridge.node electron/lilac-libmpv-player-bridge.node -Force
          Copy-Item native/libmpv-d3d11-bridge/runtime/libmpv-2.dll electron/libmpv-2.dll -Force

      - name: Prove rebuilt qualified runtime is byte-identical to qualification manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content $env:QUALIFIED_MANIFEST_PATH -Raw | ConvertFrom-Json
          $critical = @(
            'electron/lilac-libmpv-player-bridge.node',
            'electron/libmpv-2.dll',
            'electron/libmpv-shared-main.cjs',
            'electron/preload-libmpv-shared.generated.cjs',
            'src/libmpv-shared-entry.js',
            'src/libmpv-shared.generated.js',
            'electron/libmpv-hardware-qualification.cjs'
          )
          foreach ($relative in $critical) {
            if (-not (Test-Path $relative)) { throw "qualified runtime file missing: $relative" }
            $expectedProp = $m.payloadSha256.PSObject.Properties[$relative]
            if (-not $expectedProp) { throw "qualification manifest has no hash for $relative" }
            $expected = [string]$expectedProp.Value
            $actual = (Get-FileHash $relative -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "QUALIFIED_RUNTIME_HASH $relative $actual"
            if ($actual -ne $expected) { throw "qualified payload hash mismatch for $relative expected=$expected actual=$actual" }
          }
          Write-Host 'QUALIFIED_RUNTIME_BYTE_IDENTITY_OK'

      - name: Re-run native and application regression gates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ELECTRON_RUN_AS_NODE = '1'
          foreach ($s in @('scripts/libmpv-d3d11-smoke.cjs','scripts/libmpv-d3d11-stream-smoke.cjs','scripts/smoke-libmpv-native-retention-fhd.cjs','scripts/smoke-libmpv-r2-pump-sim.cjs','scripts/smoke-libmpv-relay-av.cjs','scripts/smoke-libmpv-native-command-roundtrip.cjs')) {
            & npx.cmd electron $s
            if ($LASTEXITCODE -ne 0) { throw "runtime regression gate failed: $s" }
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs
          if ($LASTEXITCODE -ne 0) { throw 'renderer input stress gate failed' }
          node --test tests/player-interactions.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'player interaction regression gate failed' }
          node scripts/smoke-flix-proxy-fixture.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Flix fixture gate failed' }

      - name: Classify hosted shared runtime without overriding hardware attestation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $eligibilityFile = Join-Path $env:RUNNER_TEMP 'hosted-shared-runtime.json'
          Remove-Item $eligibilityFile -Force -ErrorAction SilentlyContinue
          $env:LILAC_ALLOW_HOSTED_GPU_UNAVAILABLE = '1'
          $env:LILAC_RELEASE_ELIGIBILITY_FILE = $eligibilityFile
          $env:LIBMPV_MIN_PRESENT_FPS = '20'
          $env:LIBMPV_MAX_BACKPRESSURE_RATIO = '0.20'
          & npx.cmd electron scripts/smoke-libmpv-shared-runtime.cjs
          $code = $LASTEXITCODE
          Remove-Item Env:LILAC_ALLOW_HOSTED_GPU_UNAVAILABLE -ErrorAction SilentlyContinue
          Remove-Item Env:LILAC_RELEASE_ELIGIBILITY_FILE -ErrorAction SilentlyContinue
          Remove-Item Env:LIBMPV_MIN_PRESENT_FPS -ErrorAction SilentlyContinue
          Remove-Item Env:LIBMPV_MAX_BACKPRESSURE_RATIO -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit $code }
          if (Test-Path $eligibilityFile) {
            $h = Get-Content $eligibilityFile -Raw | ConvertFrom-Json
            Write-Host "HOSTED_SHARED_RUNTIME_CLASSIFICATION=$($h.classification)"
            Write-Host "HOSTED_SHARED_RUNTIME_RELEASE_ELIGIBLE=$($h.releaseEligible)"
          }
          Write-Host 'REAL_HARDWARE_ATTESTATION_REMAINS_RELEASE_AUTHORITY=true'

      - name: Verify final transformed security and R2I architecture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Get-Content electron/main.cjs -Raw
          $bridge = Get-Content electron/libmpv-shared-main.cjs -Raw
          $preload = Get-Content electron/preload-libmpv-shared.generated.cjs -Raw
          $qualification = Get-Content electron/libmpv-hardware-qualification.cjs -Raw
          $entry = Get-Content src/libmpv-shared-entry.js -Raw
          $player = Get-Content native/libmpv-d3d11-bridge/player_addon.cc -Raw
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($main -notmatch 'contextIsolation:\s*true' -or $main -notmatch 'nodeIntegration:\s*false' -or $main -notmatch 'sandbox:\s*true') { throw 'renderer security settings regressed' }
          if ($main -match "require\('./mpv-native-main\.cjs'\)") { throw 'legacy HWND main path returned' }
          if ($bridge -notmatch 'FRAME-INPUT-SUBTITLE-R2' -or $bridge -match 'schedulePump\(5\)') { throw 'paced R2 bridge regressed' }
          if ($bridge -notmatch "originalName === 'set_property'" -or $bridge -notmatch 'lastCommandError') { throw 'command normalization/diagnostics regressed' }
          foreach ($forbidden in @('nextCompositorTurn','setSharedTextureReceiver(async','await nextFrame()','.drawImage(')) { if ($preload.Contains($forbidden)) { throw "forbidden renderer marker survived: $forbidden" } }
          foreach ($required in @('webgpu-copy','copyExternalImageToTexture','onSubmittedWorkDone','videoFramesCreated','videoFramesClosed','textureReleaseCalls','textureReleaseFailures')) { if (-not $preload.Contains($required)) { throw "WebGPU lifetime marker missing: $required" } }
          if ($entry -match "\['sub-add'" -or $entry -notmatch 'pointer-events:none') { throw 'subtitle/input architecture regressed' }
          if ($player -notmatch 'kSharedTextureSlots = 24' -or $player -notmatch '\{\"sid\", \"no\"\}' -or $player -notmatch '\{\"sub-auto\", \"no\"\}') { throw 'native pool/subtitle lockout regressed' }
          if ($qualification -notmatch 'LILAC-LIBMPV-HWQ-R2I-PIPELINE-HEADROOM' -or $qualification -notmatch 'MAX_PENDING_FRAMES = 12' -or $qualification -notmatch 'MAX_AVG_RELEASE_PIPELINE_FRAMES = 8' -or $qualification -notmatch 'MAX_PEAK_RELEASE_PIPELINE_FRAMES = 12') { throw 'R2I pipeline gate missing' }
          if ($qualification -match 'throughput\.avgReleaseLatencyMs > 100' -or $qualification -match 'throughput\.releaseLatencyMaxMs > 300') { throw 'obsolete fixed release latency proxy returned' }
          if ($pkg.devDependencies.electron -ne $env:ELECTRON_VERSION) { throw 'Electron 44.9.3 pin regressed' }
          if ($pkg.build.asarUnpack -notcontains 'electron/lilac-libmpv-player-bridge.node' -or $pkg.build.asarUnpack -notcontains 'electron/libmpv-2.dll') { throw 'native payload unpack rules missing' }
          Write-Host 'FINAL_R2I_SECURITY_ARCHITECTURE_OK'

      - name: Label build as isolated hardware-qualified prerelease
        shell: powershell
        run: |
          @'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.version = '0.5.37-libmpv-r2i.rc1';
          p.build.appId = 'com.lilac.anime.desktop.libmpvr2icandidate';
          p.build.productName = 'LilacAnime Libmpv R2I Hardware Qualified';
          p.build.win.executableName = 'LilacAnime-Libmpv-R2I-HardwareQualified';
          p.build.win.artifactName = 'LilacAnime-Libmpv-R2I-HardwareQualified-Setup.${ext}';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'candidate package metadata update failed' }
          node -e "const p=require('./package.json');if(p.build.win.artifactName!=='LilacAnime-Libmpv-R2I-HardwareQualified-Setup.${ext}')throw new Error('candidate artifact metadata mismatch')"

      - name: Build Windows hardware-qualified candidate installer
        run: npm run dist -- --publish never

      - name: Verify packaged runtime remains byte-identical to qualified payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content $env:QUALIFIED_MANIFEST_PATH -Raw | ConvertFrom-Json
          $unpacked = Get-ChildItem dist -Directory | Where-Object { $_.Name -match 'win.*unpacked' } | Select-Object -First 1
          if (-not $unpacked) { throw 'win-unpacked output missing' }
          $nativeMap = @{
            'electron/lilac-libmpv-player-bridge.node' = (Join-Path $unpacked.FullName 'resources\app.asar.unpacked\electron\lilac-libmpv-player-bridge.node')
            'electron/libmpv-2.dll' = (Join-Path $unpacked.FullName 'resources\app.asar.unpacked\electron\libmpv-2.dll')
          }
          foreach ($relative in $nativeMap.Keys) {
            $path = $nativeMap[$relative]
            if (-not (Test-Path $path)) { throw "packaged native payload missing: $relative" }
            $expected = [string]$m.payloadSha256.PSObject.Properties[$relative].Value
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "packaged native hash mismatch for $relative" }
          }
          $asarPath = Join-Path $unpacked.FullName 'resources\app.asar'
          if (-not (Test-Path $asarPath)) { throw 'packaged app.asar missing' }
          $extract = Join-Path $env:RUNNER_TEMP 'final-app-asar'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          node -e "require('@electron/asar').extractAll(process.argv[1], process.argv[2])" $asarPath $extract
          if ($LASTEXITCODE -ne 0) { throw 'app.asar extraction failed' }
          foreach ($relative in @('electron/libmpv-shared-main.cjs','electron/preload-libmpv-shared.generated.cjs','src/libmpv-shared-entry.js','src/libmpv-shared.generated.js','electron/libmpv-hardware-qualification.cjs')) {
            $path = Join-Path $extract ($relative -replace '/', '\')
            if (-not (Test-Path $path)) { throw "packaged qualified source missing: $relative" }
            $expected = [string]$m.payloadSha256.PSObject.Properties[$relative].Value
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "packaged source hash mismatch for $relative expected=$expected actual=$actual" }
          }
          Write-Host 'PACKAGED_QUALIFIED_RUNTIME_BYTE_IDENTITY_OK'

      - name: Create installer checksum and final release attestation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'dist/LilacAnime-Libmpv-R2I-HardwareQualified-Setup.exe'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaPath = 'dist/LilacAnime-Libmpv-R2I-HardwareQualified-Setup.sha256.txt'
          Set-Content $shaPath "$hash  $($exe.Name)" -Encoding ascii
          $m = Get-Content $env:QUALIFIED_MANIFEST_PATH -Raw | ConvertFrom-Json
          $attestation = [ordered]@{
            schema = 1
            releaseType = 'hardware-qualified-prerelease'
            qualifiedSourceCommit = $env:QUALIFIED_SOURCE_COMMIT
            workflowCommit = $env:GITHUB_SHA
            workflowRunId = [long]$env:GITHUB_RUN_ID
            qualificationId = $env:QUALIFICATION_ID
            qualificationRunId = [long]$env:QUALIFICATION_RUN_ID
            qualificationReleaseTag = $env:QUALIFICATION_RELEASE_TAG
            qualificationExeSha256 = $env:QUALIFICATION_EXE_SHA256
            qualificationManifestSha256 = $env:QUALIFICATION_MANIFEST_SHA256
            hardwareReportSha256 = $env:HARDWARE_REPORT_SHA256
            electronVersion = $env:ELECTRON_VERSION
            libmpvArchiveSha256 = $env:LIBMPV_ARCHIVE_SHA256
            exactQualifiedRuntimeHashesVerifiedBeforePackaging = $true
            exactQualifiedRuntimeHashesVerifiedAfterPackaging = $true
            installer = [ordered]@{ name = $exe.Name; bytes = [long]$exe.Length; sha256 = $hash }
            qualifiedPayloadSha256 = $m.payloadSha256
          }
          $path = 'dist/LilacAnime-Libmpv-R2I-HardwareQualified-attestation.json'
          [System.IO.File]::WriteAllText((Join-Path $PWD $path), ($attestation | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "FINAL_INSTALLER_BYTES=$($exe.Length)"
          Write-Host "FINAL_INSTALLER_SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-R2I-HardwareQualified-${{ github.sha }}
          path: |
            dist/LilacAnime-Libmpv-R2I-HardwareQualified-Setup.exe
            dist/LilacAnime-Libmpv-R2I-HardwareQualified-Setup.sha256.txt
            dist/LilacAnime-Libmpv-R2I-HardwareQualified-attestation.json
            release-attestations/libmpv-r2i-hardware-pass-78e643838b16.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish isolated hardware-qualified prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'libmpv-r2i-hardware-qualified-78e643838b16'
          $exe = 'dist/LilacAnime-Libmpv-R2I-HardwareQualified-Setup.exe'
          $sha = 'dist/LilacAnime-Libmpv-R2I-HardwareQualified-Setup.sha256.txt'
          $finalAttestation = 'dist/LilacAnime-Libmpv-R2I-HardwareQualified-attestation.json'
          $hardwareAttestation = 'release-attestations/libmpv-r2i-hardware-pass-78e643838b16.json'
          $qualifiedManifest = $env:QUALIFIED_MANIFEST_PATH
          $saved = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $saved
          if ($exists) {
            & gh release upload $tag $exe $sha $finalAttestation $hardwareAttestation "$qualifiedManifest#qualification-manifest.json" --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'hardware-qualified prerelease upload failed' }
          } else {
            $notes = @"
          Hardware-qualified LilacAnime libmpv R2I candidate.

          Qualified source commit: $env:QUALIFIED_SOURCE_COMMIT
          Real-hardware qualification run: $env:QUALIFICATION_RUN_ID
          Qualification: $env:QUALIFICATION_ID
          Electron: $env:ELECTRON_VERSION

          The critical sharedTexture runtime payload is byte-for-byte matched against the exact qualification manifest before packaging and rechecked from the packaged installer payload. This is an isolated prerelease and does not replace the existing stable LilacAnime build.
          "@
            & gh release create $tag $exe $sha $finalAttestation $hardwareAttestation "$qualifiedManifest#qualification-manifest.json" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'LilacAnime libmpv R2I hardware-qualified candidate' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'hardware-qualified prerelease creation failed' }
          }
          $url = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq .url
          if ($LASTEXITCODE -ne 0 -or -not $url) { throw 'hardware-qualified prerelease URL lookup failed' }
          Write-Host "FINAL_RELEASE_TAG=$tag"
          Write-Host "FINAL_RELEASE_URL=$url"
