name: LilacAnime Libmpv R38 updater lifecycle

on:
  push:
    branches: [libmpv-r3f-054-r38-updater-lifecycle]
    paths:
      - .github/workflows/libmpv-r3f-054-r38-updater-lifecycle.yml
      - scripts/r38-updater-lifecycle-fix.cjs
      - scripts/r38-updater-lifecycle-smoke.cjs
      - scripts/r38-qualified-build.ps1
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r38-updater-lifecycle
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r38
  INSTALLER_NAME: LilacAnime-Libmpv-R38-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r38-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc18
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Preflight R38 scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/r38-updater-lifecycle-fix.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node --check scripts/r38-updater-lifecycle-smoke.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Write-Host 'R38_PREFLIGHT_SYNTAX_OK updaterLifecycle=checked actualUpdaterSmoke=checked'

      - name: Build and qualify R38
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/r32-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r33-transform-source-sanitize.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node scripts/r36-transform-r35-anchor-compat.cjs
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          ./scripts/r38-qualified-build.ps1

      - name: Upload qualified R38 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r38-updater-lifecycle
          path: |
            dist/LilacAnime-Libmpv-R38-Setup.exe
            dist/lilacanime-libmpv-r38-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish and reverify public R38 bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r38 updater lifecycle' --notes 'R38 is an updater-only correction on top of fully qualified R37. The libmpv shared bridge, direct WebGPU preload path, native addon, libmpv DLL, R33 unfocused owned-popup path, and R37 focus-handoff behavior remain byte-identical. The issue was lifecycle-related: the packaged app checked for updates five seconds after process startup and then every three hours, while tray mode can keep the process alive after the window is closed. Reopening that resident process therefore did not run the startup check again, and a downloaded update only installed on a real app quit. R38 keeps the startup and three-hour checks but also refreshes on second-instance launch, tray reveal, and window focus with a two-minute cooldown. If an update is already downloaded when a resident old build is explicitly revealed again, it installs and relaunches before showing the old build. Clean quit-time installation is preserved. Qualification evaluates the actual transformed custom updater against synthetic current/newer GitHub releases, proves newest-tag selection and auto-download, asserts package lilacCustomTag equals the release tag, repeats full R37 qualification first, and proves packaged bridge/preload/native bytes are unchanged from that R37 baseline.'
          if($LASTEXITCODE-ne 0){throw 'R38 release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'R38 release upload failed'}

          $verify=Join-Path $env:RUNNER_TEMP 'r38-public'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R38 public redownload failed'}

          $exe=Join-Path $verify $env:INSTALLER_NAME
          $manifest=Get-Content (Join-Path $verify $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if($manifest.version-ne $env:APP_VERSION -or
             $manifest.tag-ne $env:RELEASE_TAG -or
             $manifest.qualifiedSourceSha-ne $env:QUALIFIED_SOURCE_SHA -or
             $manifest.installerSha256-ne $hash -or
             [long]$manifest.installerSize-ne $size -or
             $manifest.electron-ne $env:ELECTRON_VERSION -or
             $manifest.nativeDll-ne $env:QUALIFIED_DLL_SHA256){throw 'R38 public runtime identity mismatch'}
          if($manifest.r33FocusPresenter-ne 'same-libmpv-d3d11-texture+owned-ws-popup-unfocused' -or
             $manifest.r33OwnedPopupBlackErase-ne $false -or
             $manifest.r33ChromiumDuplicateDelivery-ne $false){throw 'R38 lost R33 native-only proof'}
          if($manifest.focusedPresenter-ne 'direct-receive-webgpu-copy'){throw 'R38 focused direct WebGPU proof mismatch'}
          if($manifest.r37HandoffAck-ne 'explicit-renderer-epoch-after-direct-copy+imported-release'){throw 'R38 lost R37 handoff proof'}
          if($manifest.r38UpdaterIdentity-ne 'package-lilacCustomTag-equals-release-tag'){throw 'R38 updater identity proof mismatch'}
          if($manifest.r38UpdaterActivity-ne 'startup5s+periodic3h+second-instance+tray-show+window-focus-cooldown2m'){throw 'R38 updater activity proof mismatch'}
          if($manifest.r38ReadyInstall-ne 'install-and-relaunch-before-revealing-tray-resident-old-build'){throw 'R38 ready-install proof mismatch'}
          if($manifest.r38UpdaterRuntimeSmoke-ne 'actual-custom-updater-newest-selection+auto-download+current-latest'){throw 'R38 actual updater smoke proof mismatch'}
          if($manifest.r38PlaybackBytes-ne 'r37-bridge+preload+native-byte-identical'){throw 'R38 playback byte-preservation proof mismatch'}
          Write-Host "R38_PUBLISHED_OK sha256=$hash size=$size electron=$($manifest.electron) customTag=$($manifest.tag) updaterActivity=1 readyInstall=before-reveal actualUpdaterSmoke=1 playbackBytes=R37-unchanged"
