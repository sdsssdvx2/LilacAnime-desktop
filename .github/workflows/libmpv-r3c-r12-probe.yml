name: Libmpv R3C r12 probe

on:
  push:
    branches: [libmpv-r3b-update-callback]
    paths: [.github/workflows/libmpv-r3c-r12-probe.yml]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r3c-r12-probe
  cancel-in-progress: true

permissions:
  contents: read

env:
  R3C_SOURCE_SHA: 8536863e07fa31b4139eaf928045588ce1ab5c7c
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Reproduce upstream through R3C
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:R3C_SOURCE_SHA
          if((git rev-parse HEAD).Trim() -ne $env:R3C_SOURCE_SHA){throw 'R3C source pin mismatch'}
          $up=Join-Path $env:RUNNER_TEMP 'upstream'
          git clone --depth 1 --branch v0.5.50 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0 -or (git -C $up rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA){throw 'upstream mismatch'}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs','scripts/apply-libmpv-r2w-aspect-cadence.cjs','scripts/apply-libmpv-r2x-vsync-fullscreen.cjs','scripts/apply-libmpv-r2x-pipeline-diagnostics.cjs','scripts/rebundle-libmpv-r2x-preload.cjs','scripts/apply-libmpv-r2y-cadence-fix.cjs','scripts/apply-libmpv-r2y-timestamp-phase.cjs','scripts/apply-libmpv-r2z-direct-present-ui-fixed.cjs','scripts/apply-libmpv-r3a-decoupled-delivery.cjs','scripts/apply-libmpv-r3a-poll-cadence-fix.cjs','scripts/apply-libmpv-r3a-phase-deadline.cjs','scripts/apply-libmpv-r3b-update-callback.cjs','scripts/apply-libmpv-r3b-pending-wake.cjs','scripts/apply-libmpv-r3c-hotpath-state.cjs'
          )
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE-ne0){throw "syntax $s"};node $s;if($LASTEXITCODE-ne0){throw "transform $s"}}
          node scripts/rebundle-libmpv-r2v.cjs;if($LASTEXITCODE-ne0){throw 'renderer bundle failed'}
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 node-gyp@12.2.0
          $p=Get-Content package.json -Raw|ConvertFrom-Json
          if($p.version-ne'0.5.50-libmpv-r3c.rc1'-or$p.lilacCustomTag-ne'libmpv-r2k-v0.5.50-r12'){throw 'R3C identity mismatch'}
          $b=Get-Content electron/libmpv-shared-main.cjs -Raw;$n=Get-Content native/libmpv-d3d11-bridge/player_addon.cc -Raw
          foreach($m in @('pollPlayback','fullDiagnostics ? addon.poll(playerId) : addon.pollPlayback(playerId)','nativeWakePending','nextDelay = nextActivePumpDelay()')){if(-not$b.Contains($m)){throw "bridge marker $m"}}
          foreach($m in @('napi_value PollPlayback','mpv_render_context_set_update_callback','napi_call_threadsafe_function')){if(-not$n.Contains($m)){throw "native marker $m"}}
          if($n.Contains("DrainEvents(player);`n  const uint64_t flags = gMpv.render_context_update")){throw 'event drain remains in RenderFrame'}
          Write-Host 'R3C_REPRODUCE_OK'

      - name: Build exact-DLL R3C native addon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'libmpv.7z';$extract=Join-Path $env:RUNNER_TEMP 'sdk'
          curl.exe -L --fail --retry 3 -o $archive $env:LIBMPV_SDK_URL
          if($LASTEXITCODE-ne0){throw 'SDK download failed'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:LIBMPV_SDK_SHA256){throw 'SDK hash mismatch'}
          New-Item -ItemType Directory -Force -Path $extract|Out-Null;7z.exe x $archive "-o$extract" -y|Out-Null
          $client=Get-ChildItem $extract -Recurse -File -Filter client.h|Where-Object{$_.FullName-match'[\\/]mpv[\\/]client\.h$'}|Select-Object -First 1
          $hd=Split-Path $client.FullName -Parent;$vd=Join-Path $PWD 'native\libmpv-d3d11-bridge\vendor\include\mpv';New-Item -ItemType Directory -Force -Path $vd|Out-Null;Copy-Item (Join-Path $hd '*') $vd -Recurse -Force
          $dll=Get-ChildItem $extract -Recurse -File|Where-Object{$_.Name-in@('libmpv-2.dll','mpv-2.dll')}|Select-Object -First 1;Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          $dh=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant();if($dh-ne$env:QUALIFIED_DLL_SHA256){throw "DLL changed $dh"}
          & (Join-Path $PWD 'node_modules\.bin\node-gyp.cmd') rebuild --directory native/libmpv-d3d11-bridge --target=$env:ELECTRON_VERSION --dist-url=https://electronjs.org/headers
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Copy-Item (Resolve-Path 'native/libmpv-d3d11-bridge/build/Release/lilac_libmpv_player_bridge.node').Path electron/lilac-libmpv-player-bridge.node -Force
          $ah=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant()
          "R3C_ADDON_SHA256=$ah"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LILAC_LIBMPV_PLAYER_ADDON=$((Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LILAC_LIBMPV_DLL=$((Resolve-Path 'electron/libmpv-2.dll').Path)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R3C_NATIVE_OK addon=$ah dll=$dh"

      - name: Real callback hint and lightweight poll probes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$env:ELECTRON_RUN_AS_NODE='1'
          & npx.cmd electron scripts/smoke-libmpv-r3c-callback-signal.cjs;if($LASTEXITCODE-ne0){throw 'callback hint smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r3c-poll-latency.cjs;$exit=$LASTEXITCODE
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          if($exit-ne0){throw 'poll latency smoke failed'}
          Write-Host 'R3C_NATIVE_PROBES_OK'

      - name: Hybrid cadence under delayed transport and event-loop stalls
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/smoke-libmpv-r3a-decoupled-delivery.cjs
          if($LASTEXITCODE-ne0){throw 'hybrid cadence stress failed'}
          Write-Host 'R3C_HYBRID_STRESS_OK'

      - name: Retain UI aspect and native command behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & npx.cmd electron scripts/smoke-libmpv-r2z-ui-position-runtime.cjs;if($LASTEXITCODE-ne0){throw 'UI gate failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2w-window-aspect-runtime.cjs;if($LASTEXITCODE-ne0){throw 'aspect gate failed'}
          $env:ELECTRON_RUN_AS_NODE='1'; & npx.cmd electron scripts/smoke-libmpv-native-command-roundtrip.cjs;$exit=$LASTEXITCODE;Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          if($exit-ne0){throw 'native command gate failed'}
          Write-Host "R3C_PROBE_PASS addon=$env:R3C_ADDON_SHA256 dll=$env:QUALIFIED_DLL_SHA256"
