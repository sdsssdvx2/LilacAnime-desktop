name: Libmpv R2Y r8 publish recovery

on:
  push:
    branches: [libmpv-r2x-vsync-fullscreen]
    paths: [.github/workflows/libmpv-r2y-r8-publish-recovery.yml]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2y-r8-publish-recovery
  cancel-in-progress: true

permissions:
  contents: write

env:
  R2Y_TESTED_SHA: ccdabdd876737dd52ee2a301fc39ea68fd7e423f
  R2W_HEAD: 7aeb89c41c6779edc1c564c401651bf02404641a
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_SOURCE_COMMIT: 78e643838b168ac961dd9631d1225b5ac8fc8ec6
  QUALIFICATION_RELEASE_TAG: libmpv-hwq-r2i-pipeline-78e643838b16
  QUALIFICATION_EXE_SHA256: 6d06dcf1543c7ec69488ce0718d846a2e525e04ee56ad17dbc686fef54ebb395
  QUALIFICATION_MANIFEST_SHA256: c18543c10de436dd66544aed5fca6879fca258f1bd875a91b4d7bf17ea738b8e
  QUALIFIED_ADDON_SHA256: ee1790a87dd75a9d058ff5fc10a9e96ed2ab6863f03c3973a2c88d8eef72fe2b
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  CUSTOM_RELEASE_TAG: libmpv-r2k-v0.5.50-r8
  INSTALLER_NAME: LilacAnime-Libmpv-R2Y-Setup.exe
  MANIFEST_NAME: r2y-release-manifest.json

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reproduce exact already-qualified R2Y source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout --detach $env:R2Y_TESTED_SHA
          if((git rev-parse HEAD).Trim() -ne $env:R2Y_TESTED_SHA){throw 'R2Y source pin mismatch'}
          git diff --quiet $env:R2W_HEAD $env:R2Y_TESTED_SHA -- native
          if($LASTEXITCODE -ne 0){throw 'R2Y changed native sources'}
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.50'
          git clone --depth 1 --branch v0.5.50 https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0 -or (git -C $up rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA){throw 'upstream pin mismatch'}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          if($LASTEXITCODE -ne 0){throw 'package seed failed'}
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/apply-libmpv-r2u-v2.cjs','scripts/apply-libmpv-r2v-calibrated-subtitle-miniplayer.cjs','scripts/apply-libmpv-r2w-aspect-cadence.cjs','scripts/apply-libmpv-r2x-vsync-fullscreen.cjs','scripts/apply-libmpv-r2x-pipeline-diagnostics.cjs','scripts/rebundle-libmpv-r2x-preload.cjs','scripts/apply-libmpv-r2y-cadence-fix.cjs','scripts/apply-libmpv-r2y-timestamp-phase.cjs')
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2v.cjs
          if($LASTEXITCODE -ne 0){throw 'renderer rebundle failed'}
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          $pkg=Get-Content package.json -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2y.rc1' -or $pkg.lilacCustomTag -ne $env:CUSTOM_RELEASE_TAG -or $pkg.build.win.artifactName -ne 'LilacAnime-Libmpv-R2Y-Setup.${ext}'){throw 'R2Y identity mismatch'}
          foreach($s in @('scripts/smoke-libmpv-r2y-cadence-fix.cjs','scripts/smoke-libmpv-r2y-present-loop-sim.cjs')){& node $s;if($LASTEXITCODE -ne 0){throw "R2Y static gate failed: $s"}}
          Write-Host 'R2Y_RECOVERY_SOURCE_OK'

      - name: Bind exact qualified native payload
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $q=Join-Path $env:RUNNER_TEMP 'qualified';New-Item -ItemType Directory -Force -Path $q|Out-Null
          gh release download $env:QUALIFICATION_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $q --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe' --pattern 'qualification-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'qualification download failed'}
          $exe=Join-Path $q 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe';$mf=Join-Path $q 'qualification-manifest.json'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_EXE_SHA256){throw 'qualification EXE hash mismatch'}
          if((Get-FileHash $mf -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_MANIFEST_SHA256){throw 'qualification manifest hash mismatch'}
          $m=Get-Content $mf -Raw|ConvertFrom-Json
          if($m.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT -or $m.electronVersion -ne $env:ELECTRON_VERSION){throw 'qualification provenance mismatch'}
          $raw=Join-Path $env:RUNNER_TEMP 'qualified-extract';$nested=Join-Path $env:RUNNER_TEMP 'qualified-nested';New-Item -ItemType Directory -Force -Path $raw,$nested|Out-Null
          7z.exe x $exe "-o$raw" -y|Out-Null
          function FindPayload([string]$name){Get-ChildItem $raw,$nested -Recurse -File -Filter $name -ErrorAction SilentlyContinue|Select-Object -First 1}
          $addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll'
          if(-not $addon -or -not $dll){$i=0;foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){$i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null;7z.exe x $a.FullName "-o$out" -y|Out-Null;$addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll';if($addon -and $dll){break}}}
          if(-not $addon -or -not $dll){throw 'qualified payload missing'}
          $ah=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$dh=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ah -ne $env:QUALIFIED_ADDON_SHA256 -or $dh -ne $env:QUALIFIED_DLL_SHA256){throw 'qualified payload hash mismatch'}
          Copy-Item $addon.FullName electron/lilac-libmpv-player-bridge.node -Force;Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          & node scripts/smoke-libmpv-r2y-pump-sim.cjs
          if($LASTEXITCODE -ne 0){throw 'adaptive pump hard gate failed'}
          Write-Host "R2Y_RECOVERY_NATIVE_PUMP_OK addon=$ah dll=$dh"

      - name: Verify architecture then build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bridge=Get-Content electron/libmpv-shared-main.cjs -Raw;$preload=Get-Content electron/preload-libmpv-shared.generated.cjs -Raw;$entry=Get-Content src/libmpv-shared-entry.js -Raw;$css=Get-Content src/player-android.css -Raw
          foreach($m in @('raf-warm-staged-copy','ensureGpuPresentLoop','gpuPresentLoopTicks','copyTextureToTexture')){if(-not $preload.Contains($m)){throw "preload marker missing $m"}}
          foreach($m in @('ACTIVE_PUMP_RETRY_MS = 2','pumpExpectedFps','refreshPumpTimingState')){if(-not $bridge.Contains($m)){throw "bridge marker missing $m"}}
          if($preload.Contains('scheduleGpuPresent(gpu)') -or $preload.Contains('await requestAnimationFrame') -or $preload.Contains('setSharedTextureReceiver(async')){throw 'source lifetime/presenter regressed'}
          if(([regex]::Matches($preload,'getCurrentTexture\(\)')).Count -ne 1){throw 'swapchain acquisition mismatch'}
          if(-not $entry.Contains('object-fit:contain')){throw 'contain aspect missing'}
          if(-not $css.Contains('.immersive-player.windowed .player-top { padding-right: 158px; }') -or -not $css.Contains('.immersive-player.windowed .player-settings { right: 150px; }')){throw 'original-right UI missing'}
          $ah=(Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant();$dh=(Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ah -ne $env:QUALIFIED_ADDON_SHA256 -or $dh -ne $env:QUALIFIED_DLL_SHA256){throw 'native identity changed'}
          & npx.cmd electron-builder --win nsis --publish never
          if($LASTEXITCODE -ne 0){throw 'NSIS build failed'}
          Write-Host 'R2Y_RECOVERY_BUILD_OK'

      - name: Verify packaged installer internals
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem dist -File -Filter $env:INSTALLER_NAME|Select-Object -First 1
          if(-not $installer -or $installer.Length -lt 10000000){throw 'installer missing or too small'}
          $raw=Join-Path $env:RUNNER_TEMP 'installer';$nested=Join-Path $env:RUNNER_TEMP 'nested';$asarOut=Join-Path $env:RUNNER_TEMP 'asar';New-Item -ItemType Directory -Force -Path $raw,$nested,$asarOut|Out-Null
          7z.exe x $installer.FullName "-o$raw" -y|Out-Null
          $i=0;foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(app.*\.7z$|\.7z$|\.zip$)'}|Sort-Object Length -Descending)){$i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null;7z.exe x $a.FullName "-o$out" -y|Out-Null}
          $roots=@($raw,$nested,'dist/win-unpacked');function FindBuilt([string]$name){Get-ChildItem $roots -Recurse -File -Filter $name -ErrorAction SilentlyContinue|Select-Object -First 1}
          $addon=FindBuilt 'lilac-libmpv-player-bridge.node';$dll=FindBuilt 'libmpv-2.dll';$asar=FindBuilt 'app.asar'
          if(-not $addon -or -not $dll -or -not $asar){throw 'packaged payload missing'}
          $ah=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$dh=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ah -ne $env:QUALIFIED_ADDON_SHA256 -or $dh -ne $env:QUALIFIED_DLL_SHA256){throw 'packaged native hash mismatch'}
          & npx.cmd asar extract $asar.FullName $asarOut
          if($LASTEXITCODE -ne 0){throw 'asar extraction failed'}
          $pkg=Get-Content (Join-Path $asarOut 'package.json') -Raw|ConvertFrom-Json;$preload=Get-Content (Join-Path $asarOut 'electron/preload-libmpv-shared.generated.cjs') -Raw;$bridge=Get-Content (Join-Path $asarOut 'electron/libmpv-shared-main.cjs') -Raw;$css=Get-Content (Join-Path $asarOut 'src/player-android.css') -Raw
          if($pkg.version -ne '0.5.50-libmpv-r2y.rc1' -or $pkg.lilacCustomTag -ne $env:CUSTOM_RELEASE_TAG){throw 'packaged identity mismatch'}
          foreach($m in @('raf-warm-staged-copy','ensureGpuPresentLoop','gpuPresentLoopTicks')){if(-not $preload.Contains($m)){throw "packaged presenter marker missing $m"}}
          foreach($m in @('ACTIVE_PUMP_RETRY_MS = 2','pumpExpectedFps','refreshPumpTimingState')){if(-not $bridge.Contains($m)){throw "packaged pump marker missing $m"}}
          if(-not $css.Contains('.immersive-player.windowed .player-top { padding-right: 158px; }') -or -not $css.Contains('.immersive-player.windowed .player-settings { right: 150px; }')){throw 'packaged original-right UI missing'}
          $hash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$size=$installer.Length
          "R2Y_INSTALLER_SHA256=$hash"|Out-File $env:GITHUB_ENV -Append -Encoding utf8;"R2Y_INSTALLER_SIZE=$size"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R2Y_RECOVERY_INSTALLER_OK sha256=$hash size=$size addon=$ah dll=$dh"

      - name: Create manifest and notes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=[ordered]@{}
          $manifest.schema=1
          $manifest.releaseTag=$env:CUSTOM_RELEASE_TAG
          $manifest.testedCommit=$env:R2Y_TESTED_SHA
          $manifest.upstreamCommit=$env:UPSTREAM_SHA
          $manifest.electronVersion=$env:ELECTRON_VERSION
          $manifest.version='0.5.50-libmpv-r2y.rc1'
          $manifest.installer=$env:INSTALLER_NAME
          $manifest.installerSha256=$env:R2Y_INSTALLER_SHA256
          $manifest.installerSize=[long]$env:R2Y_INSTALLER_SIZE
          $manifest.addonSha256=$env:QUALIFIED_ADDON_SHA256
          $manifest.dllSha256=$env:QUALIFIED_DLL_SHA256
          $manifest.presentationMode='raf-warm-staged-copy'
          $manifest.sourceFrameLifetime='immediate-release'
          $manifest.nativePolling='fps-phase-aware-2ms-near-boundary'
          $manifest.topRightUiPolicy='original-right'
          $manifest|ConvertTo-Json -Depth 3|Set-Content (Join-Path dist $env:MANIFEST_NAME) -Encoding utf8
          @"
          R2Y r8 fixes the R2X hardware-observed final-presentation bottleneck and restores the original right-side OP/ED/settings layout.

          Basis: the user's R2X diagnostic showed native/receive near 23.98 fps but final presentation at 19.9 fps with 737 coalesced frames.

          R2Y uses a warm rAF WebGPU staging presenter, keeps immediate source-frame release, removes the fixed 16 ms producer poll in favor of FPS/phase-aware near-boundary polling, restores OP/ED text and the settings gear to their original right-side layout, and retains the fullscreen/aspect fixes.

          The exact R2Y source already passed the qualified-native Windows runtime checks and upstream 278/278 regression suite. This recovery run re-verifies cadence invariants, adaptive-pump hard gate, native hashes, installer internals, and published bytes.
          "@|Set-Content release-notes-r2y.md -Encoding utf8
          if(-not (Test-Path (Join-Path dist $env:MANIFEST_NAME))){throw 'manifest creation failed'}
          Write-Host 'R2Y_RECOVERY_MANIFEST_OK'

      - name: Preserve verified installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2y-r8-verified-installer
          path: |
            dist/LilacAnime-Libmpv-R2Y-Setup.exe
            dist/r2y-release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Create prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){
            gh release delete $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes
            if($LASTEXITCODE -ne 0){throw 'stale release delete failed'}
          }
          gh release create $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:R2Y_TESTED_SHA --title 'LilacAnime libmpv R2Y r8' --notes-file release-notes-r2y.md
          if($LASTEXITCODE -ne 0){throw "release create failed exit=$LASTEXITCODE"}
          Write-Host 'R2Y_RECOVERY_RELEASE_CREATED'

      - name: Upload verified assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path "dist/$env:INSTALLER_NAME").Path;$manifest=(Resolve-Path "dist/$env:MANIFEST_NAME").Path
          gh release upload $env:CUSTOM_RELEASE_TAG $installer $manifest --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw "release upload failed exit=$LASTEXITCODE"}
          Write-Host 'R2Y_RECOVERY_ASSETS_UPLOADED'

      - name: Re-download and verify published bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $verify=Join-Path $env:RUNNER_TEMP 'published';New-Item -ItemType Directory -Force -Path $verify|Out-Null
          gh release download $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE -ne 0){throw 'published download failed'}
          $d=Join-Path $verify $env:INSTALLER_NAME;$mp=Join-Path $verify $env:MANIFEST_NAME
          $hash=(Get-FileHash $d -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item $d).Length;$m=Get-Content $mp -Raw|ConvertFrom-Json
          if($hash -ne $env:R2Y_INSTALLER_SHA256 -or $size -ne [long]$env:R2Y_INSTALLER_SIZE){throw 'published installer mismatch'}
          if($m.installerSha256 -ne $hash -or [long]$m.installerSize -ne $size -or $m.testedCommit -ne $env:R2Y_TESTED_SHA -or $m.addonSha256 -ne $env:QUALIFIED_ADDON_SHA256 -or $m.dllSha256 -ne $env:QUALIFIED_DLL_SHA256){throw 'published manifest mismatch'}
          Write-Host "R2Y_RECOVERY_PUBLISHED_OK tag=$env:CUSTOM_RELEASE_TAG sha256=$hash size=$size"
