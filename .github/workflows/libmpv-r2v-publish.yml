name: Publish verified R2V r5

on:
  push:
    branches: [libmpv-r2v-calibrated-subtitle-miniplayer]
    paths: [.github/workflows/libmpv-r2v-publish.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: '40084621335'
  SOURCE_ARTIFACT: LilacAnime-Libmpv-R2V-r5
  QUALIFIED_SOURCE_SHA: 89f170a1b245313204ee23e6dbe711e41f9241ba
  RELEASE_TARGET: main
  TAG: libmpv-r2k-v0.5.50-r5
  INSTALLER: LilacAnime-Libmpv-R2V-Setup.exe
  EXPECTED_BYTES: '182516197'
  EXPECTED_SHA256: f58710fe8f0a41ece4ec231da4490c09209d12680164095b6267224ff19f5696

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download already-qualified R2V artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'r2v-qualified'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:SOURCE_ARTIFACT --dir $out
          if($LASTEXITCODE -ne 0){throw 'qualified artifact download failed'}
          $installer=Join-Path $out $env:INSTALLER
          $checksum=Join-Path $out 'LilacAnime-Libmpv-R2V-Setup.sha256.txt'
          $attestation=Join-Path $out 'LilacAnime-Libmpv-R2V-attestation.json'
          foreach($p in @($installer,$checksum,$attestation)){if(-not (Test-Path $p -PathType Leaf)){throw "qualified file missing: $p"}}
          $bytes=(Get-Item $installer).Length
          $sha=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bytes -ne [int64]$env:EXPECTED_BYTES){throw "installer size mismatch: $bytes"}
          if($sha -ne $env:EXPECTED_SHA256){throw "installer SHA mismatch: $sha"}
          $checksumText=(Get-Content $checksum -Raw).Trim()
          if($checksumText -ne "$env:EXPECTED_SHA256  $env:INSTALLER"){throw "checksum file mismatch: $checksumText"}
          $a=Get-Content $attestation -Raw|ConvertFrom-Json
          if($a.tag -ne $env:TAG -or $a.sourceSha -ne $env:QUALIFIED_SOURCE_SHA -or $a.installerSha256 -ne $env:EXPECTED_SHA256 -or [int64]$a.installerBytes -ne [int64]$env:EXPECTED_BYTES){throw 'attestation identity mismatch'}
          "INSTALLER_PATH=$installer"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM_PATH=$checksum"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ATTESTATION_PATH=$attestation"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2V_VERIFIED_ARTIFACT_OK bytes=$bytes sha=$sha sourceRun=$env:SOURCE_RUN_ID qualifiedSource=$env:QUALIFIED_SOURCE_SHA"

      - name: Publish prerelease using default-branch tag target
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $existing=$null
          try{$existing=gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null}catch{}
          if($existing){throw "release already exists: $env:TAG"}
          $notesFile=Join-Path $env:RUNNER_TEMP 'r2v-release-notes.md'
          $notes=@(
            'LilacAnime libmpv R2V r5 · calibrated subtitle parity + hardened mini-player',
            '',
            "- Qualified application source: $env:QUALIFIED_SOURCE_SHA (the release tag itself targets main only because GitHub Actions cannot create a release tag pointing at a commit that modifies workflow files without Workflows:write).",
            '- Based on exact upstream Lilac v0.5.50.',
            '- Keeps the hardware-qualified libmpv/D3D11 shared-texture/WebGPU playback pipeline and exact native addon/DLL payload unchanged.',
            '- Recalibrates ordinary VTT/SRT Lilac original against the saved original screenshot: size 105%, position 10%, line spacing 130%, Malgun Gothic 400, outline 3, width 100%, shadow 0, file colours/styles on.',
            '- Readability preset keeps the calibrated size/position/line spacing and preserves subtitle-file colours/italics. It uses Pretendard 600 + outline 2.5 only when Pretendard is actually installed; otherwise Malgun Gothic 400 + outline 3. Width is 92%, shadow 0.',
            '- Pretendard/Noto buttons distinguish installed vs missing fonts instead of silently looking identical through Malgun Gothic fallback.',
            '- The original-spacing button maps the libmpv DOM overlay to the screenshot-calibrated 130% visual line spacing while retaining reset/unset storage semantics.',
            '- Hardens the mini-player against the observed runtime state where the dedicated setMiniPlayer preload bridge is missing. A verified fallback routes through the long-standing setWindowButtons preload bridge without touching video/frame delivery.',
            '- Both the direct mini-player bridge and the missing-direct-bridge fallback were exercised in real Electron windows with button and Shift+P open/close cycles.',
            '- P remains screenshot; ASS original-effects rendering remains untouched.',
            '- Existing user subtitle settings remain preserved unless a preset or font choice is explicitly selected.'
          )
          $notes|Set-Content $notesFile -Encoding utf8
          gh release create $env:TAG $env:INSTALLER_PATH $env:CHECKSUM_PATH $env:ATTESTATION_PATH --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_TARGET --title 'LilacAnime libmpv R2V r5 - subtitle parity + mini-player runtime fix' --notes-file $notesFile --prerelease
          if($LASTEXITCODE -ne 0){throw 'R2V release publish failed'}
          Write-Host "R2V_RELEASE_PUBLISHED tag=$env:TAG releaseTarget=$env:RELEASE_TARGET qualifiedSource=$env:QUALIFIED_SOURCE_SHA sha=$env:EXPECTED_SHA256 bytes=$env:EXPECTED_BYTES"
