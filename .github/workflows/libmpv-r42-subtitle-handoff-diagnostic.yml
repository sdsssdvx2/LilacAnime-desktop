name: LilacAnime R42 subtitle handoff diagnostic installer

on:
  workflow_dispatch:
  push:
    branches: [libmpv-r3f-054-r41-visual-handoff-stall-trace]
    paths:
      - .github/workflows/libmpv-r42-subtitle-handoff-diagnostic.yml
      - scripts/r42-*

concurrency:
  group: lilac-r42-subtitle-handoff-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r39
  INSTALLER_NAME: LilacAnime-Libmpv-R39-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r39-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc19
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K
  R40_RELEASE_TAG: libmpv-r2k-v0.5.54-r40
  R40_INSTALLER_NAME: LilacAnime-Libmpv-R40-Setup.exe
  R40_MANIFEST_NAME: lilacanime-libmpv-r40-manifest.json
  R40_APP_VERSION: 0.5.54-libmpv-r3f.rc20
  R41_RELEASE_TAG: libmpv-r2k-v0.5.54-r41
  R41_INSTALLER_NAME: LilacAnime-Libmpv-R41-Setup.exe
  R41_MANIFEST_NAME: lilacanime-libmpv-r41-manifest.json
  R41_APP_VERSION: 0.5.54-libmpv-r3f.rc21
  R42_INSTALLER_NAME: LilacAnime-Libmpv-R41-D3-Diagnostic-Setup.exe
  R42_MANIFEST_NAME: lilacanime-libmpv-r41-d3-diagnostic.json
  R42_DIAGNOSTIC_TAG: libmpv-r41-d3-subtitle-handoff-${{ github.run_number }}

jobs:
  qualify-package-publish:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install qualification and packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12

      - name: Syntax-check R42 support before historical reconstruction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check scripts/r42-subtitle-handoff-diagnostic.cjs
          if($LASTEXITCODE-ne 0){throw 'R42 transform syntax failed'}
          node --check scripts/r42-package-diagnostic.cjs
          if($LASTEXITCODE-ne 0){throw 'R42 package verifier syntax failed'}

      - name: Qualify exact R41 then apply observation-only R42 diagnostics
        shell: powershell
        run: ./scripts/r42-preflight.ps1

      - name: Build and independently postqualify diagnostic installer
        shell: powershell
        run: node scripts/r42-package-diagnostic.cjs

      - name: Upload CI retention copy
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-r41-d3-subtitle-handoff-diagnostic
          path: |
            dist/LilacAnime-Libmpv-R41-D3-Diagnostic-Setup.exe
            dist/lilacanime-libmpv-r41-d3-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish updater-invisible diagnostic prerelease and reverify
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag=$env:R42_DIAGNOSTIC_TAG
          $updaterRegex='^libmpv-r2k-v\d+\.\d+\.\d+-r\d+$'
          if($tag -match $updaterRegex){throw "Diagnostic tag unexpectedly matches updater channel: $tag"}
          gh release create $tag --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title "LilacAnime R41 D3 subtitle handoff diagnostic ($env:GITHUB_RUN_NUMBER)" --notes 'Observation-only diagnostic build on top of fully qualified R41. App/version/install identity and R38 updater remain R41; the release tag intentionally does not match the R2K updater channel. It records source subtitle opacity/transition state at blur, overlay defer/replay/show/hide lifecycle, and overlay DOM opacity at commit/rAF/+50/+100/+200/+300 ms so the reported unfocused subtitle soft reveal can be separated from BrowserWindow compositor timing. Focused direct WebGPU, R41 native presenter, libmpv DLL and native addon are protected byte-for-byte.'
          if($LASTEXITCODE-ne 0){throw 'R42 diagnostic prerelease create failed'}
          gh release upload $tag "dist/$env:R42_INSTALLER_NAME" "dist/$env:R42_MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE-ne 0){throw 'R42 diagnostic asset upload failed'}

          $verify=Join-Path $env:RUNNER_TEMP 'r42-release-reverify'
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $verify --pattern $env:R42_INSTALLER_NAME --pattern $env:R42_MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'R42 diagnostic asset redownload failed'}
          $exe=Join-Path $verify $env:R42_INSTALLER_NAME
          $manifestPath=Join-Path $verify $env:R42_MANIFEST_NAME
          $manifest=Get-Content $manifestPath -Raw | ConvertFrom-Json
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $exe).Length
          if($manifest.diagnosticReleaseTag-ne $tag-or$manifest.sourceCommit-ne $env:GITHUB_SHA-or$manifest.appCustomTag-ne $env:R41_RELEASE_TAG-or$manifest.updaterVisible-ne $false-or$manifest.installerSha256-ne $hash-or[long]$manifest.installerSize-ne $size){throw 'R42 diagnostic release identity/hash mismatch'}
          if([string]$manifest.diagnosticMarker-ne 'LILAC_R42_SUBTITLE_HANDOFF_DIAGNOSTIC'){throw 'R42 diagnostic manifest marker mismatch'}

          $channel=@((gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100") | ConvertFrom-Json)
          $visible=@($channel | Where-Object { ($_.draft-ne$true) -and ([string]$_.tag_name -match $updaterRegex) -and ([string]$_.tag_name -eq $tag) })
          if($visible.Count-ne 0){throw 'R42 diagnostic release leaked into custom updater channel'}
          Write-Host "R42_DIAGNOSTIC_RELEASE_OK tag=$tag sha256=$hash size=$size updaterVisible=0"
