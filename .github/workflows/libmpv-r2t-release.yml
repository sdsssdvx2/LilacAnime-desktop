name: Libmpv R2T zero-copy miniplayer release

on:
  push:
    branches: [libmpv-r2t-zero-copy-miniplayer-subtitle-parity]
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r2t-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_TAG: v0.5.50
  UPSTREAM_SHA: 5fa931e4dbede97dc7d586864417b62bde5d7ea0
  ELECTRON_VERSION: 44.9.3
  QUALIFIED_SOURCE_COMMIT: 78e643838b168ac961dd9631d1225b5ac8fc8ec6
  QUALIFICATION_RELEASE_TAG: libmpv-hwq-r2i-pipeline-78e643838b16
  QUALIFICATION_EXE_SHA256: 6d06dcf1543c7ec69488ce0718d846a2e525e04ee56ad17dbc686fef54ebb395
  QUALIFICATION_MANIFEST_SHA256: c18543c10de436dd66544aed5fca6879fca258f1bd875a91b4d7bf17ea738b8e
  CUSTOM_RELEASE_TAG: libmpv-r2k-v0.5.50-r3

jobs:
  build-r2t:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Overlay exact upstream Lilac 0.5.50
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $up=Join-Path $env:RUNNER_TEMP 'lilac-upstream-0.5.50'
          Remove-Item $up -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 --branch $env:UPSTREAM_TAG https://github.com/whispelyn-byte/LilacAnime-desktop.git $up
          if($LASTEXITCODE -ne 0){throw 'upstream clone failed'}
          $sha=(git -C $up rev-parse HEAD).Trim();if($sha -ne $env:UPSTREAM_SHA){throw "upstream tag moved: $sha"}
          Copy-Item (Join-Path $up 'electron\*') electron -Recurse -Force
          Copy-Item (Join-Path $up 'src\*') src -Recurse -Force
          Copy-Item (Join-Path $up 'tests\*') tests -Recurse -Force
          Copy-Item (Join-Path $up 'package.json') package.json -Force
          Copy-Item (Join-Path $up 'package-lock.json') package-lock.json -Force
          Copy-Item (Join-Path $up 'scripts\anime4k-entry.mjs') scripts\anime4k-entry.mjs -Force
          if((node -p "require('./package.json').version") -ne '0.5.50'){throw 'upstream version mismatch'}
          if(-not (Test-Path electron/miruro-session.cjs)){throw '0.5.50 Miruro session module missing'}
          Write-Host "R2T_UPSTREAM_05050_OVERLAY_OK sha=$sha"

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18

      - name: Syntax-check R2T transforms and tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($s in @(
            'electron/miniplayer-window.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs','scripts/rebundle-libmpv-r2t.cjs',
            'scripts/smoke-libmpv-r2t-miniplayer-window.cjs','scripts/smoke-libmpv-r2t-miniplayer-policy.cjs','scripts/smoke-libmpv-r2t-subtitle-parity.cjs','scripts/smoke-libmpv-r2t-updater.cjs')){
            node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"}
          }
          Write-Host 'R2T_PATCH_SYNTAX_OK'

      - name: Apply qualified R2I through R2T transforms
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node -e "const fs=require('fs');const p=require('./package.json');p.version='0.5.49';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          $scripts=@(
            'scripts/apply-libmpv-d2-diagnostics.cjs','scripts/apply-libmpv-r2-runtime-fixes.cjs','scripts/apply-libmpv-r2b-command-import-diagnostics.cjs','scripts/apply-libmpv-r2c-texture-pool.cjs','scripts/apply-libmpv-r2f-immediate-frame-lifetime.cjs','scripts/apply-libmpv-r2g-electron44-releasefix.cjs','scripts/apply-libmpv-r2h-webgpu-copy.cjs','scripts/apply-libmpv-r2i-pipeline-headroom.cjs','scripts/apply-libmpv-r2h-bundle-marker-fix.cjs','scripts/apply-libmpv-r2j-subtitle-overlay.cjs','scripts/apply-libmpv-r2k-upstream-polish.cjs','scripts/apply-libmpv-r2l-player-polish.cjs','scripts/apply-libmpv-r2m-open-race-key-ui.cjs','scripts/apply-libmpv-shared-texture.cjs','scripts/apply-libmpv-r2e-native-command-gates.cjs','scripts/apply-libmpv-r2m-finalize.cjs','scripts/apply-libmpv-r2n-webgpu-pip.cjs','scripts/normalize-libmpv-r2p-subtitle-anchor.cjs','scripts/apply-libmpv-r2p-subtitle-ui.cjs','scripts/apply-libmpv-r2p-metadata-finalize.cjs','scripts/apply-libmpv-r2q-tenrai-metadata.cjs','scripts/apply-libmpv-r2r-upstream-05050-finalize.cjs','scripts/normalize-libmpv-r2s-key-anchor.cjs','scripts/apply-libmpv-r2s-pip-subtitle-controls.cjs','scripts/apply-libmpv-r2s-null-default-fix.cjs','scripts/apply-libmpv-r2s-test-expectations.cjs','scripts/normalize-libmpv-r2t-subtitle-anchor.cjs','scripts/apply-libmpv-r2t-zero-copy-miniplayer-subtitle-parity.cjs')
          foreach($s in $scripts){node --check $s;if($LASTEXITCODE -ne 0){throw "syntax failed: $s"};node $s;if($LASTEXITCODE -ne 0){throw "transform failed: $s"}}
          node scripts/rebundle-libmpv-r2t.cjs;if($LASTEXITCODE -ne 0){throw 'R2T renderer rebundle failed'}
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electron/asar@3.2.18
          $electron=node -p "require('electron/package.json').version";$version=node -p "require('./package.json').version";$tag=node -p "require('./package.json').lilacCustomTag"
          if($electron -ne $env:ELECTRON_VERSION){throw "Electron mismatch: $electron"}
          if($version -ne '0.5.50-libmpv-r2t.rc1' -or $tag -ne $env:CUSTOM_RELEASE_TAG){throw "R2T metadata mismatch: $version / $tag"}
          foreach($s in @('electron/main.cjs','electron/preload.cjs','electron/miniplayer-window.cjs','electron/updater.cjs','electron/miruro-session.cjs','src/libmpv-shared-entry.js','src/libmpv-shared.generated.js','src/player.js','src/app.js')){node --check $s;if($LASTEXITCODE -ne 0){throw "post-transform syntax failed: $s"}}
          Write-Host 'R2T_TRANSFORMS_APPLIED_OK upstream=0.5.50'

      - name: Bind exact real-hardware-qualified native payload
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $q=Join-Path $env:RUNNER_TEMP 'qualified-r2i';New-Item -ItemType Directory -Force -Path $q|Out-Null
          & gh release download $env:QUALIFICATION_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $q --pattern 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe' --pattern 'qualification-manifest.json'
          if($LASTEXITCODE -ne 0){throw 'qualification download failed'}
          $exe=Join-Path $q 'LilacLibmpvHardwareQualification-WebGPUPipeline-Electron44.exe';$manifest=Join-Path $q 'qualification-manifest.json'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_EXE_SHA256){throw 'qualification EXE SHA mismatch'}
          if((Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFICATION_MANIFEST_SHA256){throw 'qualification manifest SHA mismatch'}
          $m=Get-Content $manifest -Raw|ConvertFrom-Json
          if($m.commitSha -ne $env:QUALIFIED_SOURCE_COMMIT -or $m.electronVersion -ne $env:ELECTRON_VERSION){throw 'qualification provenance mismatch'}
          $raw=Join-Path $env:RUNNER_TEMP 'q-extract';$nested=Join-Path $env:RUNNER_TEMP 'q-nested';New-Item -ItemType Directory -Force -Path $raw,$nested|Out-Null
          & 7z.exe x $exe "-o$raw" -y|Out-Null
          function FindPayload([string]$name){Get-ChildItem $raw,$nested -Recurse -File -Filter $name -ErrorAction SilentlyContinue|Select-Object -First 1}
          $addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll'
          if(-not $addon -or -not $dll){$i=0;foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){$i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null;& 7z.exe x $a.FullName "-o$out" -y|Out-Null;$addon=FindPayload 'lilac-libmpv-player-bridge.node';$dll=FindPayload 'libmpv-2.dll';if($addon -and $dll){break}}}
          if(-not $addon -or -not $dll){throw 'qualified native payload missing'}
          $expectedAddon=[string]$m.payloadSha256.PSObject.Properties['electron/lilac-libmpv-player-bridge.node'].Value;$expectedDll=[string]$m.payloadSha256.PSObject.Properties['electron/libmpv-2.dll'].Value
          $addonHash=(Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$dllHash=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($addonHash -ne $expectedAddon -or $dllHash -ne $expectedDll){throw 'qualified native hash mismatch'}
          Copy-Item $addon.FullName electron/lilac-libmpv-player-bridge.node -Force;Copy-Item $dll.FullName electron/libmpv-2.dll -Force
          "QUALIFIED_ADDON_SHA256=$addonHash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"QUALIFIED_DLL_SHA256=$dllHash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2T_EXACT_NATIVE_REUSED addon=$addonHash dll=$dllHash"

      - name: Prove R2T UI subtitles mini player metadata and updater
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node scripts/smoke-libmpv-r2q-metadata-api.cjs;if($LASTEXITCODE -ne 0){throw 'live metadata API smoke failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2r-full-ui-startup.cjs;if($LASTEXITCODE -ne 0){throw 'full UI startup interaction failed'}
          node scripts/smoke-libmpv-r2t-miniplayer-window.cjs;if($LASTEXITCODE -ne 0){throw 'mini player lifecycle failed'}
          node scripts/smoke-libmpv-r2t-miniplayer-policy.cjs;if($LASTEXITCODE -ne 0){throw 'mini player policy failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2t-subtitle-parity.cjs;if($LASTEXITCODE -ne 0){throw 'subtitle parity failed'}
          & npx.cmd electron scripts/smoke-libmpv-vtt-overlay.cjs;if($LASTEXITCODE -ne 0){throw 'VTT overlay regression failed'}
          & npx.cmd electron scripts/smoke-libmpv-r2m-open-race.cjs;if($LASTEXITCODE -ne 0){throw 'reopen race regression failed'}
          node scripts/smoke-libmpv-r2s-key-policy.cjs;if($LASTEXITCODE -ne 0){throw 'settings/key policy failed'}
          node scripts/smoke-libmpv-r2m-key-ui.cjs;if($LASTEXITCODE -ne 0){throw 'retained key UI failed'}
          node scripts/smoke-libmpv-r2p-pipeline-untouched.cjs;if($LASTEXITCODE -ne 0){throw 'playback pipeline invariant failed'}
          node scripts/smoke-libmpv-r2t-updater.cjs;if($LASTEXITCODE -ne 0){throw 'R2T updater smoke failed'}
          Write-Host 'R2T_BEHAVIOR_SMOKES_OK fullUi=1 metadata=live subtitles=browser-parity miniplayer=zero-copy button=shared-toggle ShiftP=shared-toggle pipeline=untouched'

      - name: Run retained native and upstream 0.5.50 regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LILAC_LIBMPV_PLAYER_ADDON=(Resolve-Path 'electron/lilac-libmpv-player-bridge.node').Path;$env:LILAC_LIBMPV_DLL=(Resolve-Path 'electron/libmpv-2.dll').Path;$env:ELECTRON_RUN_AS_NODE='1'
          foreach($s in @('scripts/smoke-libmpv-native-retention-fhd.cjs','scripts/smoke-libmpv-native-command-roundtrip.cjs','scripts/smoke-libmpv-r2-pump-sim.cjs','scripts/smoke-libmpv-relay-av.cjs')){& npx.cmd electron $s;if($LASTEXITCODE -ne 0){throw "runtime regression failed: $s"}}
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          & npx.cmd electron scripts/smoke-libmpv-renderer-input-stress.cjs;if($LASTEXITCODE -ne 0){throw 'renderer input regression failed'}
          $tests=@(Get-ChildItem tests -File -Filter '*.test.cjs'|Sort-Object Name|ForEach-Object{$_.FullName})
          if(-not $tests.Count){throw 'no upstream tests found'}
          & node --test @tests
          if($LASTEXITCODE -ne 0){throw '0.5.50 regression suite failed'}
          node scripts/smoke-flix-proxy-fixture.cjs;if($LASTEXITCODE -ne 0){throw 'Flix fixture regression failed'}
          Write-Host "R2T_05050_REGRESSIONS_OK tests=$($tests.Count)"

      - name: Verify architecture and exact native identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $entry=Get-Content src/libmpv-shared-entry.js -Raw;$bundle=Get-Content src/libmpv-shared.generated.js -Raw;$player=Get-Content src/player.js -Raw;$app=Get-Content src/app.js -Raw;$index=Get-Content src/index.html -Raw;$main=Get-Content electron/main.cjs -Raw;$preload=Get-Content electron/preload.cjs -Raw;$mini=Get-Content electron/miniplayer-window.cjs -Raw
          foreach($required in @('copyExternalImageToTexture','state.fileLoaded !== true','this._loadConfirmed = true','this._ended = this._loadConfirmed &&','this._ended && !previousEnded')){if(-not $entry.Contains($required) -or -not $bundle.Contains($required)){throw "core marker missing: $required"}}
          foreach($required in @('browserBottomInset',"localStorage.getItem('vttMaxWidth') || 100",' : 1.2;',"localStorage.getItem('vttShadow') || 0")){if(-not $entry.Contains($required)){throw "subtitle parity marker missing: $required"}}
          foreach($required in @('setLibmpvMiniPlayer(','libmpvMiniPlayerActive',"event.shiftKey) { event.preventDefault(); togglePictureInPicture()",'subtitleLineHeight: 135','vttMaxWidth: 88','vttShadow: 25')){if(-not $player.Contains($required)){throw "R2T player marker missing: $required"}}
          if(-not $app.Contains("$('#miniPlayer').onclick=()=>togglePictureInPicture();")){throw 'mini player button binding missing'}
          $libStart=$player.IndexOf("if (real.tagName === 'LILAC-MPV-VIDEO') {");$libEnd=$player.IndexOf('  if (document.pictureInPictureElement)',$libStart);if($libStart -lt 0 -or $libEnd -le $libStart){throw 'libmpv mini branch missing'};$libBranch=$player.Substring($libStart,$libEnd-$libStart)
          foreach($forbidden in @('captureStream(','requestPictureInPicture(','drawPipFrame(','playPipSource(')){if($libBranch.Contains($forbidden)){throw "libmpv mini branch unexpectedly uses $forbidden"}}
          foreach($required in @("ipcMain.handle('player:miniplayer'",'MiniPlayerWindowController')){if(-not $main.Contains($required)){throw "main mini marker missing: $required"}}
          if(-not $preload.Contains("setMiniPlayer: enabled => ipcRenderer.invoke('player:miniplayer'")){throw 'preload mini bridge missing'}
          foreach($required in @('Lilac 원본','가독성 추천','영상 크기에 맞춰 자동으로 비례','Chromium 자막의 자동 간격')){if(-not $index.Contains($required)){throw "subtitle UI wording missing: $required"}}
          foreach($required in @('fullscreenRestore','setAlwaysOnTop','16 / 9')){if(-not $mini.Contains($required) -and $required -ne 'fullscreenRestore'){throw "mini controller marker missing: $required"}}
          if(-not $main.Contains("const API = 'https://api.tenrai.org/v1';") -or $main.Contains('api.jikan.moe')){throw 'metadata policy mismatch'}
          if((Get-FileHash electron/lilac-libmpv-player-bridge.node -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_ADDON_SHA256){throw 'addon identity changed'}
          if((Get-FileHash electron/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_DLL_SHA256){throw 'DLL identity changed'}
          Write-Host 'R2T_ARCHITECTURE_IDENTITY_OK upstream=0.5.50 miniplayer=same-window-zero-copy subtitles=browser-parity recommended=100/12/700/2/88/135/25 native=exact'

      - name: Build Windows R2T installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify packaged installer payload and R2T features
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem dist -File -Filter 'LilacAnime-Libmpv-R2T-Setup.exe'|Select-Object -First 1;if(-not $installer){throw 'R2T installer missing'}
          $raw=Join-Path $env:RUNNER_TEMP 'r2t-installer';$nested=Join-Path $env:RUNNER_TEMP 'r2t-nested';$asarOut=Join-Path $env:RUNNER_TEMP 'r2t-asar';New-Item -ItemType Directory -Force -Path $raw,$nested,$asarOut|Out-Null
          & 7z.exe x $installer.FullName "-o$raw" -y|Out-Null;$i=0;foreach($a in @(Get-ChildItem $raw -Recurse -File|Where-Object{$_.Name -match '(?i)(\.7z$|\.zip$)'})){$i++;$out=Join-Path $nested "a$i";New-Item -ItemType Directory -Force -Path $out|Out-Null;& 7z.exe x $a.FullName "-o$out" -y|Out-Null}
          $addon=Get-ChildItem $raw,$nested -Recurse -File -Filter 'lilac-libmpv-player-bridge.node'|Select-Object -First 1;$dll=Get-ChildItem $raw,$nested -Recurse -File -Filter 'libmpv-2.dll'|Select-Object -First 1
          if(-not $addon -or -not $dll){throw 'packaged native payload missing'}
          if((Get-FileHash $addon.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_ADDON_SHA256){throw 'packaged addon mismatch'};if((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:QUALIFIED_DLL_SHA256){throw 'packaged DLL mismatch'}
          $asar=Get-ChildItem $raw,$nested -Recurse -File -Filter 'app.asar'|Select-Object -First 1;if(-not $asar){throw 'app.asar missing'};& npx.cmd asar extract $asar.FullName $asarOut;if($LASTEXITCODE -ne 0){throw 'asar extract failed'}
          $entry=Get-Content (Join-Path $asarOut 'src/libmpv-shared.generated.js') -Raw;$player=Get-Content (Join-Path $asarOut 'src/player.js') -Raw;$app=Get-Content (Join-Path $asarOut 'src/app.js') -Raw;$index=Get-Content (Join-Path $asarOut 'src/index.html') -Raw;$main=Get-Content (Join-Path $asarOut 'electron/main.cjs') -Raw;$preload=Get-Content (Join-Path $asarOut 'electron/preload.cjs') -Raw;$mini=Get-Content (Join-Path $asarOut 'electron/miniplayer-window.cjs') -Raw;$pkg=Get-Content (Join-Path $asarOut 'package.json') -Raw|ConvertFrom-Json
          if($pkg.version -ne '0.5.50-libmpv-r2t.rc1' -or $pkg.lilacCustomTag -ne $env:CUSTOM_RELEASE_TAG){throw 'packaged R2T metadata mismatch'}
          foreach($required in @('copyExternalImageToTexture','state.fileLoaded !== true','browserBottomInset',' : 1.2;',"localStorage.getItem('vttMaxWidth') || 100")){if(-not $entry.Contains($required)){throw "packaged core/subtitle marker missing: $required"}}
          foreach($required in @('setLibmpvMiniPlayer(','libmpvMiniPlayerActive','subtitleLineHeight: 135','vttMaxWidth: 88','vttShadow: 25')){if(-not $player.Contains($required)){throw "packaged mini/subtitle marker missing: $required"}}
          if(-not $app.Contains("$('#miniPlayer').onclick=()=>togglePictureInPicture();")){throw 'packaged button binding missing'}
          foreach($required in @('Lilac 원본','가독성 추천','영상 크기에 맞춰 자동으로 비례')){if(-not $index.Contains($required)){throw "packaged subtitle UI missing: $required"}}
          foreach($required in @("ipcMain.handle('player:miniplayer'",'MiniPlayerWindowController')){if(-not $main.Contains($required)){throw "packaged main mini marker missing: $required"}}
          if(-not $preload.Contains('setMiniPlayer:')){throw 'packaged preload mini bridge missing'};if(-not $mini.Contains('setAlwaysOnTop')){throw 'packaged mini controller missing'}
          if(-not $main.Contains("const API = 'https://api.tenrai.org/v1';") -or $main.Contains('api.jikan.moe')){throw 'packaged metadata mismatch'}
          $hash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant();"R2T_INSTALLER_PATH=$($installer.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append;"R2T_INSTALLER_SHA256=$hash"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R2T_PACKAGED_VERIFY_OK bytes=$($installer.Length) sha=$hash upstream=0.5.50 miniplayer=zero-copy subtitles=browser-parity native=exact"

      - name: Create checksum and attestation
        shell: powershell
        run: |
          $installer=Get-Item $env:R2T_INSTALLER_PATH;$checksum=Join-Path $installer.DirectoryName 'LilacAnime-Libmpv-R2T-Setup.sha256.txt';[IO.File]::WriteAllText($checksum,"$env:R2T_INSTALLER_SHA256  $($installer.Name)`n",(New-Object Text.UTF8Encoding($false)))
          $att=[ordered]@{schema=1;releaseTag=$env:CUSTOM_RELEASE_TAG;version='0.5.50-libmpv-r2t.rc1';upstream='v0.5.50';upstreamSha=$env:UPSTREAM_SHA;electron=$env:ELECTRON_VERSION;qualifiedSource=$env:QUALIFIED_SOURCE_COMMIT;qualifiedAddonSha256=$env:QUALIFIED_ADDON_SHA256;qualifiedDllSha256=$env:QUALIFIED_DLL_SHA256;installerSha256=$env:R2T_INSTALLER_SHA256;subtitleOriginal=[ordered]@{size=100;position=12;weight=700;outlineScale=2;maxWidth=100;lineHeight='chromium-auto-emulated';shadow=0;fileStyle=$true;browserBaselineInset='22/720'};recommendedPreset=[ordered]@{size=100;position=12;weight=700;outlineScale=2;maxWidth=88;lineHeight=135;shadow=25;fileStyle=$false};miniPlayer=[ordered]@{mode='same-main-window-zero-copy';alwaysOnTop=$true;aspect='16:9';captureStream=$false;requestPictureInPicture=$false;subtitleDomRetained=$true;button='shared-toggle';shortcut='Shift+P';screenshotShortcut='P';restoresWindowState=$true};fixes=@('replace flaky libmpv HTML PiP capture with same-window zero-copy mini player','retain DOM subtitles in mini player without video compositing','remove extra libmpv capture stream that could add GPU pressure','restore Chromium-like VTT baseline and automatic line spacing semantics','remove misleading 720p wording from user-facing subtitle controls','preserve exact qualified native/WebGPU playback pipeline')};$att|ConvertTo-Json -Depth 7|Set-Content (Join-Path $installer.DirectoryName 'LilacAnime-Libmpv-R2T-attestation.json') -Encoding utf8
          Write-Host 'R2T_ATTESTATION_OK'

      - uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-Libmpv-R2T-0.5.50-r3
          path: |
            dist/LilacAnime-Libmpv-R2T-Setup.exe
            dist/LilacAnime-Libmpv-R2T-Setup.sha256.txt
            dist/LilacAnime-Libmpv-R2T-attestation.json
          if-no-files-found: error

      - name: Publish R2T 0.5.50-r3 prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release view $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY >nul 2>nul";$exists=($LASTEXITCODE -eq 0)
          if($exists){gh release delete $env:CUSTOM_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes;if($LASTEXITCODE -ne 0){throw 'existing R2T release delete failed'};git push origin ":refs/tags/$env:CUSTOM_RELEASE_TAG" 2>$null}
