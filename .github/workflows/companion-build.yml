name: Lilac Companion Windows Build

on:
  push:
    branches: [companion-mvp]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-build.yml'
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package.json
      - name: Install packager
        run: npm install --no-audit --no-fund
      - name: Build Windows x64 single executable
        run: npm run build:win
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $output = & .\dist\LilacCompanion.exe version
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Executable exited with $LASTEXITCODE" }
          if ($output -notmatch 'Lilac Companion 0\.1\.0') { throw "Unexpected version output: $output" }
      - name: Record SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\LilacCompanion.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LilacCompanion.exe" | Set-Content -Encoding ascii .\dist\LilacCompanion.exe.sha256
          Get-Item .\dist\LilacCompanion.exe | Select-Object Name,Length
          Get-Content .\dist\LilacCompanion.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LilacCompanion-win-x64
          path: |
            companion/dist/LilacCompanion.exe
            companion/dist/LilacCompanion.exe.sha256
          if-no-files-found: error
