name: LilacAnime Libmpv R32 Flix worker native focus surface

on:
  push:
    branches: [libmpv-r3f-054-r32-flix-worker-focus-surface]
    paths:
      - .github/workflows/libmpv-r3f-054-r32-flix-worker-focus-surface.yml
      - scripts/r32-flix-worker-native-focus-build.ps1
      - scripts/r32-flix-worker-native-focus-fix.cjs
      - scripts/r32-transform-source-sanitize.cjs
      - scripts/r32-worker-unpack-fix.cjs
      - scripts/r32-flix-worker-smoke.cjs
      - scripts/r32-native-presenter-smoke.cjs
  workflow_dispatch:

concurrency:
  group: lilac-libmpv-r32-flix-worker-native-focus-surface
  cancel-in-progress: true

permissions:
  contents: write

env:
  QUALIFIED_SOURCE_SHA: 60a7e18bd29a7aedee1b8c43f6a0efa9737c7bcc
  ELECTRON_VERSION: 44.9.3
  BASE_RELEASE_TAG: libmpv-r2k-v0.5.54-r23
  BASE_INSTALLER_NAME: LilacAnime-Libmpv-R23-Setup.exe
  BASE_INSTALLER_SHA256: 778846895dd18d62e96175222468f56334a61e4caf7fec46e87eaa027a2f39fd
  QUALIFIED_ADDON_SHA256: 17f0cba38b68082c1730a3d5dcd8f063a189ecbd10c66a5f15459772dcce0bc8
  QUALIFIED_DLL_SHA256: 04e4d27dc385dc18ddd93fbe69c75e635b864f3c6ec53a9122df54c2f7842f4a
  LIBMPV_SDK_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SDK_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  RELEASE_TAG: libmpv-r2k-v0.5.54-r32
  INSTALLER_NAME: LilacAnime-Libmpv-R32-Setup.exe
  MANIFEST_NAME: lilacanime-libmpv-r32-manifest.json
  APP_VERSION: 0.5.54-libmpv-r3f.rc12
  STABLE_APP_ID: com.lilac.anime.desktop.libmpvr2jcandidate
  STABLE_PRODUCT_NAME: LilacAnime Libmpv
  STABLE_SHORTCUT_NAME: LilacAnime Libmpv
  STABLE_EXE_BASE: LilacAnime-Libmpv-R2K

jobs:
  build-and-qualify:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install packaging helpers
        shell: powershell
        run: npm install --no-save --no-audit --no-fund @electron/asar@3.2.18 electron-builder@26.0.12
      - name: Build and qualify R32 native focus / Flix worker
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/r32-transform-source-sanitize.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/r32-flix-worker-native-focus-build.ps1
      - name: Upload qualified R32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilacanime-libmpv-r32-flix-worker-native-focus
          path: |
            dist/LilacAnime-Libmpv-R32-Setup.exe
            dist/lilacanime-libmpv-r32-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish and reverify public bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          cmd.exe /d /c "gh release delete %RELEASE_TAG% --repo %GITHUB_REPOSITORY% --yes --cleanup-tag >nul 2>nul"
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'LilacAnime Libmpv 0.5.54 r32 native focus surface + Flix worker' --notes 'R32 follows the R31 hardware evidence instead of repeating renderer-level focus experiments. R31 successfully drew 500 Canvas2D focus-shield frames with zero failures while the user still saw black flashing, so R32 disables the active Canvas2D fallback and presents the SAME libmpv D3D11 producer texture through a raw no-activate WS_CHILD/DXGI surface only while the Electron window is unfocused. Focused playback remains the qualified direct WebGPU path; no second mpv process, decoder, CPU readback, rAF gate or GPU completion fence is introduced. R32 also moves FlixCloud range fetch, Buffer.concat, XOR segment decode and five-segment prefetch to a worker_threads worker whose loopback HTTP server is contacted directly by libmpv, removing segment work from the Electron main event loop. Finally the native producer 6ms empty polling fallback becomes a callback-authoritative 250ms watchdog. R31 state coalescing, R30 managed texture release/backlog collapse, R27 diagnostics, R24 latest-frame mailbox/occlusion guards, profile identity and the pinned libmpv DLL are preserved.'
          if($LASTEXITCODE-ne 0){throw 'release create failed'}
          gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME" "dist/$env:MANIFEST_NAME" --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'release upload failed'}
          $v=Join-Path $env:RUNNER_TEMP 'r32-public';New-Item -ItemType Directory -Force -Path $v|Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $v --pattern $env:INSTALLER_NAME --pattern $env:MANIFEST_NAME
          if($LASTEXITCODE-ne 0){throw 'public redownload failed'}
          $e=Join-Path $v $env:INSTALLER_NAME;$m=Get-Content (Join-Path $v $env:MANIFEST_NAME) -Raw|ConvertFrom-Json
          $h=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$z=(Get-Item $e).Length
          if($h-ne $env:R32_INSTALLER_SHA256 -or $z-ne [long]$env:R32_INSTALLER_SIZE){throw 'public installer byte mismatch'}
          if($m.installerSha256-ne $h -or $m.electron-ne '44.9.3' -or $m.sharedTextureImport-ne 'function' -or $m.sharedTextureSend-ne 'function'){throw 'public runtime proof mismatch'}
          if($m.deliveryMode-ne 'serial-latest-frame-mailbox' -or $m.inactiveCompositorGuard-ne $true -or $m.cadenceHotpath-ne 'record-only-snapshot-4hz'){throw 'public qualified baseline mismatch'}
          if($m.r30ManagedReleaseProducerDrain-ne 'r27-renderer-byte-identical+managed-sync-token-release+producer-watchdog250+latest-backlog-collapse'){throw 'public R30 repair mismatch'}
          if($m.r31StateCoalesce-ne 'native-poll1000ms+renderer-wall-clock-extrapolation'){throw 'public R31 state coalesce mismatch'}
          if($m.r32FocusPresenter-ne 'same-libmpv-d3d11-texture+native-ws-child-dxgi-unfocused'){throw 'public R32 native presenter mismatch'}
          if($m.r32FlixIsolation-ne 'worker-thread-loopback-server+no-segment-main-ipc'){throw 'public R32 Flix worker mismatch'}
          if($m.r32NativeProducerWatchdog-ne 'callback-authoritative+250ms-native-watchdog'){throw 'public R32 producer watchdog mismatch'}
          if($m.nativeAddon-ne $env:R32_ADDON_SHA256 -or $m.nativeDll-ne $env:QUALIFIED_DLL_SHA256){throw 'public R32 native payload mismatch'}
          Write-Host "R32_PUBLISHED_OK sha256=$h size=$z electron=$($m.electron) addon=$($m.nativeAddon) libmpvDll=$($m.nativeDll) focused=direct-webgpu unfocused=native-child-hwnd flix=worker-thread nativeWatchdogMs=250"
